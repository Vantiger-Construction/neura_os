// Built-in Kotlin migration of home_widget 0.10.0; package sources unchanged.
// Its bundled AGP 8 classpath still selects the external KGP branch under our
// legacy AGP DSL. Match the app compiler and current AndroidX compile SDK.
group 'es.antonborri.home_widget'
version '1.0-SNAPSHOT'

ext.kotlin_version = '2.4.21'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'es.antonborri.home_widget'
    compileSdk 37

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 23
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    api "androidx.glance:glance-appwidget:1.2.0"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.work:work-runtime-ktx:2.11.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
}
