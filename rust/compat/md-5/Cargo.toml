[package]
name = "md-5"
version = "0.10.99"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"
description = "Neura-local adapter from the FRB hash call to RustCrypto md-5 0.11"

[lib]
name = "md5"

[dependencies]
md5_upstream = { package = "md-5", version = "=0.11.0" }
# Enforce the patched floor for upstream digest's transitive buffer dependency.
block-buffer = "0.12.1"
