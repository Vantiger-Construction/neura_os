[package]
name = "neura_swarm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
# Keep Tokio above the 1.53.3 fix for RUSTSEC-2026-0386.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
# Retain the Ring TLS backend used before the Reqwest 0.13 upgrade. The default
# 0.13 provider adds aws-lc-sys, whose Windows C extraction is incomplete.
# Every client must use http_client::builder to install the provider first.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
once_cell = "1.21.4"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
subtle = "2.6.1"
getrandom = "0.4.3"
zeroize = "1.9.1"
tokio-tungstenite = "0.30.0"

[dev-dependencies]
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
md5_compat = { package = "md-5", path = "compat/md-5" }
sha1_compat = { package = "sha1", path = "compat/sha1" }

# FRB 2.13 and Axum still constrain their hash dependencies to the old API.
# Retain the patched digest/block-buffer adapters. See compat/README.md.
[patch.crates-io]
md-5 = { path = "compat/md-5" }
sha1 = { path = "compat/sha1" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Threading", "Win32_System_SystemInformation"] }
