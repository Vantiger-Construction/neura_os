[package]
name = "neura_swarm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# 1.53.3 patches RUSTSEC-2026-0386; keep the lockfile on this patch release.
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2.6"
getrandom = "0.2.17"
zeroize = "1.9"
tokio-tungstenite = "0.24"

[dev-dependencies]
md5_compat = { package = "md-5", path = "compat/md-5" }
sha1_compat = { package = "sha1", path = "compat/sha1" }

# Keep FRB 2.12 and the existing WebSocket API while moving their hash calls
# to RustCrypto's patched digest/block-buffer generation. See compat/README.md.
[patch.crates-io]
md-5 = { path = "compat/md-5" }
sha1 = { path = "compat/sha1" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Threading", "Win32_System_SystemInformation"] }
