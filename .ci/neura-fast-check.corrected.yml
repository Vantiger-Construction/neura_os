name: Neura Local Runner Check

on:
  pull_request:
    branches: [Neura]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'tools/Neura-FastCheck.ps1'
      - '.github/workflows/neura-fast-check.yml'
  workflow_dispatch:

concurrency:
  group: neura-local-runner-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  validate:
    # Uses the owner's Windows computer instead of paid GitHub-hosted minutes.
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 75

    defaults:
      run:
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'

    steps:
      - name: Prepare local runner storage
        id: storage
        run: |
          $ErrorActionPreference = 'Stop'

          # Remove incomplete SDKs left by the former full-archive bootstrap.
          $oldToolCache = Join-Path $env:RUNNER_TOOL_CACHE (
            "flutter\stable-$env:FLUTTER_VERSION-x64"
          )
          if (Test-Path -LiteralPath $oldToolCache) {
            Remove-Item -LiteralPath $oldToolCache -Recurse -Force
          }

          $drives = Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' |
            Sort-Object -Property FreeSpace -Descending
          $selected = $drives |
            Where-Object { $_.FreeSpace -ge 5GB } |
            Select-Object -First 1
          if (-not $selected) {
            $report = $drives | ForEach-Object {
              '{0} free={1:N2} GB' -f $_.DeviceID, ($_.FreeSpace / 1GB)
            }
            throw "No fixed drive has 5 GB free. $($report -join '; ')"
          }

          $root = Join-Path "$($selected.DeviceID)\" 'neura-actions'
          $flutterSdk = Join-Path $root "flutter\$env:FLUTTER_VERSION"
          $pubCache = Join-Path $root 'pub-cache'
          $cargoHome = Join-Path $root 'cargo-home'
          $rustupHome = Join-Path $root 'rustup-home'
          $cargoTarget = Join-Path $root 'cargo-target'
          $tempRoot = Join-Path $root 'temp'
          $buildTarget = Join-Path $root "builds\$env:GITHUB_RUN_ID"

          # Build and temporary outputs are disposable. Keep the pinned SDK and
          # dependency caches so later local checks are much smaller and faster.
          foreach ($disposable in @(
            (Join-Path $root 'builds'),
            $tempRoot,
            $cargoTarget
          )) {
            if (Test-Path -LiteralPath $disposable) {
              Remove-Item -LiteralPath $disposable -Recurse -Force
            }
          }

          foreach ($path in @(
            $root,
            (Split-Path -Parent $flutterSdk),
            $pubCache,
            $cargoHome,
            $rustupHome,
            $cargoTarget,
            $tempRoot,
            $buildTarget
          )) {
            New-Item -ItemType Directory -Path $path -Force | Out-Null
          }

          "flutter_sdk=$flutterSdk" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "build_target=$buildTarget" |
            Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "NEURA_ACTIONS_ROOT=$root" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PUB_CACHE=$pubCache" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_HOME=$cargoHome" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTUP_HOME=$rustupHome" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$cargoTarget" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tempRoot" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tempRoot" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NEURA_BUILD_TARGET=$buildTarget" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host (
            'Selected {0} with {1:N2} GB free.' -f
              $selected.DeviceID,
              ($selected.FreeSpace / 1GB)
          )
          Write-Host "Flutter SDK: $flutterSdk"
          Write-Host "Build output: $buildTarget"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Relocate Flutter build output
        run: |
          $ErrorActionPreference = 'Stop'
          $repoBuild = Join-Path $env:GITHUB_WORKSPACE 'build'
          if (Test-Path -LiteralPath $repoBuild) {
            $item = Get-Item -LiteralPath $repoBuild -Force
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              & cmd.exe /d /c rmdir "$repoBuild"
            } else {
              Remove-Item -LiteralPath $repoBuild -Recurse -Force
            }
          }
          New-Item -ItemType Directory -Path $env:NEURA_BUILD_TARGET -Force |
            Out-Null
          New-Item -ItemType Junction -Path $repoBuild \
            -Target $env:NEURA_BUILD_TARGET | Out-Null

      - name: Install pinned Windows Flutter SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = '${{ steps.storage.outputs.flutter_sdk }}'
          $flutter = Join-Path $sdk 'bin\flutter.bat'
          $valid = $false

          if (Test-Path -LiteralPath $flutter -PathType Leaf) {
            try {
              $installed = (& $flutter --version 2>&1 | Out-String)
              $valid = $installed.Contains("Flutter $env:FLUTTER_VERSION")
            } catch {
              $valid = $false
            }
          }

          if (-not $valid) {
            if (Test-Path -LiteralPath $sdk) {
              Remove-Item -LiteralPath $sdk -Recurse -Force
            }
            New-Item -ItemType Directory -Path (Split-Path -Parent $sdk) -Force |
              Out-Null

            # A shallow tagged clone plus Windows-only precache is much smaller
            # than the 1.77 GB all-platform Windows archive and fits this runner.
            $cloneArgs = @(
              'clone',
              '--depth', '1',
              '--filter=blob:none',
              '--single-branch',
              '--branch', $env:FLUTTER_VERSION,
              'https://github.com/flutter/flutter.git',
              $sdk
            )
            & git @cloneArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Flutter clone failed with exit code $LASTEXITCODE."
            }
          }

          $flutterBin = Join-Path $sdk 'bin'
          $flutterBin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$flutterBin;$env:PATH"
          & git config --global --add safe.directory $sdk

          & $flutter config --no-analytics
          if ($LASTEXITCODE -ne 0) {
            throw "flutter config --no-analytics failed with exit code $LASTEXITCODE."
          }
          & $flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) {
            throw "Windows desktop enablement failed with exit code $LASTEXITCODE."
          }
          & $flutter precache --windows
          if ($LASTEXITCODE -ne 0) {
            throw "flutter precache --windows failed with exit code $LASTEXITCODE."
          }

          $version = (& $flutter --version 2>&1 | Out-String)
          Write-Host $version
          if (-not $version.Contains("Flutter $env:FLUTTER_VERSION")) {
            throw "Expected Flutter $env:FLUTTER_VERSION."
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NuGet
        uses: NuGet/setup-nuget@v2

      - name: Verify local tools
        run: |
          $ErrorActionPreference = 'Stop'
          flutter --version
          dart --version
          git --version
          cargo --version
          nuget help | Select-Object -First 1

      - name: Run optimized validation
        run: |
          & .\tools\Neura-FastCheck.ps1 -Root . -BuildWindows

      - name: Clean disposable local-runner output
        if: always()
        run: |
          $repoBuild = Join-Path $env:GITHUB_WORKSPACE 'build'
          if (Test-Path -LiteralPath $repoBuild) {
            $item = Get-Item -LiteralPath $repoBuild -Force
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              & cmd.exe /d /c rmdir "$repoBuild"
            } else {
              Remove-Item -LiteralPath $repoBuild -Recurse -Force \
                -ErrorAction SilentlyContinue
            }
          }
          if ($env:NEURA_BUILD_TARGET -and
              (Test-Path -LiteralPath $env:NEURA_BUILD_TARGET)) {
            Remove-Item -LiteralPath $env:NEURA_BUILD_TARGET -Recurse -Force \
              -ErrorAction SilentlyContinue
          }
