    - name: Render measured Rust coverage
      env:
        COVERAGE_TEST_OUTCOME: ${{ steps.rust_coverage.outcome }}
      run: |
        python tools/coverage/report.py --language rust --label "Rust ($RUNNER_OS)" \
          --lcov "$COVERAGE_REPORT_DIR/normalized.lcov.info" --output "$COVERAGE_REPORT_DIR" \
          --commit "$NEURA_EXPECTED_HEAD" --test-outcome "$COVERAGE_TEST_OUTCOME"
      shell: bash
      if: ${{ !cancelled() && (steps.rust_coverage.outcome == 'success' || steps.rust_coverage.outcome == 'failure') }}
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Test synthetic benchmark statistics without a model
      run: python -m unittest discover -s tools -p test_benchmark_ollama_latency.py -v
      shell: bash
      if: ${{ matrix.pr == 136 }}
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Check Rust adapter formatting
      shell: bash
      run: |
        rustfmt --edition 2021 --check rust/src/ollama_conversation.rs rust/src/ollama_latency.rs
      if: ${{ matrix.pr == 136 }}
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Check native Windows offline policy and launcher syntax
      shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
      run: |-
        Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
        & .\tools\Test-NeuraLocalConversationPolicy.ps1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if: ${{ matrix.pr == 136 }}
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Compile native method-channel owner against genuine Flutter headers
      shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
      run: |
        Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
        $ErrorActionPreference = 'Stop'
        flutter precache --windows
        if ($LASTEXITCODE -ne 0) { throw 'Windows Flutter headers unavailable.' }
        $includes = Join-Path (Join-Path $env:RUNNER_TOOL_CACHE 'flutter\3.47.5\x64') 'bin\cache\artifacts\engine\windows-x64\cpp_client_wrapper\include'
        cmake -S tools/offline_text_native_check -B build/offline-native-check "-DFLUTTER_WRAPPER_INCLUDE=$includes"
        if ($LASTEXITCODE -ne 0) { throw 'Native check configuration failed.' }
        cmake --build build/offline-native-check --config Release
        if ($LASTEXITCODE -ne 0) { throw 'Native method-channel compilation failed.' }
      if: ${{ matrix.pr == 136 }}
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Record tested commit, suite outcomes and source hashes
      id: receipt
      uses: actions/github-script@v8
      if: ${{ always() && steps.checkout.outcome == 'success' }}
      env:
        NEURA_SUITE_OUTCOMES: '{"flutter":"${{ steps.flutter_tests.outcome }}","rust":"${{ steps.rust_tests.outcome }}","clippy":"${{
          steps.clippy.outcome }}","rust_coverage":"${{ steps.rust_coverage.outcome }}","prior_steps":"${{ job.status }}"}'
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');
          const root = process.env.NEURA_SOURCE_ROOT;
          const git = (...args) => cp.execFileSync('git', args, {cwd: root, encoding: 'utf8'}).trim();
          const actual = git('rev-parse', 'HEAD');
          const number = Number(process.env.NEURA_TARGET_PR);
          const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
          const workflows = [
            'neura-coverage.yml', 'neura-1.5.1-consent-turn-safety.yml',
            number === 133 ? 'neura-data-wipe-safety.yml' : 'neura-ollama-chat.yml',
            'neura-offline-text-adapter.yml'
          ];
          const hashes = Object.fromEntries(workflows.map(name => [name,
            require('crypto').createHash('sha256').update(fs.readFileSync(path.join(root, '.github/workflows', name))).digest('hex')
          ]));
          const receipt = {
            version: 1, target_pr: number, expected_head: process.env.NEURA_EXPECTED_HEAD,
            tested_head: actual, tested_tree: git('rev-parse', 'HEAD^{tree}'),
            current_pr_head: pr.head.sha,
            head_still_current: pr.state === 'open' && pr.head.sha === actual,
            workflow_commit: process.env.NEURA_WORKFLOW_COMMIT,
            run_id: context.runId, run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            platform: 'Windows', runner: process.env.RUNNER_NAME,
            flutter_version: process.env.FLUTTER_VERSION, rust_version: process.env.RUSTUP_TOOLCHAIN,
            python_version: process.env.NEURA_PYTHON_VERSION || null,
            suite_outcomes: JSON.parse(process.env.NEURA_SUITE_OUTCOMES),
            source_workflow_sha256: hashes,
            scope: 'Supplemental Windows evidence; hosted Linux, dynamic CodeQL and existing packaging remain required.'
          };
          fs.mkdirSync(path.join(root, 'coverage'), {recursive:true});
          fs.writeFileSync(path.join(root, 'coverage', 'validation-receipt.json'), JSON.stringify(receipt, null, 2) + '\n');
          await core.summary.addHeading(`PR #${number}: Windows validation supplement`)
            .addRaw(`Tested branch head: ${actual}\n\nCurrent PR head: ${pr.head.sha}\n\n`)
            .addRaw('Linux and CodeQL are separate outstanding gates. Existing package delivery is not rerun.\n\n')
            .addCodeBlock(JSON.stringify(receipt, null, 2), 'json').write();
          if (actual !== process.env.NEURA_EXPECTED_HEAD || !receipt.head_still_current) {
            core.setFailed('PR head moved or checkout differs; this receipt cannot validate the current head.');
          }
    - name: Preserve coverage and the exact-head receipt
      id: artifacts
      uses: actions/upload-artifact@v6
      continue-on-error: true # Required delivery gate below accepts only a verified fallback.
      if: ${{ always() && steps.checkout.outcome == 'success' }}
      with:
        name: neura-validation-pr-${{ env.NEURA_TARGET_PR }}-${{ env.NEURA_EXPECTED_HEAD }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: recovery-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.NEURA_TARGET_PR }}/coverage/
        if-no-files-found: error
        retention-days: 14
    - name: Preserve bounded reports as private draft assets if artifact storage fails
      id: report_fallback
      uses: actions/github-script@v8
      if: ${{ always() && steps.checkout.outcome == 'success' && steps.artifacts.outcome == 'failure' }}
      with:
        script: |
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          const root = process.env.NEURA_SOURCE_ROOT;
          const digest = data => crypto.createHash('sha256').update(data).digest('hex');
          const pr = process.env.NEURA_TARGET_PR, head = process.env.NEURA_EXPECTED_HEAD;
          const attempt = process.env.GITHUB_RUN_ATTEMPT;
          if (!['133','136'].includes(pr) || !/^[0-9a-f]{40}$/.test(head) || !/^\d+$/.test(attempt)) {
            throw new Error('Invalid report identity.');
          }
          const allowed = ['validation-receipt.json'];
          for (const folder of ['flutter', 'rust-windows']) {
            for (const file of ['summary.json', 'summary.md', 'index.html', 'raw.lcov.info']) allowed.push(`${folder}/${file}`);
          }
          allowed.push('wipe/lcov.info');
          allowed.push('flutter/path-provenance.json');
          allowed.push('rust-windows/path-provenance.json');
          const files = [], missing = [];
          let total = 0;
          for (const relative of allowed) {
            let current = root, absent = false;
            for (const part of ['coverage', ...relative.split('/')]) {
              current = path.join(current, part);
              if (!fs.existsSync(current)) { absent = true; break; }
              if (fs.lstatSync(current).isSymbolicLink()) throw new Error('Linked report entry rejected.');
            }
            if (absent) { missing.push(relative); continue; }
            const stat = fs.statSync(current);
            if (!stat.isFile() || stat.size > 16 * 1024 * 1024) throw new Error('Invalid or oversized report.');
            let data = fs.readFileSync(current);
            if (relative.endsWith('.info')) {
              // Keep measured line coverage only; strip machine paths and function text.
              const normalized = [];
              let admitted = false;
              for (const line of data.toString('utf8').replace(/^\uFEFF/, '').split(/\r?\n/)) {
                if (line.startsWith('SF:')) {
                  const inside = (base, file) => {
                    const relative = path.relative(base, file);
                    return relative && !path.isAbsolute(relative) && relative !== '..' && !relative.startsWith(`..${path.sep}`);
                  };
                  const physical = fs.realpathSync(root);
                  const candidate = path.resolve(root, line.slice(3));
                  if ((!inside(root, candidate) && !inside(physical, candidate)) || !fs.existsSync(candidate)) {
                    admitted = false;
                    continue;
                  }
                  const resolved = fs.realpathSync(candidate);
                  if (!inside(physical, resolved) || !fs.statSync(resolved).isFile()) {
                    admitted = false;
                    continue;
                  }
                  const source = path.relative(physical, resolved).split(path.sep).join('/');
                  if (!/^(lib|rust\/src|rust\/tests|src|tests)\/[A-Za-z0-9_./-]+\.(dart|rs)$/.test(source) || source.split('/').includes('..')) {
                    admitted = false;
                    continue;
                  }
                  admitted = true;
                  normalized.push(`SF:${source}`);
                } else if (admitted && /^(DA:\d+,\d+|L[HF]:\d+|end_of_record)$/.test(line)) normalized.push(line);
              }
                if (!normalized.some(line => /^DA:\d+,\d+$/.test(line))) {
                  throw new Error(`LCOV has no verified measured lines: ${relative}`);
                }
                data = Buffer.from(normalized.join('\n') + '\n');
            }
            total += data.length;
            if (total > 32 * 1024 * 1024) throw new Error('Report bundle exceeds 32 MiB.');
            files.push({relative, name: relative.replace(/\//g, '-'), data, sha256: digest(data)});
          }
          const receiptFile = files.find(f => f.relative === 'validation-receipt.json');
          if (!receiptFile) throw new Error('Missing validation receipt; cannot preserve unlabelled evidence.');
          const receipt = JSON.parse(receiptFile.data.toString('utf8').replace(/^\uFEFF/, ''));
          if (receipt.expected_head !== head || receipt.tested_head !== head || String(receipt.target_pr) !== pr ||
              String(receipt.run_id) !== String(context.runId) || String(receipt.run_attempt) !== attempt) {
            throw new Error('Receipt identity mismatch.');
          }
          const manifest = {version: 1, target_pr: Number(pr), head, run_id: context.runId, run_attempt: attempt,
            workflow_commit: process.env.NEURA_WORKFLOW_COMMIT, missing,
            scope: 'Report-only Windows supplement. Missing files are not passing results. LCOV contains normalized repository line records only; external records and function text are omitted. Raw originals remain on the runner.',
            files: files.map(f => ({path: f.relative, name: f.name, bytes: f.data.length, sha256: f.sha256}))};
          const manifestData = Buffer.from(JSON.stringify(manifest, null, 2) + '\n');
          files.push({name: 'report-manifest.json', data: manifestData, sha256: digest(manifestData)});
          // The original coverage remains on the runner even if either delivery route fails.
          fs.writeFileSync(path.join(root, 'coverage', 'report-manifest.json'), manifestData, {flag: 'wx'});
          const {data: repository} = await github.rest.repos.get(context.repo);
          if (repository.full_name !== 'Vantiger-Construction/neura_os' || !repository.private) throw new Error('Private repository required.');
          const tag = `neura-validation-pr-${pr}-${head.slice(0,12)}-${context.runId}-${attempt}`;
          const {data: release} = await github.rest.repos.createRelease({...context.repo, tag_name: tag,
            target_commitish: head, name: `Windows validation reports: PR #${pr}, run ${context.runId}/${attempt}`,
            draft: true, prerelease: true, generate_release_notes: false,
            body: 'Report-only fallback for unavailable Actions artifact storage. Not a package, deployment, or release approval.'});
          if (!release.draft || !release.prerelease) throw new Error('Expected a draft prerelease.');
          for (const file of files) {
            const {data: asset} = await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id,
              name: file.name, data: file.data, headers: {'content-type': 'application/octet-stream', 'content-length': file.data.length}});
            const response = await github.rest.repos.getReleaseAsset({...context.repo, asset_id: asset.id,
              headers: {accept: 'application/octet-stream'}});
            const downloaded = Buffer.from(response.data);
            if (downloaded.length !== file.data.length || digest(downloaded) !== file.sha256) throw new Error('Report download verification failed.');
          }
          await core.summary.addHeading('Verified report-only fallback')
            .addLink('Private draft report assets', release.html_url)
            .addRaw(`\n\nManifest SHA-256: ${digest(manifestData)}\n\nMissing report files: ${missing.join(', ') || 'none'}\n`).write();
    - name: Require verified evidence delivery
      if: ${{ always() && steps.checkout.outcome == 'success' }}
      uses: actions/github-script@v8
      env:
        ARTIFACT_OUTCOME: ${{ steps.artifacts.outcome }}
        FALLBACK_OUTCOME: ${{ steps.report_fallback.outcome }}
      with:
        script: |
          if (process.env.ARTIFACT_OUTCOME !== 'success' && process.env.FALLBACK_OUTCOME !== 'success') {
            core.setFailed('Evidence delivery failed. Coverage and receipt remain on the runner; no validation success may be claimed.');
          }
    - name: Release completed validation output
      shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
      run: |
        $ErrorActionPreference = 'Stop'
        # Post-checkout still needs the source tree, but temporary test output
        # must not remain until a later job's two-hour stale-data cleanup.
        if (-not [string]::IsNullOrWhiteSpace($env:RUNNER_TEMP) -and
            (Test-Path -LiteralPath $env:RUNNER_TEMP -PathType Container)) {
          Set-Location -LiteralPath $env:RUNNER_TEMP
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          @("TEMP=$env:RUNNER_TEMP", "TMP=$env:RUNNER_TEMP") |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }
        if ([string]::IsNullOrWhiteSpace($env:NEURA_VALIDATION_RUN_ROOT) -or
            [string]::IsNullOrWhiteSpace($env:NEURA_SOURCE_ROOT)) {
          Write-Host 'No validation workspace was selected; nothing to release.'
          exit 0
        }
        $helper = Join-Path $env:NEURA_SOURCE_ROOT 'tools\Repair-NeuraCiStorage.ps1'
        if (Test-Path -LiteralPath $helper -PathType Leaf) {
          & $helper -ClearValidationOutput -ValidationRunRoot $env:NEURA_VALIDATION_RUN_ROOT
        } else {
          Write-Host 'Checkout did not provide the cleanup helper; leaving early-failure recovery to the next storage preflight.'
        }
      if: ${{ always() }}
      working-directory: ${{ github.workspace }}
