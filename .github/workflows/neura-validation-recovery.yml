name: Neura validation recovery (Windows supplement)
'on':
  pull_request:
    branches:
    - Neura
    paths:
    - .github/workflows/neura-validation-recovery.yml
    - docs/ACTIONS_VALIDATION_RECOVERY.md
    - tools/test_validation_recovery.py
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: read
env:
  FLUTTER_VERSION: 3.47.5
  FLUTTER_SHA256: 0ccd71931f49c2fbe394b1eeb6d79af3d624058a043ea0d03d34160581624fb8
  RUSTUP_TOOLCHAIN: 1.99.0
jobs:
  windows:
    permissions:
      contents: write # Private draft report assets only; checkout credentials are not persisted.
      pull-requests: read
    name: 'PR ${{ matrix.pr }}: exact-head Windows safety and coverage supplement'
    if: ${{ github.repository == 'Vantiger-Construction/neura_os' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name
      == github.repository) }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
        - pr: 133
          sha: b822c48be5a871d5a5e8e88825205d70534216d0
          module: state-matrix
        - pr: 136
          sha: c79aca63e861b2e4f9f049f408d27f5103170e58
          module: living-intelligence
    runs-on:
    - self-hosted
    - Windows
    - X64
    - neura
    timeout-minutes: 150
    concurrency:
      group: neura-validation-recovery-pr-${{ matrix.pr }}
      cancel-in-progress: false
    env:
      NEURA_TARGET_PR: ${{ matrix.pr }}
      NEURA_EXPECTED_HEAD: ${{ matrix.sha }}
      NEURA_STORAGE_MODULE: ${{ matrix.module }}
      NEURA_WORKFLOW_COMMIT: ${{ github.sha }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG: '1'
      COVERAGE_REPORT_DIR: coverage/rust-windows
    steps:
    - name: Reject stale or foreign target commits
      uses: actions/github-script@v8
      with:
        script: |
          const {owner, repo} = context.repo;
          const number = Number(process.env.NEURA_TARGET_PR);
          const expected = process.env.NEURA_EXPECTED_HEAD;
          const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
          if (pr.state !== 'open' || pr.head.repo.full_name !== `${owner}/${repo}` ||
              pr.head.sha !== expected) {
            throw new Error(`PR #${number} changed or is not a trusted open same-repository PR; review its new head before running.`);
          }
          core.info(`Validating PR #${number}, exact branch head ${expected}.`);
    - name: Require 16 GiB and route isolated validation output
      shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'

        $runnerWork = Split-Path -Parent $env:RUNNER_TEMP
        $systemRoot = [System.IO.Path]::GetPathRoot($runnerWork)
        if (-not $systemRoot -or -not (Test-Path -LiteralPath $systemRoot)) {
          $systemRoot = [System.IO.Path]::GetPathRoot([System.IO.Path]::GetTempPath())
          Write-Warning "RUNNER_TEMP points to an unavailable volume; using $systemRoot as the system-volume root."
        }
        $systemDriveName = $systemRoot.TrimEnd('\').TrimEnd(':')
        $systemDrive = Get-PSDrive -Name $systemDriveName -ErrorAction SilentlyContinue
        if (-not $systemDrive) {
          throw "Unable to inspect the system volume $systemRoot."
        }
        $systemFree = $systemDrive.Free
        $drive = [System.IO.DriveInfo]::GetDrives() |
          Where-Object {
            $_.IsReady -and
            ($_.Name -ne $systemRoot -or $systemFree -ge 16GB) -and
            ($_.DriveType -eq [System.IO.DriveType]::Fixed -or
             $_.DriveType -eq [System.IO.DriveType]::Removable) -and
            $_.AvailableFreeSpace -ge 16GB
          } |
          Sort-Object -Property AvailableFreeSpace -Descending |
          Select-Object -First 1
        if (-not $drive) {
          throw 'State Matrix requires one writable volume with at least 16 GiB free; the system volume requires at least 16 GiB free.'
        }

        $runKey = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
        $root = Join-Path $drive.RootDirectory.FullName "neura-ci\$runKey\$env:NEURA_STORAGE_MODULE"
        $workspace = Join-Path $root 'workspace'
        $sourceLink = Join-Path $env:GITHUB_WORKSPACE "recovery-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:NEURA_TARGET_PR"
        if (Test-Path -LiteralPath $sourceLink) {
          throw 'The run-specific checkout already exists; do not reuse unknown output.'
        }
        if (Test-Path -LiteralPath $root) {
          throw 'The run-specific validation root already exists; do not reuse unknown output.'
        }
        $pubCache = Join-Path $env:RUNNER_TOOL_CACHE 'neura-dependencies\pub-cache-flutter-3.47.5'
        New-Item -ItemType Directory -Path $workspace -Force | Out-Null
        New-Item -ItemType Directory -Path $pubCache -Force | Out-Null
        New-Item -ItemType Directory -Path (Join-Path $root 'temp') -Force | Out-Null
        New-Item -ItemType Junction -Path $sourceLink -Target $workspace | Out-Null
        @(
          "NEURA_SOURCE_ROOT=$sourceLink",
          "NEURA_VALIDATION_RUN_ROOT=$root",
          "PUB_CACHE=$pubCache",
          "TEMP=$(Join-Path $root 'temp')",
          "TMP=$(Join-Path $root 'temp')"
        ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        $cargoHome = Join-Path $env:RUNNER_TOOL_CACHE 'neura-dependencies\cargo-home'
        New-Item -ItemType Directory -Path $cargoHome -Force | Out-Null
        @(
          "CARGO_HOME=$cargoHome",
          "CARGO_TARGET_DIR=$(Join-Path $root 'temp\rust-target')"
        ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      working-directory: ${{ github.workspace }}
    - name: Check out the immutable PR head
      id: checkout
      uses: actions/checkout@v5
      with:
        ref: ${{ env.NEURA_EXPECTED_HEAD }}
        path: recovery-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.NEURA_TARGET_PR }}
        persist-credentials: false
    - name: Discover retained PowerShell 7 for the pinned coverage installer
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs'), path = require('path');
          const {spawnSync} = require('child_process');
          const candidates = [
            path.join(process.env.ProgramFiles, 'PowerShell', '7', 'pwsh.exe'),
            // Observed installed package explicitly grants NetworkService read/execute.
            // Use its physical path; Store aliases belong to interactive user profiles.
            path.join(process.env.ProgramFiles, 'WindowsApps', 'Microsoft.PowerShell_7.6.7.0_x64__8wekyb3d8bbwe', 'pwsh.exe')
          ];
          const command = '$exe=Join-Path $PSHOME pwsh.exe; $sig=Get-AuthenticodeSignature -LiteralPath $exe; @{path=$exe;major=$PSVersionTable.PSVersion.Major;version=$PSVersionTable.PSVersion.ToString();edition=$PSVersionTable.PSEdition;signature=$sig.Status.ToString();signer=$sig.SignerCertificate.Subject} | ConvertTo-Json -Compress';
          for (const candidate of candidates) {
            // The actual runner identity must successfully launch the signed runtime.
            try {
              const probe = spawnSync(candidate, ['-NoLogo', '-NoProfile', '-NonInteractive', '-Command', command],
                {encoding:'utf8', timeout:60000});
              if (probe.error || probe.status !== 0) throw new Error(`${probe.error || probe.stderr || probe.status}`);
              const runtime = JSON.parse(probe.stdout.trim());
              if (runtime.major !== 7 || runtime.edition !== 'Core' || runtime.signature !== 'Valid' ||
                  !/(^|,\s*)O=Microsoft Corporation(,|$)/.test(runtime.signer || '') ||
                  !path.isAbsolute(runtime.path) || !fs.statSync(runtime.path).isFile()) {
                throw new Error('Expected an existing Microsoft-signed PowerShell 7 Core executable.');
              }
              core.addPath(path.dirname(runtime.path));
              core.info(`Validated retained PowerShell ${runtime.version}: ${runtime.path}`);
              return;
            } catch (error) {
              core.warning(`Rejected retained PowerShell ${candidate}: ${error.message}`);
            }
          }
          throw new Error('No compatible signed PowerShell 7 was found; restore authorized runner tooling.');
    - name: Verify checkout and enable retained tools
      shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
      run: |2

        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
        $actual = (git rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $actual -cne $env:NEURA_EXPECTED_HEAD) {
          throw 'Checkout does not match the reviewed PR head.'
        }
        $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
        if (-not (Test-Path -LiteralPath (Join-Path $cargoBin 'rustup.exe') -PathType Leaf)) {
          throw 'The retained Rust installation is missing; restore runner tooling first.'
        }
        $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        $env:PATH = "$cargoBin;$env:PATH"
        & "$env:NEURA_SOURCE_ROOT\tools\Enable-NeuraFlutter.ps1" `
          -Version $env:FLUTTER_VERSION -ExpectedSha256 $env:FLUTTER_SHA256
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # RUSTUP_TOOLCHAIN is job-scoped; do not change the laptop's default toolchain.
        rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal `
          --component clippy --component rustfmt --component llvm-tools-preview
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Preflight retained CMake and the native Windows toolchain
      if: ${{ matrix.pr == 136 }}
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs'), path = require('path');
          const {spawnSync} = require('child_process');
          const run = (exe, args) => {
            const result = spawnSync(exe, args, {encoding:'utf8', timeout:60000, maxBuffer:4 * 1024 * 1024});
            if (result.error || result.status !== 0) {
              const bounded = value => {
                let text = String(value || '');
                for (const key of ['NEURA_SOURCE_ROOT', 'RUNNER_TOOL_CACHE', 'USERPROFILE', 'TEMP', 'TMP']) {
                  if (process.env[key]) text = text.split(process.env[key]).join(`<${key}>`);
                }
                text = text.replace(/(authorization\s*[:=]\s*|bearer\s+|(?:token|password|secret)\s*[:=]\s*)[^\s]+/gi, '$1[redacted]');
                return text.slice(-4000) || '(empty)';
              };
              throw new Error(`${path.basename(exe)} failed: code=${result.error?.code || 'none'}, status=${result.status}, signal=${result.signal || 'none'}\nstdout (tail):\n${bounded(result.stdout)}\nstderr (tail):\n${bounded(result.stderr)}`);
            }
            return result.stdout.trim();
          };
          const vswhere = path.join(process.env['ProgramFiles(x86)'], 'Microsoft Visual Studio', 'Installer', 'vswhere.exe');
          const installation = run(vswhere, ['-latest', '-products', '*', '-requires',
            'Microsoft.VisualStudio.Component.VC.Tools.x86.x64', '-property', 'installationPath']);
          if (!installation || installation.includes('\n') || !path.isAbsolute(installation)) {
            throw new Error('Expected one retained Visual Studio C++ installation.');
          }
          const cmake = path.join(installation, 'Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe');
          const capabilities = JSON.parse(run(cmake, ['-E', 'capabilities']));
          const version = capabilities.version;
          if (!Number.isInteger(version.major) || !Number.isInteger(version.minor) ||
              version.major < 3 || (version.major === 3 && version.minor < 14)) throw new Error('CMake 3.14 or newer is required.');
          const includes = path.join(process.env.RUNNER_TOOL_CACHE, 'flutter/3.47.5/x64/bin/cache/artifacts/engine/windows-x64/cpp_client_wrapper/include');
          if (!fs.statSync(path.join(includes, 'flutter/method_channel.h')).isFile()) throw new Error('Retained genuine Flutter header is unavailable.');
          // Configure the unchanged native gate early under the actual service identity.
          const root = process.env.NEURA_SOURCE_ROOT;
          core.info(run(cmake, ['-S', path.join(root, 'tools/offline_text_native_check'),
            '-B', path.join(root, 'build/offline-native-check'), `-DFLUTTER_WRAPPER_INCLUDE=${includes}`]));
          core.addPath(path.dirname(cmake));
          core.info(`Validated retained CMake ${version.string}: ${cmake}`);
    - name: Use a compatible retained Python runtime for reports
      shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        function Find-ReportPython {
          param([string[]]$Candidates)
          foreach ($candidate in ($Candidates | Select-Object -Unique)) {
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) { continue }
            try {
              $probe = @(& $candidate -I -c 'import json,sys; print(json.dumps(dict(path=sys.executable,version=list(sys.version_info[:3]))))')
              $probeExit = $LASTEXITCODE
              if ($probeExit -ne 0) { throw "Native probe exited $probeExit." }
              $runtime = ($probe -join "`n") | ConvertFrom-Json
              # 3.12 is the hosted baseline; retained 3.14 passed both report suites.
              if ($runtime.version[0] -ne 3 -or $runtime.version[1] -notin @(12,14)) {
                throw 'Only validated Python 3.12 and 3.14 runtimes are accepted.'
              }
              if (-not (Test-Path -LiteralPath $runtime.path -PathType Leaf)) {
                throw 'Python reported a missing executable.'
              }
              Write-Host "Report interpreter: $($runtime.path), version $($runtime.version -join '.')"
              return $runtime
            } catch {
              Write-Warning "Rejected retained Python candidate ${candidate}: $_"
            }
          }
          throw 'No compatible retained Python was found. Restore an authorized signed runtime; do not bypass setup.ps1 signing policy.'
        }
        $candidates = @(
          (Join-Path $env:SystemDrive 'Python314\python.exe')
          (Get-Command python.exe -All -ErrorAction SilentlyContinue | ForEach-Object Source)
          (Join-Path $env:LOCALAPPDATA 'Python\pythoncore-3.14-64\python.exe')
        ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
        $selected = Find-ReportPython -Candidates $candidates
        $selectedDir = Split-Path -Parent $selected.path
        $selectedDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        @("NEURA_PYTHON=$($selected.path)", "NEURA_PYTHON_VERSION=$($selected.version -join '.')") |
          Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Discover and enable retained Git Bash
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs'), path = require('path');
          const {spawnSync} = require('child_process');
          const childEnv = Object.fromEntries(Object.entries(process.env).filter(([key]) => key.toUpperCase() !== 'PATH'));
          const where = path.join(process.env.SystemRoot, 'System32', 'where.exe');
          const found = spawnSync(where, ['git.exe'], {encoding:'utf8', timeout:15000});
          if (found.error || found.status !== 0) {
            throw new Error(`Retained Git discovery failed: ${found.error || found.stderr || found.status}`);
          }
          for (const git of new Set(found.stdout.trim().split(/\r?\n/))) {
            const root = path.dirname(path.dirname(git));
            const bin = path.join(root, 'bin'), utilities = path.join(root, 'usr', 'bin');
            const bash = path.join(bin, 'bash.exe');
            if (!fs.existsSync(bash)) continue;
            const probe = spawnSync(bash, ['--noprofile', '--norc', '-e', '-o', 'pipefail', '-c',
              'for tool in bash git grep tee mkdir; do command -v "$tool" >/dev/null || exit 17; done; echo NEURA_BASH_OK'], {
              cwd:process.env.NEURA_SOURCE_ROOT, encoding:'utf8', timeout:15000,
              env:{...childEnv, PATH:`${bin};${utilities};${process.env.PATH}`}
            });
            if (probe.error || probe.status !== 0 || !probe.stdout.split(/\r?\n/).includes('NEURA_BASH_OK')) {
              core.warning(`Rejected retained Git Bash ${bash}: ${probe.error || probe.stderr || `exit ${probe.status}; missing success marker`}`);
              continue;
            }
            // Only this job and its subsequent steps receive these directories.
            core.addPath(utilities);
            core.addPath(bin);
            core.info(`Validated retained Git Bash: ${bash}`);
            return;
          }
          throw new Error('No usable retained Git Bash was found; restore authorized runner tooling.');
    - name: Record tools and enforce the Flutter lockfile
      shell: bash
      run: |2

        flutter --version
        dart --version
        rustc --version
        cargo --version
        python --version
        flutter pub get --enforce-lockfile
        git diff --exit-code -- pubspec.lock rust/Cargo.lock
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Test bounded storage recovery
      shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
      run: |-
        & "$env:NEURA_SOURCE_ROOT\tools\Repair-NeuraCiStorage.Tests.ps1"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Reject unresolved merge markers
      shell: bash
      run: |
        set -euo pipefail
        if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
          lib/living_intelligence \
          lib/intelligence/action_loom.dart \
          lib/intelligence/fresh_approval_lease.dart \
          test/living_intelligence \
          test/intelligence/action_loom_fresh_approval_test.dart \
          test/intelligence/fresh_approval_lease_test.dart; then
          echo "::error::Unresolved merge markers are committed."
          exit 1
        fi
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Verify canonical formatting
      shell: bash
      run: |
        set -euo pipefail
        dart format --output=none --set-exit-if-changed \
          lib/living_intelligence \
          lib/intelligence/action_loom.dart \
          lib/intelligence/fresh_approval_lease.dart \
          lib/intelligence/intelligence.dart \
          test/living_intelligence \
          test/intelligence/action_loom_fresh_approval_test.dart \
          test/intelligence/fresh_approval_lease_test.dart
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Require zero analyzer findings
      shell: bash
      run: |
        set -o pipefail
        flutter analyze --fatal-infos 2>&1 | tee analyze.log
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Run focused safety tests
      shell: bash
      run: |
        set -o pipefail
        flutter test --no-pub --reporter expanded \
          test/living_intelligence \
          test/intelligence/action_loom_fresh_approval_test.dart \
          test/intelligence/fresh_approval_lease_test.dart \
          2>&1 | tee focused-safety-tests.log
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Focused full-wipe regressions with coverage
      run: |
        flutter test --no-pub --reporter expanded --concurrency 2 \
          --coverage --coverage-path=coverage/wipe/lcov.info \
          test/data_wipe_service_test.dart \
          test/data_wipe_fixture_test.dart \
          test/data_wipe_service_full_test.dart \
          test/data_wipe_service_lifecycle_test.dart \
          test/data_wipe_credentials_test.dart \
          test/data_wipe_microphone_test.dart
      shell: bash
      if: ${{ matrix.pr == 133 }}
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Related privacy and encrypted-memory contracts
      run: |
        flutter test --no-pub --reporter expanded --concurrency 2 \
          test/encrypted_memory test/core/memory_graph_service_test.dart \
          test/neura_provider_credentials_test.dart \
          test/startup/native_speech_safe_mode_test.dart \
          test/living_intelligence \
          test/intelligence/action_loom_fresh_approval_test.dart \
          test/intelligence/fresh_approval_lease_test.dart
      shell: bash
      if: ${{ matrix.pr == 133 }}
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Require strict analysis for changed privacy code
      run: |
        flutter analyze --fatal-infos \
          lib/src/core/data_wipe_service.dart \
          lib/services/neura_provider_credentials.dart \
          lib/services/neura_model_credentials.dart \
          lib/services/scheduled_backup_settings.dart \
          lib/services/sleep_listener_service.dart \
          test/data_wipe_service_full_test.dart \
          test/data_wipe_service_lifecycle_test.dart \
          test/data_wipe_credentials_test.dart \
          test/data_wipe_microphone_test.dart \
          test/data_wipe_fixture_test.dart \
          test/helpers/data_wipe_fixture.dart
      shell: bash
      if: ${{ matrix.pr == 133 }}
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Check canonical formatting
      run: |
        dart format --output=none --set-exit-if-changed \
          lib/src/core/data_wipe_service.dart \
          lib/services/neura_provider_credentials.dart \
          lib/services/neura_model_credentials.dart \
          lib/services/scheduled_backup_settings.dart \
          lib/services/sleep_listener_service.dart \
          test/data_wipe_service_full_test.dart \
          test/data_wipe_service_lifecycle_test.dart \
          test/data_wipe_credentials_test.dart \
          test/data_wipe_microphone_test.dart \
          test/data_wipe_fixture_test.dart \
          test/helpers/data_wipe_fixture.dart
      shell: bash
      if: ${{ matrix.pr == 133 }}
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Check canonical Dart formatting
      run: |
        dart format --output=none --set-exit-if-changed lib/services/neura_ollama_chat.dart lib/services/neura_ai_service.dart lib/modules/chat/neura_chat_screen.dart lib/persona/services/neura_prompt_builder.dart test/services/neura_ollama_chat_test.dart test/persona/neura_offline_prompt_test.dart
      shell: bash
      if: ${{ matrix.pr == 136 }}
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Analyze integration
      run: flutter analyze --no-pub lib/services/neura_ollama_chat.dart lib/services/neura_ai_service.dart lib/modules/chat/neura_chat_screen.dart
        lib/persona/services/neura_prompt_builder.dart test/services/neura_ollama_chat_test.dart test/persona/neura_offline_prompt_test.dart
      shell: bash
      if: ${{ matrix.pr == 136 }}
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Test adapter and existing lifecycle boundaries
      run: flutter test --no-pub test/services/neura_ollama_chat_test.dart test/neura_link/engine_session_lifecycle_test.dart
        test/services/neura_generation_cancel_test.dart test/persona/neura_character_charter_test.dart test/persona/neura_prompt_builder_test.dart
        test/persona/neura_offline_prompt_test.dart
      shell: bash
      if: ${{ matrix.pr == 136 }}
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Canonical formatting of modified Flutter sources
      shell: bash
      run: |
        dart format --output=none --set-exit-if-changed \
          lib/neura_link/local_conversation_session.dart \
          lib/modules/chat/neura_chat_screen.dart \
          test/neura_link/local_conversation_session_test.dart \
          test/modules/chat/neura_offline_chat_test.dart
      if: ${{ matrix.pr == 136 }}
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Analyze modified Flutter sources
      shell: bash
      run: |
        flutter analyze --no-fatal-infos \
          lib/neura_link/local_conversation_session.dart \
          lib/modules/chat/neura_chat_screen.dart \
          test/neura_link/local_conversation_session_test.dart \
          test/modules/chat/neura_offline_chat_test.dart
      if: ${{ matrix.pr == 136 }}
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Validate coverage report accuracy
      shell: bash
      run: python -m unittest discover -s tools/coverage -p 'test_*.py' -v
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Run the complete Flutter suite once with coverage
      id: flutter_tests
      run: |
        mkdir -p coverage/flutter
        flutter test --no-pub --concurrency 2 --timeout 2m \
          --coverage --coverage-path=coverage/flutter/raw.lcov.info
      shell: bash
      working-directory: ${{ env.NEURA_SOURCE_ROOT }}
    - name: Normalize measured Flutter source paths
      uses: actions/github-script@v8
      if: ${{ !cancelled() && (steps.flutter_tests.outcome == 'success' || steps.flutter_tests.outcome == 'failure') }}
      with:
        script: |
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          function scopedSource(value, logical, physical, api, realpath, language = 'flutter') {
            if (!value || value.includes('\0')) return null;
            const inside = (root, file) => {
              const relative = api.relative(root, file);
              return relative && !api.isAbsolute(relative) && relative !== '..' && !relative.startsWith(`..${api.sep}`);
            };
            const candidate = api.resolve(logical, value);
            if (!inside(logical, candidate) && !inside(physical, candidate)) return null;
            const resolved = realpath(candidate);
            if (!inside(physical, resolved)) return null;
            const relative = api.relative(physical, resolved).split(api.sep).join('/');
            const [prefix, suffix] = language === 'rust' ? ['rust/src/', '.rs'] : ['lib/', '.dart'];
            return relative.startsWith(prefix) && relative.endsWith(suffix) ? relative : null;
          }
          const logical = process.env.NEURA_SOURCE_ROOT;
          const language = process.env.NEURA_COVERAGE_LANGUAGE || 'flutter';
          const folder = language === 'rust' ? 'rust-windows' : 'flutter';
          const physical = fs.realpathSync(logical);
          const input = path.join(logical, 'coverage', folder, 'raw.lcov.info');
          const output = path.join(logical, 'coverage', folder, 'normalized.lcov.info');
          const raw = fs.readFileSync(input);
          let normalizedSources = 0;
          const normalized = raw.toString('utf8').replace(/^SF:([^\r\n]*)/gm, (record, value) => {
            const relative = scopedSource(value, logical, physical, path, candidate => {
              const resolved = fs.realpathSync(candidate);
              if (!fs.statSync(resolved).isFile()) throw new Error(`LCOV source is not a file: ${candidate}`);
              return resolved;
            }, language);
            if (!relative) return 'SF:__excluded_by_containment__/source';
            normalizedSources++;
            return `SF:${relative}`;
          });
          if (!normalizedSources) throw new Error('LCOV contains no verified checkout production sources.');
          fs.writeFileSync(output, normalized, {flag:'wx'});
          const sha256 = data => crypto.createHash('sha256').update(data).digest('hex');
          fs.writeFileSync(path.join(logical, 'coverage', folder, 'path-provenance.json'), JSON.stringify({
            workflow_commit:process.env.NEURA_WORKFLOW_COMMIT, tested_head:process.env.NEURA_EXPECTED_HEAD,
            raw_sha256:sha256(raw), normalized_sha256:sha256(Buffer.from(normalized)), normalized_sources:normalizedSources,
            scope:'SF paths are verified relative paths or explicit exclusions; all measurement records are preserved. Original input is retained.'
          }, null, 2) + '\n', {flag:'wx'});
          core.info(`Normalized ${normalizedSources} verified source records; original LCOV SHA256 ${sha256(raw)}`);
    - name: Render measured Flutter coverage
      env:
