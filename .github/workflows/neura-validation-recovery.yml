            normalizedSources++;
            return `SF:${relative}`;
          });
          if (!normalizedSources) throw new Error('LCOV contains no verified checkout production sources.');
          fs.writeFileSync(output, normalized, {flag:'wx'});
          const sha256 = data => crypto.createHash('sha256').update(data).digest('hex');
          fs.writeFileSync(path.join(logical, 'coverage', folder, 'path-provenance.json'), JSON.stringify({
