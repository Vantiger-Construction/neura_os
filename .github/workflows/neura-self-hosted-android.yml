name: Neura Self-Hosted Android Package

on:
  pull_request:
    branches: [Neura]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'test/**'
      - 'tools/New-NeuraClientBuildConfig.ps1'
      - 'tools/Publish-NeuraReleaseAssets.ps1'
      - 'tools/Save-NeuraConfiguredPackage.ps1'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/neura-self-hosted-android.yml'
  workflow_dispatch:
    inputs:
      require_sync_configuration:
        description: 'Fail if the public Supabase build variables are missing'
        type: boolean
        default: true


permissions:
  # Package delivery publishes download-verified prerelease assets.
  contents: write

concurrency:
  group: neura-self-hosted-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build installable Android debug APK
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 180

    steps:
      - name: Select bounded Android build volumes
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Remove-NeuraGeneratedPath {
            param([Parameter(Mandatory)][string]$Path)
            if (-not (Test-Path -LiteralPath $Path)) { return }
            try {
              $item = Get-Item -LiteralPath $Path -Force
              if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$Path"
              } else {
                Remove-Item -LiteralPath $Path -Recurse -Force
              }
            } catch {
              Write-Warning "Could not remove ${Path}: $($_.Exception.Message)"
            }
          }

          function Test-NeuraCiVolume {
            param([Parameter(Mandatory)][System.IO.DriveInfo]$Drive)
            if (-not $Drive.IsReady -or
                ($Drive.DriveType -ne [System.IO.DriveType]::Fixed -and
                 $Drive.DriveType -ne [System.IO.DriveType]::Removable) -or
                $Drive.AvailableFreeSpace -lt 2.75GB) {
              return $false
            }
            $probe = Join-Path $Drive.RootDirectory.FullName "neura-ci\probe-$env:GITHUB_RUN_ID"
            try {
              New-Item -ItemType Directory -Path $probe -Force | Out-Null
              Set-Content -LiteralPath (Join-Path $probe 'probe.txt') -Value 'ok' -NoNewline
              Remove-Item -LiteralPath $probe -Recurse -Force
              return $true
            } catch {
              Write-Warning "Volume $($Drive.Name) is not writable: $($_.Exception.Message)"
              return $false
            }
          }

          $runnerTemp = $env:RUNNER_TEMP
          $runnerWork = Split-Path -Parent $runnerTemp
          $systemRoot = [System.IO.Path]::GetPathRoot($runnerWork)
          if (-not $systemRoot -or -not (Test-Path -LiteralPath $systemRoot)) {
            $runnerTemp = [System.IO.Path]::GetTempPath().TrimEnd('\')
            $runnerWork = Split-Path -Parent $runnerTemp
            $systemRoot = [System.IO.Path]::GetPathRoot($runnerWork)
            Write-Warning "RUNNER_TEMP points to an unavailable volume; using $runnerTemp for runner-owned cleanup."
          }
          $cutoff = (Get-Date).AddHours(-2)

          # Reclaim orphaned Android bridge processes before deleting stale run data.
          # This is scoped to adb only; the GitHub Actions runner process is untouched.
          Get-Process -Name adb -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          foreach ($repository in Get-ChildItem -LiteralPath $runnerWork -Directory -ErrorAction SilentlyContinue) {
            if ($repository.Name.StartsWith('_')) { continue }
            $checkout = Join-Path $repository.FullName $repository.Name
            Remove-NeuraGeneratedPath -Path (Join-Path $checkout 'build')
            Remove-NeuraGeneratedPath -Path (Join-Path $checkout 'rust\target')
          }

          foreach ($drive in [System.IO.DriveInfo]::GetDrives()) {
            if (-not $drive.IsReady) { continue }
            $ownedRoot = Join-Path $drive.RootDirectory.FullName 'neura-ci'
            if (Test-Path -LiteralPath $ownedRoot -PathType Container) {
              Get-ChildItem -LiteralPath $ownedRoot -Directory -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.LastWriteTime -lt $cutoff } |
                ForEach-Object { Remove-NeuraGeneratedPath -Path $_.FullName }
            }
          }

          $systemDriveName = $systemRoot.TrimEnd('\').TrimEnd(':')
          $systemDrive = Get-PSDrive -Name $systemDriveName -ErrorAction SilentlyContinue
          if (-not $systemDrive) {
            throw "Unable to inspect the system volume $systemRoot."
          }
          $systemFree = $systemDrive.Free
          if ($systemFree -lt 0.25GB) {
            throw "The runner needs 0.25 GB on $systemRoot for metadata; only $([Math]::Round($systemFree / 1GB, 2)) GB is free."
          }

          $eligible = @(
            [System.IO.DriveInfo]::GetDrives() |
              Where-Object {
                $_.IsReady -and
                ($_.Name -ne $systemRoot -or $systemFree -ge 5.5GB)
              } |
              Where-Object { Test-NeuraCiVolume -Drive $_ } |
              Sort-Object -Property AvailableFreeSpace -Descending
          )
          if ($eligible.Count -eq 0 -or
              ($eligible.Count -eq 1 -and
               $eligible[0].AvailableFreeSpace -lt 8.0GB) -or
              ($eligible.Count -ge 2 -and
               ($eligible[0].AvailableFreeSpace -lt 3.25GB -or
                $eligible[1].AvailableFreeSpace -lt 2.75GB))) {
            throw ('Android validation requires either separate writable volumes with ' +
              'at least 3.25 GB for SDK/JDK data and 2.75 GB for source/build data, ' +
              'or one shared writable volume with at least 8.0 GB free. The system ' +
              'volume is eligible only when at least 5.5 GB remains free.')
          }

          # Prefer one roomy volume so SDK/NDK extraction is not forced onto a
          # marginal second drive. Fall back to split volumes only when needed.
          $sharedDrive = $eligible |
            Where-Object { $_.AvailableFreeSpace -ge 8.0GB } |
            Select-Object -First 1
          if ($sharedDrive) {
            $buildDrive = $sharedDrive
            $sdkDrive = $sharedDrive
            $layout = 'shared'
          } else {
            # APK/Gradle output is the heavier workload; reserve the largest
            # remaining volume for it.
            $buildDrive = $eligible[0]
            $sdkDrive = $eligible[1]
            $layout = 'separate'
          }
          @(
            "NEURA_ANDROID_SDK_VOLUME=$($sdkDrive.RootDirectory.FullName)",
            "NEURA_ANDROID_BUILD_VOLUME=$($buildDrive.RootDirectory.FullName)",
            "NEURA_ANDROID_RUN_KEY=$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Android volume layout: $layout"
          Write-Host "SDK/JDK volume: $($sdkDrive.Name) ($([Math]::Round($sdkDrive.AvailableFreeSpace / 1GB, 2)) GB free)"
          Write-Host "Source/build volume: $($buildDrive.Name) ($([Math]::Round($buildDrive.AvailableFreeSpace / 1GB, 2)) GB free)"

      - name: Route source checkout to the build volume
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Remove-LinkOrDirectory {
            param([Parameter(Mandatory)][string]$Path)
            if (-not (Test-Path -LiteralPath $Path)) { return }
            $item = Get-Item -LiteralPath $Path -Force
            if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
              & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$Path"
            } else {
              Remove-Item -LiteralPath $Path -Recurse -Force
            }
          }

          $sourceLink = Join-Path $env:GITHUB_WORKSPACE 'source'
          $workspaceTarget = Join-Path $env:NEURA_ANDROID_BUILD_VOLUME "neura-ci\$env:NEURA_ANDROID_RUN_KEY\workspace"
          $cleanupTemp = [System.Environment]::GetEnvironmentVariable('RUNNER_TEMP')
          if ([string]::IsNullOrWhiteSpace($cleanupTemp) -or
              -not (Test-Path -LiteralPath $cleanupTemp)) {
            $cleanupTemp = [System.IO.Path]::GetTempPath().TrimEnd('\')
          }
          Set-Location -LiteralPath $cleanupTemp
          Remove-LinkOrDirectory -Path $sourceLink
          Remove-LinkOrDirectory -Path $workspaceTarget
          New-Item -ItemType Directory -Path $workspaceTarget -Force | Out-Null
          New-Item -ItemType Junction -Path $sourceLink -Target $workspaceTarget | Out-Null
          "NEURA_ANDROID_SOURCE_ROOT=$sourceLink" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out source
        uses: actions/checkout@v5
        with:
          path: source

      - name: Validate release publisher syntax
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $scriptPath = Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'tools\Publish-NeuraReleaseAssets.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'Release publisher contains PowerShell syntax errors.'
          }

      - name: Route Android caches and output
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Remove-LinkOrDirectory {
            param([Parameter(Mandatory)][string]$Path)
            if (-not (Test-Path -LiteralPath $Path)) { return }
            $item = Get-Item -LiteralPath $Path -Force
            if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
              & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$Path"
            } else {
              Remove-Item -LiteralPath $Path -Recurse -Force
            }
          }

          $buildRoot = Join-Path $env:NEURA_ANDROID_BUILD_VOLUME "neura-ci\$env:NEURA_ANDROID_RUN_KEY\android-build"
          $toolRoot = Join-Path $env:NEURA_ANDROID_SDK_VOLUME "neura-ci\$env:NEURA_ANDROID_RUN_KEY\android-tools"
          $outputRoot = Join-Path $buildRoot 'build'
          $androidUserHome = Join-Path $buildRoot 'android-user'
          $tempRoot = Join-Path $buildRoot 'temp'
          # Keep verified platform tools and dependency downloads across runs.
          # The committed lockfile is still resolved on every validation.
          $persistentToolRoot = Join-Path $env:RUNNER_TOOL_CACHE 'neura-android'
          $pubCache = Join-Path $env:RUNNER_TOOL_CACHE 'neura-dependencies\pub-cache-flutter-3.44.7'
          $gradleHome = Join-Path $persistentToolRoot 'gradle-home'
          $sdkRoot = Join-Path $persistentToolRoot 'sdk-36.0.0-ndk-28.2.13676358'
          $jdkRoot = Join-Path $persistentToolRoot 'jdk-17.0.19+10'

          Remove-LinkOrDirectory -Path (Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'build')
          Remove-LinkOrDirectory -Path $buildRoot
          Remove-LinkOrDirectory -Path $toolRoot
          foreach ($path in @($outputRoot, $pubCache, $gradleHome, $androidUserHome, $tempRoot, $toolRoot, $persistentToolRoot)) {
            New-Item -ItemType Directory -Path $path -Force | Out-Null
          }
          New-Item -ItemType Junction `
            -Path (Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'build') `
            -Target $outputRoot | Out-Null

          @(
            "NEURA_ANDROID_BUILD_ROOT=$buildRoot",
            "NEURA_ANDROID_TOOL_ROOT=$toolRoot",
            "NEURA_ANDROID_SDK_ROOT=$sdkRoot",
            "NEURA_ANDROID_JDK_ROOT=$jdkRoot",
            "PUB_CACHE=$pubCache",
            "GRADLE_USER_HOME=$gradleHome",
            "ANDROID_USER_HOME=$androidUserHome",
            "TEMP=$tempRoot",
            "TMP=$tempRoot"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable pinned Flutter 3.44.7
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $flutterRoot = Join-Path $env:RUNNER_TOOL_CACHE 'flutter\3.44.7\x64'
          $flutterExe = Join-Path $flutterRoot 'bin\flutter.bat'
          if (-not (Test-Path -LiteralPath $flutterExe -PathType Leaf)) {
            throw 'Pinned Flutter 3.44.7 is missing from the runner tool cache.'
          }
          (Join-Path $flutterRoot 'bin') |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $flutterExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Use verified JDK 17
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Find-VerifiedJdk17 {
            $candidates = @()
            if (-not [string]::IsNullOrWhiteSpace($env:JAVA_HOME)) {
              $candidates += Join-Path $env:JAVA_HOME 'bin\java.exe'
            }
            $javaCommand = Get-Command java.exe -ErrorAction SilentlyContinue
            if ($javaCommand -and $javaCommand.Source) {
              $candidates += $javaCommand.Source
            }

            # Prefer established runner toolchain locations before using the
            # verified, bounded fallback download below.
            $searchRoots = @(
              $env:RUNNER_TOOL_CACHE,
              (Join-Path $env:ProgramFiles 'Android\Android Studio\jbr'),
              (Join-Path $env:ProgramFiles 'Eclipse Adoptium'),
              (Join-Path $env:ProgramFiles 'Microsoft'),
              (Join-Path $env:ProgramFiles 'Java')
            ) | Where-Object {
              -not [string]::IsNullOrWhiteSpace($_) -and
              (Test-Path -LiteralPath $_ -PathType Container)
            }
            foreach ($searchRoot in $searchRoots) {
              $candidates += Get-ChildItem -LiteralPath $searchRoot -Filter 'java.exe' -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName
            }

            foreach ($candidate in ($candidates | Select-Object -Unique)) {
              if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) { continue }
              # java -version writes normal output to stderr. Capture it through
              # cmd so Windows PowerShell does not promote it to NativeCommandError
              # while ErrorActionPreference is Stop.
              $versionOutput = (
                & $env:ComSpec /d /s /c "`"$candidate`" -version 2>&1" |
                  Out-String
              )
              if ($versionOutput -match 'version\s+' -and $versionOutput -match '17') {
                $javaHome = Split-Path -Parent (Split-Path -Parent $candidate)
                $javacExe = Join-Path $javaHome 'bin\javac.exe'
                if (Test-Path -LiteralPath $javacExe -PathType Leaf) {
                  return (Get-Item -LiteralPath $candidate).FullName
                }
              }
            }
            return $null
          }

          $javaExe = Find-VerifiedJdk17
          if (-not $javaExe) {
            $archive = Join-Path $env:NEURA_ANDROID_TOOL_ROOT 'temurin17.zip'
            $uri = 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.19%2B10/OpenJDK17U-jdk_x64_windows_hotspot_17.0.19_10.zip'
            $expected = 'b5b235c48adf6a081874b812c630b9f4b5f637b7a5ed18b9174d08a41ec4c235'
            $downloaded = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Downloading verified Temurin JDK 17 (attempt $attempt/3)..."
                Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive -TimeoutSec 600
                # Checksum verification is deliberately inside the retry loop:
                # a mismatch is at least as likely to be a truncated/corrupted
                # download over a flaky connection as a bad file, and a single
                # bad byte previously failed the whole job with no retry.
                $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($actual -ne $expected) {
                  throw "Temurin JDK checksum mismatch: $actual"
                }
                $downloaded = $true
                break
              } catch {
                Write-Warning "JDK download attempt $attempt failed: $($_.Exception.Message)"
                Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
                if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
              }
            }
            if (-not $downloaded) {
              throw 'Unable to download a checksum-verified Temurin JDK 17 after 3 attempts.'
            }

            Expand-Archive -LiteralPath $archive -DestinationPath $env:NEURA_ANDROID_JDK_ROOT -Force
            Remove-Item -LiteralPath $archive -Force
            $javaExe = Get-ChildItem -LiteralPath $env:NEURA_ANDROID_JDK_ROOT -Filter 'java.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Directory.Name -eq 'bin' } |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $javaExe) {
              throw 'Verified Temurin archive did not contain bin\java.exe.'
            }
          }

          $javaHome = Split-Path -Parent (Split-Path -Parent $javaExe)
          $javacExe = Join-Path $javaHome 'bin\javac.exe'
          if (-not (Test-Path -LiteralPath $javacExe -PathType Leaf)) {
            throw "JDK 17 was found at $javaHome but javac.exe is missing."
          }

          @(
            "JAVA_HOME=$javaHome",
            "NEURA_ANDROID_JDK_ROOT=$javaHome",
            "JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=$env:TEMP"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $javaHome 'bin') |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          & $javaExe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $javacExe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified Android SDK packages
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $requiredPackages = @(
            (Join-Path $env:NEURA_ANDROID_SDK_ROOT 'cmdline-tools\\latest\\bin\\sdkmanager.bat'),
            (Join-Path $env:NEURA_ANDROID_SDK_ROOT 'platform-tools\\adb.exe'),
            (Join-Path $env:NEURA_ANDROID_SDK_ROOT 'platforms\\android-36\\android.jar'),
            (Join-Path $env:NEURA_ANDROID_SDK_ROOT 'build-tools\\36.0.0\\aapt2.exe'),
            (Join-Path $env:NEURA_ANDROID_SDK_ROOT 'ndk\\28.2.13676358\\source.properties')
          )
          $sdkCacheComplete = @($requiredPackages | Where-Object {
            -not (Test-Path -LiteralPath $_ -PathType Leaf)
          }).Count -eq 0

          if ($sdkCacheComplete) {
            Write-Host "Reusing verified Android SDK package cache at $env:NEURA_ANDROID_SDK_ROOT."
          } else {
            # Never trust or layer over a partial cache from an interrupted run.
            Remove-Item -LiteralPath $env:NEURA_ANDROID_SDK_ROOT -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $env:NEURA_ANDROID_SDK_ROOT -Force | Out-Null

            $archive = Join-Path $env:NEURA_ANDROID_TOOL_ROOT 'command-line-tools.zip'
            $extract = Join-Path $env:NEURA_ANDROID_TOOL_ROOT '_extract'
            $uri = 'https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip'
            $expected = '90ae805d20434428bffcb699c290860f19bb5f66a67e6b330067e3de801fb04a'

            $maxRetries = 3
            $retryCount = 0
            $downloadSuccess = $false
            while ($retryCount -lt $maxRetries -and -not $downloadSuccess) {
              try {
                Write-Host "Downloading Android SDK command-line tools (attempt $($retryCount + 1)/$maxRetries)..."
                Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive -TimeoutSec 600
                $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($actual -ne $expected) {
                  throw "Android command-line tools checksum mismatch: $actual"
                }
                $downloadSuccess = $true
              } catch {
                $retryCount++
                Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
                if ($retryCount -lt $maxRetries) {
                  Write-Warning "Download failed: $($_.Exception.Message). Retrying in 30 seconds..."
                  Start-Sleep -Seconds 30
                } else {
                  throw "Failed to download a verified Android SDK command-line tools archive after $maxRetries attempts: $($_.Exception.Message)"
                }
              }
            }

            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            Remove-Item -LiteralPath $archive -Force
            $latest = Join-Path $env:NEURA_ANDROID_SDK_ROOT 'cmdline-tools\\latest'
            New-Item -ItemType Directory -Path (Split-Path -Parent $latest) -Force | Out-Null
            Move-Item -LiteralPath (Join-Path $extract 'cmdline-tools') -Destination $latest
            Remove-Item -LiteralPath $extract -Recurse -Force
            $sdkManager = Join-Path $latest 'bin\\sdkmanager.bat'
            if (-not (Test-Path -LiteralPath $sdkManager -PathType Leaf)) {
              throw 'sdkmanager.bat was not installed.'
            }

            $licenseAnswers = Join-Path $env:TEMP 'android-sdk-license-answers.txt'
            1..200 | ForEach-Object { 'y' } |
              Set-Content -LiteralPath $licenseAnswers -Encoding ASCII
            $licenseCommand = (
              '"{0}" "--sdk_root={1}" --licenses < "{2}"' -f
              $sdkManager,
              $env:NEURA_ANDROID_SDK_ROOT,
              $licenseAnswers
            )
            & "$env:SystemRoot\\System32\\cmd.exe" /d /s /c $licenseCommand
            if ($LASTEXITCODE -ne 0) { throw "License acceptance failed: $LASTEXITCODE" }

            & $sdkManager `
              "--sdk_root=$env:NEURA_ANDROID_SDK_ROOT" `
              'platform-tools' `
              'platforms;android-36' `
              'build-tools;36.0.0' `
              'ndk;28.2.13676358'
            if ($LASTEXITCODE -ne 0) { throw "Android SDK install failed: $LASTEXITCODE" }
          }

          foreach ($required in $requiredPackages) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Android SDK package cache is incomplete: $required"
            }
          }

          $sdkManager = Join-Path $env:NEURA_ANDROID_SDK_ROOT 'cmdline-tools\\latest\\bin\\sdkmanager.bat'
          @(
            "ANDROID_HOME=$env:NEURA_ANDROID_SDK_ROOT",
            "ANDROID_SDK_ROOT=$env:NEURA_ANDROID_SDK_ROOT"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path (Split-Path -Parent $sdkManager) '') |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $env:NEURA_ANDROID_SDK_ROOT 'platform-tools') |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          flutter config --android-sdk $env:NEURA_ANDROID_SDK_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter doctor -v

      - name: Restore dependencies
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_ANDROID_SOURCE_ROOT
          $pubLog = Join-Path $PWD 'pub-get.log'
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            flutter pub get --verbose *> $pubLog
            $pubExitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
          if (Test-Path -LiteralPath $pubLog -PathType Leaf) {
            Get-Content -LiteralPath $pubLog | Out-Host
          }
          if ($pubExitCode -ne 0) {
            throw "flutter pub get failed with exit code $pubExitCode. See $pubLog."
          }

      - name: Prepare public client build configuration
        id: client_config
        env:
          NEURA_SUPABASE_URL: ${{ vars.NEURA_SUPABASE_URL }}
          NEURA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEURA_SUPABASE_PUBLISHABLE_KEY }}
          NEURA_REQUIRE_CONFIG: ${{ inputs.require_sync_configuration }}
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $requireConfig = $env:NEURA_REQUIRE_CONFIG -eq 'true'
          $configPath = Join-Path $env:RUNNER_TEMP "neura-client-$env:GITHUB_RUN_ID-$env:GITHUB_JOB.json"
          & "$env:NEURA_ANDROID_SOURCE_ROOT\tools\New-NeuraClientBuildConfig.ps1" -OutputPath $configPath -RequireConfiguration:$requireConfig

      - name: Build APK
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_ANDROID_SOURCE_ROOT
          $buildLog = Join-Path $PWD 'android-build.log'
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          if (-not $versionLine) {
            throw 'pubspec.yaml does not contain a valid version line.'
          }
          $version = $versionLine.Matches[0].Groups[1].Value.Trim()
          $buildName = $version.Split('+')[0]
          if ([string]::IsNullOrWhiteSpace($buildName)) {
            throw 'The Flutter build name resolved to an empty value.'
          }
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $buildArguments = @('build', 'apk', '--debug', '--no-pub', '--verbose', '--build-name', $buildName, '--build-number', $env:GITHUB_RUN_NUMBER)
            if (-not [string]::IsNullOrWhiteSpace($env:NEURA_DART_DEFINE_FILE)) {
              if (-not (Test-Path -LiteralPath $env:NEURA_DART_DEFINE_FILE -PathType Leaf)) { throw 'Public Dart define file is missing.' }
              $buildArguments += "--dart-define-from-file=$env:NEURA_DART_DEFINE_FILE"
            }
            flutter @buildArguments *> $buildLog
            $buildExitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
          if (Test-Path -LiteralPath $buildLog -PathType Leaf) {
            Get-Content -LiteralPath $buildLog | Out-Host
          }
          if ($buildExitCode -ne 0) {
            throw "flutter build apk failed with exit code $buildExitCode. See $buildLog."
          }

      - name: Verify Android APK
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_ANDROID_SOURCE_ROOT
          $apk = Get-ChildItem -LiteralPath 'build\app\outputs' -Filter '*.apk' -File -Recurse |
            Where-Object { $_.Length -gt 0 } |
            Select-Object -First 1
          if (-not $apk) { throw 'No non-empty APK was produced.' }

          $output = Join-Path $PWD 'recovery_downloads\android'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim().Split('+')[0]
          $apkName = "NeuraCompanion_Android_${version}_recovery.$env:GITHUB_RUN_NUMBER.apk"
          $destination = Join-Path $output $apkName
          Copy-Item -LiteralPath $apk.FullName -Destination $destination
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $apkName" | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding ASCII
          Write-Host "Verified APK: $destination"
          Write-Host "APK size: $((Get-Item -LiteralPath $destination).Length) bytes"
          Write-Host "SHA256: $hash"

      - name: Preserve configured Android package
        if: steps.client_config.outputs.configured == 'true'
        id: configured_package
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: '& "$env:NEURA_ANDROID_SOURCE_ROOT\tools\Save-NeuraConfiguredPackage.ps1" -SourceRoot $env:NEURA_ANDROID_SOURCE_ROOT -Platform android -BuildVolume $env:NEURA_ANDROID_BUILD_VOLUME'

      - name: Publish required Android release assets
        # Every package run requires a downloadable APK and checksum.
        # Do not report success until each release asset has been downloaded
        # again and matched to its local SHA-256 digest.
        id: release_delivery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEURA_CONFIGURED_PACKAGE_PATH: ${{ steps.configured_package.outputs.package_path }}
          NEURA_RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NEURA_RELEASE_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $packagePath = $env:NEURA_CONFIGURED_PACKAGE_PATH
          if ([string]::IsNullOrWhiteSpace($packagePath)) {
            $packagePath = Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'recovery_downloads\android'
          }
          & "$env:NEURA_ANDROID_SOURCE_ROOT\tools\Publish-NeuraReleaseAssets.ps1" `
            -Platform android `
            -PackagePath $packagePath `
            -BuildVolume $env:NEURA_ANDROID_BUILD_VOLUME

      - name: Upload Android restore and build logs
        if: always()
        # Diagnostic only; exhausted artifact quota must not fail Android validation.
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: Neura-SelfHosted-Android-restore-build-logs
          path: |
            ${{ github.workspace }}\source\pub-get.log
            ${{ github.workspace }}\source\android-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Release generated Android space
        if: always()
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:NEURA_ANDROID_SOURCE_ROOT)) {
            $gradle = Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'android\gradlew.bat'
            if (Test-Path -LiteralPath $gradle -PathType Leaf) { & $gradle --stop | Out-Null }
            $buildLink = Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'build'
            if (Test-Path -LiteralPath $buildLink) {
              & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$buildLink"
            }
          }
          foreach ($path in @($env:NEURA_ANDROID_BUILD_ROOT, $env:NEURA_ANDROID_TOOL_ROOT)) {
            if (-not [string]::IsNullOrWhiteSpace($path) -and (Test-Path -LiteralPath $path)) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }


      - name: Remove temporary public client settings
        if: always()
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:NEURA_DART_DEFINE_FILE)) {
            Remove-Item -LiteralPath $env:NEURA_DART_DEFINE_FILE -Force -ErrorAction SilentlyContinue
          }
