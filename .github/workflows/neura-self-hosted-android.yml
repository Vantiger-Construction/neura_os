name: Neura Self-Hosted Android Package

on:
  pull_request:
    branches: [Neura]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'test/**'
      - 'tools/New-NeuraClientBuildConfig.ps1'
      - 'tools/Publish-NeuraReleaseAssets.ps1'
      - 'tools/Repair-NeuraCiStorage.ps1'
      - 'tools/Repair-NeuraCiStorage.Tests.ps1'
      - 'tools/Save-NeuraConfiguredPackage.ps1'
      - 'tools/Enable-NeuraFlutter.ps1'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/neura-self-hosted-android.yml'
  workflow_dispatch:
    inputs:
      require_sync_configuration:
        description: 'Fail if the public Supabase build variables are missing'
        type: boolean
        default: true


permissions:
  # Package delivery publishes download-verified prerelease assets.
  contents: write

concurrency:
  group: neura-self-hosted-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'
  FLUTTER_SHA256: '0ccd71931f49c2fbe394b1eeb6d79af3d624058a043ea0d03d34160581624fb8'

jobs:
  android:
    name: Build installable Android debug APK
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 180

    steps:
      - name: Select bounded Android build volumes
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Remove-NeuraGeneratedPath {
            param([Parameter(Mandatory)][string]$Path)
            if (-not (Test-Path -LiteralPath $Path)) { return }
            try {
              $item = Get-Item -LiteralPath $Path -Force
              if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$Path"
              } else {
                Remove-Item -LiteralPath $Path -Recurse -Force
              }
            } catch {
              Write-Warning "Could not remove ${Path}: $($_.Exception.Message)"
            }
          }

          function Test-NeuraCiVolume {
            param([Parameter(Mandatory)][System.IO.DriveInfo]$Drive)
            if (-not $Drive.IsReady -or
                ($Drive.DriveType -ne [System.IO.DriveType]::Fixed -and
                 $Drive.DriveType -ne [System.IO.DriveType]::Removable) -or
                $Drive.AvailableFreeSpace -lt 2.75GB) {
              return $false
            }
            $probe = Join-Path $Drive.RootDirectory.FullName "neura-ci\probe-$env:GITHUB_RUN_ID"
            try {
              New-Item -ItemType Directory -Path $probe -Force | Out-Null
              Set-Content -LiteralPath (Join-Path $probe 'probe.txt') -Value 'ok' -NoNewline
              Remove-Item -LiteralPath $probe -Recurse -Force
              return $true
            } catch {
              Write-Warning "Volume $($Drive.Name) is not writable: $($_.Exception.Message)"
              return $false
            }
          }

          $runnerTemp = $env:RUNNER_TEMP
          $runnerWork = Split-Path -Parent $runnerTemp
          $systemRoot = [System.IO.Path]::GetPathRoot($runnerWork)
          if (-not $systemRoot -or -not (Test-Path -LiteralPath $systemRoot)) {
            $runnerTemp = [System.IO.Path]::GetTempPath().TrimEnd('\')
            $runnerWork = Split-Path -Parent $runnerTemp
            $systemRoot = [System.IO.Path]::GetPathRoot($runnerWork)
            Write-Warning "RUNNER_TEMP points to an unavailable volume; using $runnerTemp for runner-owned cleanup."
          }
          $cutoff = (Get-Date).AddHours(-2)

          # Reclaim orphaned Android bridge processes before deleting stale run data.
          # This is scoped to adb only; the GitHub Actions runner process is untouched.
          Get-Process -Name adb -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          foreach ($repository in Get-ChildItem -LiteralPath $runnerWork -Directory -ErrorAction SilentlyContinue) {
            if ($repository.Name.StartsWith('_')) { continue }
            $checkout = Join-Path $repository.FullName $repository.Name
            Remove-NeuraGeneratedPath -Path (Join-Path $checkout 'build')
            Remove-NeuraGeneratedPath -Path (Join-Path $checkout 'rust\target')
          }

          foreach ($drive in [System.IO.DriveInfo]::GetDrives()) {
            if (-not $drive.IsReady) { continue }
            $ownedRoot = Join-Path $drive.RootDirectory.FullName 'neura-ci'
            if (Test-Path -LiteralPath $ownedRoot -PathType Container) {
              Get-ChildItem -LiteralPath $ownedRoot -Directory -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.LastWriteTime -lt $cutoff } |
                Sort-Object -Property LastWriteTime |
                Select-Object -First 12 |
                ForEach-Object { Remove-NeuraGeneratedPath -Path $_.FullName }
            }
          }

          # BEGIN Neura runner storage recovery (kept in sync with tools/Repair-NeuraCiStorage.ps1)
          function Test-NeuraOrdinaryDirectory {
              param([string]$Path)
              if ([string]::IsNullOrWhiteSpace($Path)) { return $false }
              $item = Get-Item -LiteralPath $Path -Force -ErrorAction SilentlyContinue
              return $null -ne $item -and $item.PSIsContainer -and
                  ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0
          }

          function Remove-NeuraDerivedTree {
              param([Parameter(Mandatory)][string]$Path)
              # Avoid invoking the PowerShell provider for every SDK/cache file. A
              # large abandoned extraction can otherwise exceed the recovery timeout.
              # Enumerate one directory at a time and never use recursive deletion:
              # every entry is checked for reparse points, including nested links.
              $pending = New-Object System.Collections.Stack
              $directories = New-Object System.Collections.Stack
              $pending.Push($Path)
              while ($pending.Count -gt 0) {
                  $current = [string]$pending.Pop()
                  try {
                      $attributes = [IO.File]::GetAttributes($current)
                      if (($attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                          Write-Warning "Keeping linked cache entry: $current"
                          continue
                      }
                      if (($attributes -band [IO.FileAttributes]::Directory) -ne 0) {
                          $children = [IO.Directory]::GetFileSystemEntries($current)
                          $directories.Push($current)
                          foreach ($child in $children) { $pending.Push($child) }
                      } else {
                          if (($attributes -band [IO.FileAttributes]::ReadOnly) -ne 0) {
                              [IO.File]::SetAttributes($current,
                                  ($attributes -band (-bnot [IO.FileAttributes]::ReadOnly)))
                          }
                          [IO.File]::Delete($current)
                      }
                  } catch [IO.FileNotFoundException] {
                      continue
                  } catch [IO.DirectoryNotFoundException] {
                      continue
                  } catch {
                      Write-Warning "Keeping unavailable cache entry ${current}: $($_.Exception.Message)"
                  }
              }
              while ($directories.Count -gt 0) {
                  $current = [string]$directories.Pop()
                  try {
                      $attributes = [IO.File]::GetAttributes($current)
                      if (($attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { continue }
                      if (($attributes -band [IO.FileAttributes]::ReadOnly) -ne 0) {
                          [IO.File]::SetAttributes($current,
                              ($attributes -band (-bnot [IO.FileAttributes]::ReadOnly)))
                      }
                      # Non-recursive deletion preserves any skipped or locked child.
                      [IO.Directory]::Delete($current, $false)
                  } catch [IO.DirectoryNotFoundException] {
                      continue
                  } catch {
                      Write-Warning "Keeping nonempty or unavailable cache directory ${current}: $($_.Exception.Message)"
                  }
              }
          }

          function Get-NeuraDirectoryBytes {
              param([Parameter(Mandatory)][string]$Path)
              [long]$bytes = 0
              if (-not (Test-NeuraOrdinaryDirectory -Path $Path)) { return $bytes }
              $pending = New-Object System.Collections.Stack
              $pending.Push($Path)
              while ($pending.Count -gt 0) {
                  try { $entries = [IO.DirectoryInfo]::new([string]$pending.Pop()).GetFileSystemInfos() }
                  catch { continue }
                  foreach ($item in $entries) {
                      if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { continue }
                      if (($item.Attributes -band [IO.FileAttributes]::Directory) -ne 0) { $pending.Push($item.FullName) }
                      else { $bytes += $item.Length }
                  }
              }
              return $bytes
          }

          function Test-NeuraUnlinkedPath {
              param([Parameter(Mandatory)][string]$Path)
              # Checking only the final directory would still follow a linked parent.
              $current = [IO.Path]::GetFullPath($Path)
              while ($current) {
                  $item = Get-Item -LiteralPath $current -Force -ErrorAction SilentlyContinue
                  if (-not $item -or
                      ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { return $false }
                  $parent = [IO.Directory]::GetParent($current)
                  $current = if ($parent) { $parent.FullName } else { $null }
              }
              return $true
          }

          function Clear-NeuraValidationOutput {
              param(
                  [string]$RunRoot,
                  [string]$RunKey,
                  [switch]$ReportOnly
              )
              # Only the finishing job's generated output is eligible. Keep its checkout
              # and logs for actions/checkout's post step and never touch shared caches.
              if ([string]::IsNullOrWhiteSpace($RunRoot) -or $RunKey -notmatch '^\d+-\d+$') {
                  Write-Host 'No current validation workspace was selected; nothing to release.'
                  return
              }
              $root = [IO.DirectoryInfo]::new([IO.Path]::GetFullPath($RunRoot))
              if ($root.Name -notin @('state-matrix', 'living-intelligence', 'workspace') -or
                  -not $root.Parent -or $root.Parent.Name -ne $RunKey -or
                  -not $root.Parent.Parent -or $root.Parent.Parent.Name -ne 'neura-ci' -or
                  -not (Test-NeuraUnlinkedPath -Path $root.FullName)) {
                  Write-Warning 'Validation cleanup rejected a foreign or linked workspace.'
                  return
              }
              $volume = [IO.Path]::GetPathRoot($root.FullName)
              $before = ([IO.DriveInfo]::new($volume)).AvailableFreeSpace
              # Windows release validation checks out directly into <run>/workspace.
              # Release its generated files now; retaining the Git checkout for its post
              # step must not also retain compiled Dart/Flutter data until aged recovery.
              $generated = if ($root.Name -eq 'workspace') {
                  @('build', '.dart_tool', 'android/.gradle', 'rust/target',
                      '.packages', 'windows/flutter/ephemeral')
              } else {
                  @('workspace/build', 'workspace/.dart_tool', 'workspace/android/.gradle',
                      'workspace/rust/target', 'workspace/.packages', 'temp')
              }
              foreach ($relative in $generated) {
                  $path = Join-Path $root.FullName $relative
                  if (-not (Test-NeuraUnlinkedPath -Path $path)) { continue }
                  Write-Host "Completed validation output: $path (report-only=$([bool]$ReportOnly))"
                  if (-not $ReportOnly) { Remove-NeuraDerivedTree -Path $path }
              }
              $after = ([IO.DriveInfo]::new($volume)).AvailableFreeSpace
              Write-Host ("Validation cleanup volume {0}: before={1:N2} GB; after={2:N2} GB; reclaimed={3:N2} GB" -f
                  $volume, ($before / 1GB), ($after / 1GB),
                  ([Math]::Max([long]0, [long]($after - $before)) / 1GB))
          }

          function Remove-NeuraAgedEntry {
              param(
                  [Parameter(Mandatory)][string]$Path,
                  [Parameter(Mandatory)][datetime]$Before,
                  [switch]$ReportOnly
              )
              if (-not (Test-NeuraUnlinkedPath -Path $Path)) { return }
              $item = Get-Item -LiteralPath $Path -Force
              if ($item.LastWriteTime -ge $Before) { return }
              $bytes = if ($item.PSIsContainer) { Get-NeuraDirectoryBytes -Path $Path } else { $item.Length }
              Write-Host ("Aged CI-generated entry: {0} ({1:N2} GB; report-only={2})" -f
                  $Path, ($bytes / 1GB), [bool]$ReportOnly)
              if (-not $ReportOnly) { Remove-NeuraDerivedTree -Path $Path }
          }

          function Invoke-NeuraRunnerRecovery {
              param(
                  [string]$RunnerTemp,
                  [switch]$ReportOnly
              )
              if ([string]::IsNullOrWhiteSpace($RunnerTemp)) { return }
              $runnerWork = Split-Path -Parent $RunnerTemp
              if ((Split-Path -Leaf $RunnerTemp) -ne '_temp' -or
                  (Split-Path -Leaf $runnerWork) -ne '_work' -or
                  -not (Test-NeuraUnlinkedPath -Path $RunnerTemp)) {
                  Write-Warning 'Runner temp layout is absent, unexpected, or linked; leaving it untouched.'
                  return
              }
              # A job has one Runner.Worker. Do not reclaim shared data if another job
              # or a build/test process could still be using it. Age alone is insufficient.
              if (@(Get-Process -Name 'Runner.Worker' -ErrorAction SilentlyContinue).Count -gt 1 -or
                  @(Get-Process -Name java, javaw, dart, flutter_tester, MSBuild, cl, rustc, cargo -ErrorAction SilentlyContinue).Count -gt 0) {
                  Write-Host 'Keeping aged runner data while another worker or build process is active.'
                  return
              }
              $cutoff = (Get-Date).AddHours(-2)
              $checkout = Join-Path (Join-Path $runnerWork 'neura_os') 'neura_os'
              foreach ($root in @($checkout, (Join-Path $checkout 'source'))) {
                  foreach ($relative in @('build', 'rust/target', '.dart_tool', 'android/.gradle')) {
                      Remove-NeuraAgedEntry -Path (Join-Path $root $relative) -Before $cutoff -ReportOnly:$ReportOnly
                  }
              }
              # Folders first: a long backlog of tiny step scripts must not prevent
              # recovery of old extraction/test directories. Keep the 24-entry bound.
              Get-ChildItem -LiteralPath $RunnerTemp -Force -ErrorAction SilentlyContinue |
                  Where-Object { $_.LastWriteTime -lt $cutoff } |
                  Sort-Object @{ Expression = 'PSIsContainer'; Descending = $true }, LastWriteTime |
                  Select-Object -First 24 |
                  ForEach-Object {
                      Remove-NeuraAgedEntry -Path $_.FullName -Before $cutoff -ReportOnly:$ReportOnly
                  }
              $diagnostics = Join-Path (Split-Path -Parent $runnerWork) '_diag'
              if (Test-NeuraUnlinkedPath -Path $diagnostics) {
                  Get-ChildItem -LiteralPath $diagnostics -File -Force -ErrorAction SilentlyContinue |
                      Where-Object {
                          $_.Name -match '^(Runner|Worker)_.*\.log$' -and
                          $_.LastWriteTime -lt (Get-Date).AddDays(-7)
                      } |
                      Sort-Object LastWriteTime |
                      Select-Object -First 24 |
                      ForEach-Object {
                          Remove-NeuraAgedEntry -Path $_.FullName -Before (Get-Date).AddDays(-7) -ReportOnly:$ReportOnly
                      }
              }
          }

          function Test-NeuraPackageDeliveryReceipt {
              param([string]$Path, [string]$Platform, [string]$RunKey)
              # Keep legacy/unverified output and any package changed since delivery.
              # Recovery is offline: only the publisher's completed verification receipt
              # can authorize removal, and every local file must still match it.
              try {
                  if (-not (Test-NeuraUnlinkedPath -Path $Path)) { return $false }
                  $receiptPath = Join-Path $Path 'delivery-verified.json'
                  if (-not (Test-NeuraUnlinkedPath -Path $receiptPath)) { return $false }
                  $receiptFile = Get-Item -LiteralPath $receiptPath -Force
                  if ($receiptFile.PSIsContainer -or $receiptFile.Length -gt 16384) { return $false }
                  $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
                  if ($receipt.version -ne 1 -or $receipt.platform -cne $Platform -or
                      $receipt.run_key -cne $RunKey) { return $false }
                  $files = @($receipt.files)
                  if ($files.Count -notin @(2, 3)) { return $false }
                  $entries = @(Get-ChildItem -LiteralPath $Path -Force)
                  if ($entries.Count -ne ($files.Count + 1)) { return $false }
                  $names = @($files | ForEach-Object { [string]$_.name })
                  if (@($names | Select-Object -Unique).Count -ne $files.Count -or
                      'SHA256SUMS.txt' -notin $names) { return $false }
                  $extension = if ($Platform -eq 'windows') { '.zip' } else { '.apk' }
                  $binaries = @($names | Where-Object { [IO.Path]::GetExtension($_) -eq $extension })
                  if ($binaries.Count -ne 1) { return $false }
                  foreach ($file in $files) {
                      if ($file.name -notmatch '^[a-zA-Z0-9_.-]+$' -or
                          $file.name -notin @($binaries[0], 'SHA256SUMS.txt', 'build-manifest.json') -or
                          $file.sha256 -notmatch '^[0-9a-f]{64}$') { return $false }
                      $candidate = Join-Path $Path $file.name
                      if (-not (Test-NeuraUnlinkedPath -Path $candidate) -or
                          -not (Test-Path -LiteralPath $candidate -PathType Leaf)) { return $false }
                      if ((Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                          $file.sha256) { return $false }
                  }
                  return $true
              } catch {
                  return $false
              }
          }

          function Remove-NeuraStalePackageRuns {
              param(
                  [Parameter(Mandatory)][string]$Root,
                  [int]$RetainPerPlatform = 0,
                  [int]$MaximumRemovals = 24,
                  [switch]$ReportOnly
              )
              if (-not (Test-NeuraOrdinaryDirectory -Path $Root)) { return }
              $currentRun = if ($env:GITHUB_RUN_ID -and $env:GITHUB_RUN_ATTEMPT) {
                  "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
              } else { $null }
              $cutoff = (Get-Date).AddHours(-2)
              [int]$removed = 0
              foreach ($platform in @('android', 'windows')) {
                  $platformRoot = Join-Path $Root $platform
                  if (-not (Test-NeuraOrdinaryDirectory -Path $platformRoot)) { continue }
                  $runs = @(
                      Get-ChildItem -LiteralPath $platformRoot -Directory -Force -ErrorAction SilentlyContinue |
                          Where-Object {
                              $_.Name -match '^\d+-\d+$' -and
                              (Test-NeuraOrdinaryDirectory -Path $_.FullName)
                          } |
                          Sort-Object -Property LastWriteTime -Descending
                  )
                  $keep = if ($RetainPerPlatform -gt 0) {
                      @($runs | Select-Object -First $RetainPerPlatform -ExpandProperty Name)
                  } else { @() }
                  foreach ($run in ($runs | Sort-Object -Property LastWriteTime)) {
                      if ($removed -ge $MaximumRemovals) { return }
                      if ($run.Name -eq $currentRun -or
                          $run.Name -in $keep -or
                          $run.LastWriteTime -ge $cutoff) { continue }
                      if (-not (Test-NeuraPackageDeliveryReceipt -Path $run.FullName -Platform $platform -RunKey $run.Name)) {
                          Write-Host "Keeping package without a matching verified-delivery receipt: $($run.FullName)"
                          continue
                      }
                      Write-Host ("Stale delivered package: {0} ({1:N2} GB)" -f
                          $run.FullName, ((Get-NeuraDirectoryBytes -Path $run.FullName) / 1GB))
                      if (-not $ReportOnly) { Remove-NeuraDerivedTree -Path $run.FullName }
                      $removed++
                  }
              }
          }

          function Invoke-NeuraStorageRecovery {
              param(
                  [Parameter(Mandatory)][string]$ToolCache,
                  [string]$RunnerTemp,
                  [string[]]$PackageRoots = @(),
                  [switch]$ReportOnly
              )
              $before = @{}
              foreach ($drive in [IO.DriveInfo]::GetDrives() | Where-Object { $_.IsReady -and $_.DriveType -eq 'Fixed' }) {
                  $before[$drive.Name] = $drive.AvailableFreeSpace
              }
              Invoke-NeuraRunnerRecovery -RunnerTemp $RunnerTemp -ReportOnly:$ReportOnly
              if (-not (Test-NeuraOrdinaryDirectory -Path $ToolCache)) {
                  Write-Warning 'Runner tool cache is absent or linked; leaving it untouched.'
                  return
              }

              $flutter = Join-Path $ToolCache 'flutter'
              if (Test-NeuraOrdinaryDirectory -Path $flutter) {
                  foreach ($version in Get-ChildItem -LiteralPath $flutter -Directory -Force) {
                      if ($version.Name -notmatch '^\d+\.\d+\.\d+$' -or
                          -not (Test-NeuraOrdinaryDirectory -Path $version.FullName)) { continue }
                      $stage = Join-Path $version.FullName '.install'
                      if (-not (Test-NeuraOrdinaryDirectory -Path $stage)) { continue }
                      if ($ReportOnly) {
                          Write-Host ("Flutter staging (report only): {0} ({1:N2} GB)" -f
                              $stage, ((Get-NeuraDirectoryBytes -Path $stage) / 1GB))
                          continue
                      }
                      $lock = $null
                      try {
                          # Use the installer's actual version lock. Age alone cannot
                          # distinguish an abandoned extraction from a live install.
                          $lockPath = Join-Path $flutter ".$($version.Name).install.lock"
                          $lock = [IO.File]::Open($lockPath, [IO.FileMode]::OpenOrCreate,
                              [IO.FileAccess]::ReadWrite, [IO.FileShare]::None)
                      } catch [IO.IOException] {
                          Write-Host "Keeping active Flutter staging: $stage"
                          continue
                      }
                      try {
                          Write-Host ("Abandoned Flutter staging: {0} ({1:N2} GB)" -f
                              $stage, ((Get-NeuraDirectoryBytes -Path $stage) / 1GB))
                          if (-not $ReportOnly) { Remove-NeuraDerivedTree -Path $stage }
                      } finally {
                          if ($lock) { $lock.Dispose() }
                      }
                  }
              }

              # The selected build volume owns all mutable Gradle state. Keep only
              # reusable wrapper distributions and dependency downloads in the persistent
              # tool cache; discard every other known Gradle directory when idle.
              $android = Join-Path $ToolCache 'neura-android'
              $gradle = Join-Path $android 'gradle-home'
              $caches = Join-Path $gradle 'caches'
              if ((Test-NeuraOrdinaryDirectory -Path $android) -and
                  (Test-NeuraOrdinaryDirectory -Path $gradle)) {
                  if (@(Get-Process -Name java, javaw -ErrorAction SilentlyContinue).Count -gt 0) {
                      Write-Host 'Keeping Gradle derived caches while a Java process is running.'
                  } else {
                      foreach ($entry in Get-ChildItem -LiteralPath $gradle -Directory -Force) {
                          if ($entry.Name -in @('wrapper', 'caches') -or
                              -not (Test-NeuraOrdinaryDirectory -Path $entry.FullName)) { continue }
                          Write-Host ("Disposable Gradle directory: {0} ({1:N2} GB)" -f
                              $entry.FullName, ((Get-NeuraDirectoryBytes -Path $entry.FullName) / 1GB))
                          if (-not $ReportOnly) { Remove-NeuraDerivedTree -Path $entry.FullName }
                      }
                      if (Test-NeuraOrdinaryDirectory -Path $caches) {
                          foreach ($entry in Get-ChildItem -LiteralPath $caches -Directory -Force) {
                              if ($entry.Name -eq 'modules-2' -or
                                  -not (Test-NeuraOrdinaryDirectory -Path $entry.FullName)) { continue }
                              Write-Host ("Disposable Gradle cache: {0} ({1:N2} GB)" -f
                                  $entry.FullName, ((Get-NeuraDirectoryBytes -Path $entry.FullName) / 1GB))
                              if (-not $ReportOnly) { Remove-NeuraDerivedTree -Path $entry.FullName }
                          }
                      }
                  }
              }

              # Report only sizes inside known CI-owned roots. Never inspect personal
              # folders or delete installed SDKs, Flutter versions, or dependency jars.
              foreach ($entry in Get-ChildItem -LiteralPath $ToolCache -Directory -Force) {
                  Write-Host ("Retained CI tools: {0} = {1:N2} GB" -f
                      $entry.Name, ((Get-NeuraDirectoryBytes -Path $entry.FullName) / 1GB))
              }
              foreach ($packages in $PackageRoots) {
                  if ([string]::IsNullOrWhiteSpace($packages)) { continue }
                  Remove-NeuraStalePackageRuns -Root $packages -ReportOnly:$ReportOnly
                  Write-Host ("Retained Neura packages at {0}: {1:N2} GB" -f
                      $packages, ((Get-NeuraDirectoryBytes -Path $packages) / 1GB))
              }
              foreach ($name in $before.Keys) {
                  $drive = [IO.DriveInfo]::new($name)
                  Write-Host ("CI recovery volume {0}: before={1:N2} GB; after={2:N2} GB; reclaimed={3:N2} GB" -f
                      $name, ($before[$name] / 1GB), ($drive.AvailableFreeSpace / 1GB),
                      ([Math]::Max([long]0, [long]($drive.AvailableFreeSpace - $before[$name])) / 1GB))
              }
          }

          $packageRoots = @(
              [IO.DriveInfo]::GetDrives() |
                  Where-Object {
                      $_.IsReady -and
                      ($_.DriveType -eq [IO.DriveType]::Fixed -or
                       $_.DriveType -eq [IO.DriveType]::Removable)
                  } |
                  ForEach-Object { Join-Path $_.RootDirectory.FullName 'neura-packages' }
          )
          Invoke-NeuraStorageRecovery `
              -ToolCache $env:RUNNER_TOOL_CACHE `
              -RunnerTemp $env:RUNNER_TEMP `
              -PackageRoots $packageRoots
          # END Neura runner storage recovery

          $systemDriveName = $systemRoot.TrimEnd('\').TrimEnd(':')
          $systemDrive = Get-PSDrive -Name $systemDriveName -ErrorAction SilentlyContinue
          if (-not $systemDrive) {
            throw "Unable to inspect the system volume $systemRoot."
          }
          $systemFree = $systemDrive.Free
          $systemMetadataMinimum = 1.0GB
          $systemBuildMinimum = 16.0GB
          $sharedVolumeMinimum = 16.0GB
          $buildVolumeMinimum = 12.0GB
          $sdkVolumeMinimum = 3.25GB
          if ($systemFree -lt $systemMetadataMinimum) {
            throw "The runner needs 1.0 GB on $systemRoot for metadata; only $([Math]::Round($systemFree / 1GB, 2)) GB is free."
          }

          $eligible = @(
            [System.IO.DriveInfo]::GetDrives() |
              Where-Object { $_.IsReady } |
              Where-Object { Test-NeuraCiVolume -Drive $_ } |
              Sort-Object -Property AvailableFreeSpace -Descending
          )
          [System.IO.DriveInfo]::GetDrives() |
            Where-Object { $_.IsReady -and $_.DriveType -eq [System.IO.DriveType]::Fixed } |
            ForEach-Object { Write-Host ("Volume {0}: {1:N2} GB free" -f $_.Name, ($_.AvailableFreeSpace / 1GB)) }
          # Prefer a qualifying non-system build volume even when C: happens
          # to report more free space. C: remains an explicit 16 GB fallback.
          $nonSystemCandidates = @($eligible | Where-Object { $_.Name -ne $systemRoot })
          $systemCandidates = @($eligible | Where-Object { $_.Name -eq $systemRoot })
          # A shared volume must carry checkout, APK output, run-local Gradle
          # transforms, and any cold SDK/JDK extraction. The observed 11.59 GB
          # system-volume run exhausted the disk during JetifyTransform, so the
          # shared and system fallbacks deliberately require 16 GB.
          $sharedDrive = $nonSystemCandidates |
            Where-Object { $_.AvailableFreeSpace -ge $sharedVolumeMinimum } |
            Select-Object -First 1
          if ($sharedDrive) {
            $buildDrive = $sharedDrive
            $sdkDrive = $sharedDrive
            $layout = 'shared'
          } else {
            $buildDrive = @(
              $nonSystemCandidates
              $systemCandidates
            ) |
              Where-Object {
                $_.AvailableFreeSpace -ge $buildVolumeMinimum -and
                ($_.Name -ne $systemRoot -or $_.AvailableFreeSpace -ge $systemBuildMinimum)
              } |
              Select-Object -First 1
            $sdkDrive = $eligible |
              Where-Object {
                $buildDrive -and
                $_.Name -ne $buildDrive.Name -and
                $_.AvailableFreeSpace -ge $sdkVolumeMinimum -and
                ($_.Name -ne $systemRoot -or $_.AvailableFreeSpace -ge 6.0GB)
              } |
              Select-Object -First 1
            if ($buildDrive -and $sdkDrive) {
              $layout = 'separate'
            } else {
              $sharedDrive = $systemCandidates |
                Where-Object { $_.AvailableFreeSpace -ge $systemBuildMinimum } |
                Select-Object -First 1
              if (-not $sharedDrive) {
                throw ('Android validation requires either one writable volume with at least 16 GB free, ' +
                  'or separate writable volumes with at least 12 GB for checkout/build/Gradle data and ' +
                  '3.25 GB for SDK/JDK staging. The system volume is used for build data only when it ' +
                  'has at least 16 GB free, and always keeps 1 GB for runner metadata.')
              }
              $buildDrive = $sharedDrive
              $sdkDrive = $sharedDrive
              $layout = 'system fallback'
            }
          }
          @(
            "NEURA_ANDROID_SDK_VOLUME=$($sdkDrive.RootDirectory.FullName)",
            "NEURA_ANDROID_BUILD_VOLUME=$($buildDrive.RootDirectory.FullName)",
            "NEURA_ANDROID_RUN_KEY=$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Android volume layout: $layout"
          Write-Host "SDK/JDK volume: $($sdkDrive.Name) ($([Math]::Round($sdkDrive.AvailableFreeSpace / 1GB, 2)) GB free)"
          Write-Host "Source/build volume: $($buildDrive.Name) ($([Math]::Round($buildDrive.AvailableFreeSpace / 1GB, 2)) GB free)"

      - name: Route source checkout to the build volume
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Remove-LinkOrDirectory {
            param([Parameter(Mandatory)][string]$Path)
            if (-not (Test-Path -LiteralPath $Path)) { return }
            $item = Get-Item -LiteralPath $Path -Force
            if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
              & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$Path"
            } else {
              Remove-Item -LiteralPath $Path -Recurse -Force
            }
          }

          $sourceLink = Join-Path $env:GITHUB_WORKSPACE 'source'
          $workspaceTarget = Join-Path $env:NEURA_ANDROID_BUILD_VOLUME "neura-ci\$env:NEURA_ANDROID_RUN_KEY\workspace"
          $cleanupTemp = [System.Environment]::GetEnvironmentVariable('RUNNER_TEMP')
          if ([string]::IsNullOrWhiteSpace($cleanupTemp) -or
              -not (Test-Path -LiteralPath $cleanupTemp)) {
            $cleanupTemp = [System.IO.Path]::GetTempPath().TrimEnd('\')
          }
          Set-Location -LiteralPath $cleanupTemp
          Remove-LinkOrDirectory -Path $sourceLink
          Remove-LinkOrDirectory -Path $workspaceTarget
          New-Item -ItemType Directory -Path $workspaceTarget -Force | Out-Null
          New-Item -ItemType Junction -Path $sourceLink -Target $workspaceTarget | Out-Null
          "NEURA_ANDROID_SOURCE_ROOT=$sourceLink" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out source
        uses: actions/checkout@v5
        with:
          path: source

      - name: Validate release publisher syntax
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $scriptPath = Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'tools\Publish-NeuraReleaseAssets.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'Release publisher contains PowerShell syntax errors.'
          }

      - name: Route Android caches and output
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Remove-LinkOrDirectory {
            param([Parameter(Mandatory)][string]$Path)
            if (-not (Test-Path -LiteralPath $Path)) { return }
            $item = Get-Item -LiteralPath $Path -Force
            if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
              & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$Path"
            } else {
              Remove-Item -LiteralPath $Path -Recurse -Force
            }
          }

          $buildRoot = Join-Path $env:NEURA_ANDROID_BUILD_VOLUME "neura-ci\$env:NEURA_ANDROID_RUN_KEY\android-build"
          $toolRoot = Join-Path $env:NEURA_ANDROID_SDK_VOLUME "neura-ci\$env:NEURA_ANDROID_RUN_KEY\android-tools"
          $outputRoot = Join-Path $buildRoot 'build'
          $androidUserHome = Join-Path $buildRoot 'android-user'
          $tempRoot = Join-Path $buildRoot 'temp'
          # Transform/build caches are run-local on the selected build volume.
          # Retain only checksum-verified tools and Gradle's reusable wrapper.
          # Dependency downloads are run-local; resolve the lockfile every run.
          $persistentToolRoot = Join-Path $env:RUNNER_TOOL_CACHE 'neura-android'
          $pubCache = Join-Path $env:RUNNER_TOOL_CACHE 'neura-dependencies\pub-cache-flutter-3.47.5'
          $gradleHome = Join-Path $buildRoot 'gradle-home'
          $persistentGradleHome = Join-Path $persistentToolRoot 'gradle-home'
          $persistentGradleWrapper = Join-Path $persistentGradleHome 'wrapper'
          $persistentGradleModules = Join-Path $persistentGradleHome 'caches\modules-2'
          $gradleCaches = Join-Path $gradleHome 'caches'
          $sdkRoot = Join-Path $persistentToolRoot 'sdk-36.0.0-ndk-28.2.13676358'
          $jdkRoot = Join-Path $persistentToolRoot 'jdk-17.0.19+10'

          Remove-LinkOrDirectory -Path (Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'build')
          Remove-LinkOrDirectory -Path $buildRoot
          Remove-LinkOrDirectory -Path $toolRoot
          foreach ($path in @(
            $outputRoot,
            $pubCache,
            $gradleHome,
            $gradleCaches,
            $persistentGradleWrapper,
            $persistentGradleModules,
            $androidUserHome,
            $tempRoot,
            $toolRoot,
            $persistentToolRoot
          )) {
            New-Item -ItemType Directory -Path $path -Force | Out-Null
          }
          New-Item -ItemType Junction `
            -Path (Join-Path $gradleHome 'wrapper') `
            -Target $persistentGradleWrapper | Out-Null
          # Gradle 9.3.1 Kotlin DSL must load plugin jars from ordinary paths.
          # Keep downloads run-local too: the modules-2 junction still exposed
          # Flutter's included Gradle build to the linked-classpath regression.
          # Existing headroom checks and run-root cleanup cover this directory.
          New-Item -ItemType Directory `
            -Path (Join-Path $gradleCaches 'modules-2') -Force | Out-Null
          New-Item -ItemType Junction `
            -Path (Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'build') `
            -Target $outputRoot | Out-Null

          @(
            "NEURA_ANDROID_BUILD_ROOT=$buildRoot",
            "NEURA_ANDROID_TOOL_ROOT=$toolRoot",
            "NEURA_ANDROID_GRADLE_ROOT=$gradleHome",
            "NEURA_ANDROID_GRADLE_WRAPPER_LINK=$(Join-Path $gradleHome 'wrapper')",
            "NEURA_ANDROID_SDK_ROOT=$sdkRoot",
            "NEURA_ANDROID_JDK_ROOT=$jdkRoot",
            "PUB_CACHE=$pubCache",
            "GRADLE_USER_HOME=$gradleHome",
            "ANDROID_USER_HOME=$androidUserHome",
            "TEMP=$tempRoot",
            "TMP=$tempRoot"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable pinned Flutter 3.47.5
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          & "$env:NEURA_ANDROID_SOURCE_ROOT\tools\Enable-NeuraFlutter.ps1" `
            -Version $env:FLUTTER_VERSION `
            -ExpectedSha256 $env:FLUTTER_SHA256

      - name: Use verified JDK 17
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Find-VerifiedJdk17 {
            $candidates = @()
            if (-not [string]::IsNullOrWhiteSpace($env:JAVA_HOME)) {
              $candidates += Join-Path $env:JAVA_HOME 'bin\java.exe'
            }
            $javaCommand = Get-Command java.exe -ErrorAction SilentlyContinue
            if ($javaCommand -and $javaCommand.Source) {
              $candidates += $javaCommand.Source
            }

            # Prefer established runner toolchain locations before using the
            # verified, bounded fallback download below.
            $searchRoots = @(
              $env:RUNNER_TOOL_CACHE,
              (Join-Path $env:ProgramFiles 'Android\Android Studio\jbr'),
              (Join-Path $env:ProgramFiles 'Eclipse Adoptium'),
              (Join-Path $env:ProgramFiles 'Microsoft'),
              (Join-Path $env:ProgramFiles 'Java')
            ) | Where-Object {
              -not [string]::IsNullOrWhiteSpace($_) -and
              (Test-Path -LiteralPath $_ -PathType Container)
            }
            foreach ($searchRoot in $searchRoots) {
              $candidates += Get-ChildItem -LiteralPath $searchRoot -Filter 'java.exe' -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty FullName
            }

            foreach ($candidate in ($candidates | Select-Object -Unique)) {
              if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) { continue }
              # java -version writes normal output to stderr. Capture it through
              # cmd so Windows PowerShell does not promote it to NativeCommandError
              # while ErrorActionPreference is Stop.
              $versionOutput = (
                & $env:ComSpec /d /s /c "`"$candidate`" -version 2>&1" |
                  Out-String
              )
              if ($versionOutput -match 'version\s+' -and $versionOutput -match '17') {
                $javaHome = Split-Path -Parent (Split-Path -Parent $candidate)
                $javacExe = Join-Path $javaHome 'bin\javac.exe'
                if (Test-Path -LiteralPath $javacExe -PathType Leaf) {
                  return (Get-Item -LiteralPath $candidate).FullName
                }
              }
            }
            return $null
          }

          $javaExe = Find-VerifiedJdk17
          if (-not $javaExe) {
            $archive = Join-Path $env:NEURA_ANDROID_TOOL_ROOT 'temurin17.zip'
            $uri = 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.19%2B10/OpenJDK17U-jdk_x64_windows_hotspot_17.0.19_10.zip'
            $expected = 'b5b235c48adf6a081874b812c630b9f4b5f637b7a5ed18b9174d08a41ec4c235'
            $downloaded = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Downloading verified Temurin JDK 17 (attempt $attempt/3)..."
                Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive -TimeoutSec 600
                # Checksum verification is deliberately inside the retry loop:
                # a mismatch is at least as likely to be a truncated/corrupted
                # download over a flaky connection as a bad file, and a single
                # bad byte previously failed the whole job with no retry.
                $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($actual -ne $expected) {
                  throw "Temurin JDK checksum mismatch: $actual"
                }
                $downloaded = $true
                break
              } catch {
                Write-Warning "JDK download attempt $attempt failed: $($_.Exception.Message)"
                Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
                if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
              }
            }
            if (-not $downloaded) {
              throw 'Unable to download a checksum-verified Temurin JDK 17 after 3 attempts.'
            }

            Expand-Archive -LiteralPath $archive -DestinationPath $env:NEURA_ANDROID_JDK_ROOT -Force
            Remove-Item -LiteralPath $archive -Force
            $javaExe = Get-ChildItem -LiteralPath $env:NEURA_ANDROID_JDK_ROOT -Filter 'java.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Directory.Name -eq 'bin' } |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $javaExe) {
              throw 'Verified Temurin archive did not contain bin\java.exe.'
            }
          }

          $javaHome = Split-Path -Parent (Split-Path -Parent $javaExe)
          $javacExe = Join-Path $javaHome 'bin\javac.exe'
          if (-not (Test-Path -LiteralPath $javacExe -PathType Leaf)) {
            throw "JDK 17 was found at $javaHome but javac.exe is missing."
          }

          @(
            "JAVA_HOME=$javaHome",
            "NEURA_ANDROID_JDK_ROOT=$javaHome",
            "JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=$env:TEMP"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $javaHome 'bin') |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          & $javaExe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $javacExe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified Android SDK packages
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $requiredPackages = @(
            (Join-Path $env:NEURA_ANDROID_SDK_ROOT 'cmdline-tools\\latest\\bin\\sdkmanager.bat'),
            (Join-Path $env:NEURA_ANDROID_SDK_ROOT 'platform-tools\\adb.exe'),
            (Join-Path $env:NEURA_ANDROID_SDK_ROOT 'platforms\\android-36\\android.jar'),
            (Join-Path $env:NEURA_ANDROID_SDK_ROOT 'build-tools\\36.0.0\\aapt2.exe'),
            (Join-Path $env:NEURA_ANDROID_SDK_ROOT 'ndk\\28.2.13676358\\source.properties')
          )
          $sdkCacheComplete = @($requiredPackages | Where-Object {
            -not (Test-Path -LiteralPath $_ -PathType Leaf)
          }).Count -eq 0

          if ($sdkCacheComplete) {
            Write-Host "Reusing verified Android SDK package cache at $env:NEURA_ANDROID_SDK_ROOT."
          } else {
            # Never trust or layer over a partial cache from an interrupted run.
            Remove-Item -LiteralPath $env:NEURA_ANDROID_SDK_ROOT -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $env:NEURA_ANDROID_SDK_ROOT -Force | Out-Null

            $archive = Join-Path $env:NEURA_ANDROID_TOOL_ROOT 'command-line-tools.zip'
            $extract = Join-Path $env:NEURA_ANDROID_TOOL_ROOT '_extract'
            $uri = 'https://dl.google.com/android/repository/commandlinetools-win-15859902_latest.zip'
            $expected = '90ae805d20434428bffcb699c290860f19bb5f66a67e6b330067e3de801fb04a'

            $maxRetries = 3
            $retryCount = 0
            $downloadSuccess = $false
            while ($retryCount -lt $maxRetries -and -not $downloadSuccess) {
              try {
                Write-Host "Downloading Android SDK command-line tools (attempt $($retryCount + 1)/$maxRetries)..."
                Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $archive -TimeoutSec 600
                $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($actual -ne $expected) {
                  throw "Android command-line tools checksum mismatch: $actual"
                }
                $downloadSuccess = $true
              } catch {
                $retryCount++
                Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
                if ($retryCount -lt $maxRetries) {
                  Write-Warning "Download failed: $($_.Exception.Message). Retrying in 30 seconds..."
                  Start-Sleep -Seconds 30
                } else {
                  throw "Failed to download a verified Android SDK command-line tools archive after $maxRetries attempts: $($_.Exception.Message)"
                }
              }
            }

            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            Remove-Item -LiteralPath $archive -Force
            $latest = Join-Path $env:NEURA_ANDROID_SDK_ROOT 'cmdline-tools\\latest'
            New-Item -ItemType Directory -Path (Split-Path -Parent $latest) -Force | Out-Null
            Move-Item -LiteralPath (Join-Path $extract 'cmdline-tools') -Destination $latest
            Remove-Item -LiteralPath $extract -Recurse -Force
            $sdkManager = Join-Path $latest 'bin\\sdkmanager.bat'
            if (-not (Test-Path -LiteralPath $sdkManager -PathType Leaf)) {
              throw 'sdkmanager.bat was not installed.'
            }

            $licenseAnswers = Join-Path $env:TEMP 'android-sdk-license-answers.txt'
            1..200 | ForEach-Object { 'y' } |
              Set-Content -LiteralPath $licenseAnswers -Encoding ASCII
            $licenseCommand = (
              '"{0}" "--sdk_root={1}" --licenses < "{2}"' -f
              $sdkManager,
              $env:NEURA_ANDROID_SDK_ROOT,
              $licenseAnswers
            )
            & "$env:SystemRoot\\System32\\cmd.exe" /d /s /c $licenseCommand
            if ($LASTEXITCODE -ne 0) { throw "License acceptance failed: $LASTEXITCODE" }

            & $sdkManager `
              "--sdk_root=$env:NEURA_ANDROID_SDK_ROOT" `
              'platform-tools' `
              'platforms;android-36' `
              'build-tools;36.0.0' `
              'ndk;28.2.13676358'
            if ($LASTEXITCODE -ne 0) { throw "Android SDK install failed: $LASTEXITCODE" }
          }

          foreach ($required in $requiredPackages) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Android SDK package cache is incomplete: $required"
            }
          }

          $sdkManager = Join-Path $env:NEURA_ANDROID_SDK_ROOT 'cmdline-tools\\latest\\bin\\sdkmanager.bat'
          @(
            "ANDROID_HOME=$env:NEURA_ANDROID_SDK_ROOT",
            "ANDROID_SDK_ROOT=$env:NEURA_ANDROID_SDK_ROOT"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path (Split-Path -Parent $sdkManager) '') |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $env:NEURA_ANDROID_SDK_ROOT 'platform-tools') |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          flutter config --android-sdk $env:NEURA_ANDROID_SDK_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter doctor -v

      - name: Restore dependencies
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_ANDROID_SOURCE_ROOT
          $pubLog = Join-Path $PWD 'pub-get.log'
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            flutter pub get --verbose *> $pubLog
            $pubExitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
          if (Test-Path -LiteralPath $pubLog -PathType Leaf) {
            Get-Content -LiteralPath $pubLog | Out-Host
          }
          if ($pubExitCode -ne 0) {
            throw "flutter pub get failed with exit code $pubExitCode. See $pubLog."
          }

      - name: Prepare public client build configuration
        id: client_config
        env:
          NEURA_SUPABASE_URL: ${{ vars.NEURA_SUPABASE_URL }}
          NEURA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEURA_SUPABASE_PUBLISHABLE_KEY }}
          NEURA_REQUIRE_CONFIG: ${{ inputs.require_sync_configuration }}
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $requireConfig = $env:NEURA_REQUIRE_CONFIG -eq 'true'
          $configPath = Join-Path $env:RUNNER_TEMP "neura-client-$env:GITHUB_RUN_ID-$env:GITHUB_JOB.json"
          & "$env:NEURA_ANDROID_SOURCE_ROOT\tools\New-NeuraClientBuildConfig.ps1" -OutputPath $configPath -RequireConfiguration:$requireConfig

      - name: Confirm Android build headroom
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $buildRoot = [IO.Path]::GetPathRoot([IO.Path]::GetFullPath($env:NEURA_ANDROID_BUILD_ROOT))
          $systemRoot = [IO.Path]::GetPathRoot([IO.Path]::GetFullPath($env:RUNNER_TEMP))
          $buildDrive = [IO.DriveInfo]::new($buildRoot)
          $systemDrive = [IO.DriveInfo]::new($systemRoot)
          $buildMinimum = if ($buildRoot -eq $systemRoot) { 12.0GB } else { 10.0GB }
          Write-Host ("Build/Gradle volume {0}: {1:N2} GB free; required {2:N2} GB" -f
            $buildRoot, ($buildDrive.AvailableFreeSpace / 1GB), ($buildMinimum / 1GB))
          Write-Host ("System volume {0}: {1:N2} GB free" -f
            $systemRoot, ($systemDrive.AvailableFreeSpace / 1GB))
          if ($buildDrive.AvailableFreeSpace -lt $buildMinimum) {
            throw 'Android build headroom fell below the safe pre-build threshold.'
          }
          if ($systemDrive.AvailableFreeSpace -lt 1.0GB) {
            throw 'The system volume must retain at least 1.0 GB for runner metadata during the Android build.'
          }
          if ([IO.Path]::GetFullPath($env:GRADLE_USER_HOME) -ne
              [IO.Path]::GetFullPath($env:NEURA_ANDROID_GRADLE_ROOT)) {
            throw 'GRADLE_USER_HOME is not routed to the selected Android build volume.'
          }
          if ([IO.Path]::GetPathRoot([IO.Path]::GetFullPath($env:GRADLE_USER_HOME)) -ne $buildRoot) {
            throw 'Gradle transform storage is not on the selected Android build volume.'
          }

      - name: Build APK
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_ANDROID_SOURCE_ROOT
          $buildLog = Join-Path $PWD 'android-build.log'
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          if (-not $versionLine) {
            throw 'pubspec.yaml does not contain a valid version line.'
          }
          $version = $versionLine.Matches[0].Groups[1].Value.Trim()
          $buildName = $version.Split('+')[0]
          if ([string]::IsNullOrWhiteSpace($buildName)) {
            throw 'The Flutter build name resolved to an empty value.'
          }
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $buildArguments = @('build', 'apk', '--debug', '--no-pub', '--verbose', '--build-name', $buildName, '--build-number', $env:GITHUB_RUN_NUMBER)
            if (-not [string]::IsNullOrWhiteSpace($env:NEURA_DART_DEFINE_FILE)) {
              if (-not (Test-Path -LiteralPath $env:NEURA_DART_DEFINE_FILE -PathType Leaf)) { throw 'Public Dart define file is missing.' }
              $buildArguments += "--dart-define-from-file=$env:NEURA_DART_DEFINE_FILE"
            }
            flutter @buildArguments *> $buildLog
            $buildExitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
          if (Test-Path -LiteralPath $buildLog -PathType Leaf) {
            Get-Content -LiteralPath $buildLog | Out-Host
          }
          if ($buildExitCode -ne 0) {
            throw "flutter build apk failed with exit code $buildExitCode. See $buildLog."
          }

      - name: Verify Android APK
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_ANDROID_SOURCE_ROOT
          $apk = Get-ChildItem -LiteralPath 'build\app\outputs' -Filter '*.apk' -File -Recurse |
            Where-Object { $_.Length -gt 0 } |
            Select-Object -First 1
          if (-not $apk) { throw 'No non-empty APK was produced.' }

          $output = Join-Path $PWD 'recovery_downloads\android'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim().Split('+')[0]
          $apkName = "NeuraCompanion_Android_${version}_recovery.$env:GITHUB_RUN_NUMBER.apk"
          $destination = Join-Path $output $apkName
          Copy-Item -LiteralPath $apk.FullName -Destination $destination
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $apkName" | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding ASCII
          Write-Host "Verified APK: $destination"
          Write-Host "APK size: $((Get-Item -LiteralPath $destination).Length) bytes"
          Write-Host "SHA256: $hash"

      - name: Preserve configured Android package
        if: steps.client_config.outputs.configured == 'true'
        id: configured_package
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: '& "$env:NEURA_ANDROID_SOURCE_ROOT\tools\Save-NeuraConfiguredPackage.ps1" -SourceRoot $env:NEURA_ANDROID_SOURCE_ROOT -Platform android -BuildVolume $env:NEURA_ANDROID_BUILD_VOLUME'

      - name: Preserve local-only Android package
        if: steps.client_config.outputs.configured != 'true'
        id: local_package
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          # Failed release delivery must survive cleanup of this run's checkout.
          $verified = Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'recovery_downloads\android'
          $packagePath = Join-Path $env:NEURA_ANDROID_BUILD_VOLUME "neura-packages\android\$env:NEURA_ANDROID_RUN_KEY"
          if (Test-Path -LiteralPath $packagePath) { throw 'Recovery package path already exists; refusing to overwrite it.' }
          $files = @(Get-ChildItem -LiteralPath $verified -File)
          if ($files.Count -ne 2 -or 'SHA256SUMS.txt' -notin $files.Name -or
              @($files | Where-Object { $_.Extension -eq '.apk' -and $_.Length -gt 0 }).Count -ne 1) {
            throw 'Expected the verified APK and its checksum before preservation.'
          }
          New-Item -ItemType Directory -Path $packagePath -Force | Out-Null
          foreach ($file in $files) { Copy-Item -LiteralPath $file.FullName -Destination $packagePath }
          "package_path=$packagePath" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Recoverable local-only Android package: $packagePath"

      - name: Release Android intermediates before delivery
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          # The verified APK and configured package already exist outside the
          # generated build root. Free intermediates before download verification.
          $expected = Join-Path $env:NEURA_ANDROID_BUILD_VOLUME "neura-ci\$env:NEURA_ANDROID_RUN_KEY\android-build"
          if ([IO.Path]::GetFullPath($env:NEURA_ANDROID_BUILD_ROOT) -ne [IO.Path]::GetFullPath($expected)) {
            throw 'Unexpected Android build root; refusing intermediate cleanup.'
          }
          Set-Location -LiteralPath $env:NEURA_ANDROID_SOURCE_ROOT
          $gradle = Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'android\gradlew.bat'
          if (Test-Path -LiteralPath $gradle -PathType Leaf) {
            & $gradle --stop | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Gradle did not stop before delivery cleanup.' }
          }
          $buildLink = Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'build'
          $link = Get-Item -LiteralPath $buildLink -Force -ErrorAction SilentlyContinue
          if ($link) {
            if (($link.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
              throw 'Expected an Android build junction before delivery cleanup.'
            }
            & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$buildLink"
            if ($LASTEXITCODE -ne 0) { throw 'Could not unlink the Android build output.' }
          }
          foreach ($cacheLinkPath in @(
            $env:NEURA_ANDROID_GRADLE_WRAPPER_LINK
          )) {
            if ([string]::IsNullOrWhiteSpace($cacheLinkPath)) { continue }
            $cacheLink = Get-Item -LiteralPath $cacheLinkPath -Force -ErrorAction SilentlyContinue
            if (-not $cacheLink) { continue }
            if (($cacheLink.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
              throw "Expected a Gradle cache junction at $cacheLinkPath."
            }
            & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$cacheLinkPath"
            if ($LASTEXITCODE -ne 0) { throw "Could not unlink Gradle cache path $cacheLinkPath." }
          }
          # The ordinary, run-local modules-2 directory is removed with the
          # build root. Use the tested walker so nested links cannot delete
          # external data.
          $helper = Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'tools\Repair-NeuraCiStorage.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($helper, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw 'Storage helper has syntax errors.' }
          $definition = $ast.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Remove-NeuraDerivedTree'
          }, $true)
          if ($null -eq $definition) { throw 'Storage cleanup function is missing.' }
          . ([scriptblock]::Create($definition.Extent.Text))
          Remove-NeuraDerivedTree -Path $expected
          # Keep the configured temporary path available for subsequent tools.
          New-Item -ItemType Directory -Path (Join-Path $expected 'temp') -Force | Out-Null
          $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($expected))
          Write-Host ("Free before release delivery: {0:N2} GB" -f ($drive.AvailableFreeSpace / 1GB))

      - name: Publish required Android release assets
        # Every package run requires a downloadable APK and checksum.
        # Do not report success until each release asset has been downloaded
        # again and matched to its local SHA-256 digest.
        id: release_delivery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEURA_CONFIGURED_PACKAGE_PATH: ${{ steps.configured_package.outputs.package_path }}
          NEURA_LOCAL_PACKAGE_PATH: ${{ steps.local_package.outputs.package_path }}
          NEURA_RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NEURA_RELEASE_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $packagePath = $env:NEURA_CONFIGURED_PACKAGE_PATH
          if ([string]::IsNullOrWhiteSpace($packagePath)) {
            $packagePath = $env:NEURA_LOCAL_PACKAGE_PATH
          }
          if ([string]::IsNullOrWhiteSpace($packagePath)) { throw 'No recoverable Android package was preserved.' }
          & "$env:NEURA_ANDROID_SOURCE_ROOT\tools\Publish-NeuraReleaseAssets.ps1" `
            -Platform android `
            -PackagePath $packagePath `
            -BuildVolume $env:NEURA_ANDROID_BUILD_VOLUME

      - name: Record diagnostic evidence in run summary
        if: always()
        continue-on-error: true
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        env:
          NEURA_REPORT_TITLE: Neura-SelfHosted-Android-restore-build-logs
          NEURA_REPORT_PATHS: |
            ${{ github.workspace }}\source\pub-get.log
            ${{ github.workspace }}\source\android-build.log
        run: |
          $ErrorActionPreference = 'Stop'
          $summary = @(
            "### $env:NEURA_REPORT_TITLE",
            '',
            "Tested commit: $env:GITHUB_SHA",
            '',
            'Diagnostic excerpts are below. Full command output remains in the job logs; use Download log archive on this run to save it.',
            ''
          )
          $remaining = 200000
          foreach ($path in ($env:NEURA_REPORT_PATHS -split '\r?\n')) {
            if ([string]::IsNullOrWhiteSpace($path)) { continue }
            $summary += "#### $(Split-Path -Leaf $path)"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              $summary += 'Not produced; check the preceding validation steps.'
              continue
            }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $summary += "SHA-256: $hash"
            $excerpt = (Get-Content -LiteralPath $path -Tail 200) -join [Environment]::NewLine
            $excerpt = $excerpt -replace '\x1b\[[0-?]*[ -/]*[@-~]', ''
            $excerpt = [Net.WebUtility]::HtmlEncode($excerpt)
            $limit = [Math]::Min(40000, $remaining)
            if ($excerpt.Length -gt $limit) { $excerpt = $excerpt.Substring($excerpt.Length - $limit) }
            $remaining -= $excerpt.Length
            $summary += @('<pre>', $excerpt, '</pre>', '')
          }
          $summary | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host 'Diagnostic evidence recorded in the run summary.'

      - name: Release generated Android space
        if: always()
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:NEURA_ANDROID_SOURCE_ROOT)) {
            $gradle = Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'android\gradlew.bat'
            if (Test-Path -LiteralPath $gradle -PathType Leaf) { & $gradle --stop | Out-Null }
            $buildLink = Join-Path $env:NEURA_ANDROID_SOURCE_ROOT 'build'
            if (Test-Path -LiteralPath $buildLink) {
              & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$buildLink"
            }
          }
          foreach ($cacheLinkPath in @(
            $env:NEURA_ANDROID_GRADLE_WRAPPER_LINK
          )) {
            if ([string]::IsNullOrWhiteSpace($cacheLinkPath)) { continue }
            $cacheLink = Get-Item -LiteralPath $cacheLinkPath -Force -ErrorAction SilentlyContinue
            if ($cacheLink -and
                ($cacheLink.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
              & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$cacheLinkPath"
            }
          }
          foreach ($path in @($env:NEURA_ANDROID_BUILD_ROOT, $env:NEURA_ANDROID_TOOL_ROOT)) {
            if (-not [string]::IsNullOrWhiteSpace($path) -and (Test-Path -LiteralPath $path)) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          # Release this run's checkout as well. Every run gets its own
          # neura-ci/<run-id>-<attempt>/workspace target; leaving it behind
          # accumulates full source trees on the bounded build volume.
          if (-not [string]::IsNullOrWhiteSpace($env:NEURA_ANDROID_SOURCE_ROOT) -and
              -not [string]::IsNullOrWhiteSpace($env:NEURA_ANDROID_BUILD_VOLUME) -and
              -not [string]::IsNullOrWhiteSpace($env:NEURA_ANDROID_RUN_KEY)) {
            $runRoot = Join-Path $env:NEURA_ANDROID_BUILD_VOLUME "neura-ci\$env:NEURA_ANDROID_RUN_KEY"
            $workspaceTarget = Join-Path $runRoot 'workspace'
            $cleanupTemp = $env:RUNNER_TEMP
            if ([string]::IsNullOrWhiteSpace($cleanupTemp) -or
                -not (Test-Path -LiteralPath $cleanupTemp)) {
              $cleanupTemp = [System.IO.Path]::GetTempPath().TrimEnd('\')
            }
            Set-Location -LiteralPath $cleanupTemp
            $sourceLink = Get-Item -LiteralPath $env:NEURA_ANDROID_SOURCE_ROOT -Force -ErrorAction SilentlyContinue
            if ($sourceLink -and
                ($sourceLink.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
              & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$($sourceLink.FullName)"
            }
            if (Test-Path -LiteralPath $workspaceTarget -PathType Container) {
              Remove-Item -LiteralPath $workspaceTarget -Recurse -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path -LiteralPath $runRoot -PathType Container) {
              Remove-Item -LiteralPath $runRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
          }


      - name: Remove temporary public client settings
        if: always()
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:NEURA_DART_DEFINE_FILE)) {
            Remove-Item -LiteralPath $env:NEURA_DART_DEFINE_FILE -Force -ErrorAction SilentlyContinue
          }

