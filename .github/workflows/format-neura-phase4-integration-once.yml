name: Format clean Neura Phase 4 integration once

on:
  push:
    branches:
      - agent/neura-adaptive-intent-phase4-integration

permissions:
  contents: write

concurrency:
  group: format-neura-phase4-integration-once
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  WORK_BRANCH: agent/neura-adaptive-intent-phase4-integration

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out clean integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore package language settings
        run: flutter pub get

      - name: Apply exact package-mode formatting
        run: |
          dart format \
            test/adaptive_intent/neura_adaptive_intent_preferences_test.dart

      - name: Commit formatted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Neura Companion"
          git config user.email \
            "156997939+Vantiger1@users.noreply.github.com"
          git add \
            test/adaptive_intent/neura_adaptive_intent_preferences_test.dart
          if git diff --cached --quiet; then
            echo "The integration test is already canonically formatted."
            exit 0
          fi
          git commit -m \
            "style(adaptive-intent): format wipe-race regression"
          git push origin HEAD:${WORK_BRANCH}
