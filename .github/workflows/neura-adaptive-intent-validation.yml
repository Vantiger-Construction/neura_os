name: Neura Adaptive Intent 1.4 Validation

on:
  pull_request:
    branches:
      - agent/neura-intelligence-fabric-v1.3
    paths:
      - "lib/adaptive_intent/**"
      - "lib/cognitive/**"
      - "lib/constitution/**"
      - "lib/intent_compiler/**"
      - "lib/dashboard/widgets/proactive_banner_card.dart"
      - "lib/modules/navigation/enhanced_navigation.dart"
      - "lib/src/core/data_wipe_service.dart"
      - "test/adaptive_intent/**"
      - "test/cognitive/**"
      - "test/constitution/**"
      - "test/intent_compiler/**"
      - "NEURA_ADAPTIVE_INTENT_OS_V1_4.md"
      - "ADAPTIVE_INTENT_PHASE4_VALIDATION.md"
      - "pubspec.yaml"
      - ".github/workflows/neura-adaptive-intent-validation.yml"
  push:
    branches:
      - agent/neura-adaptive-intent-os-v1.4
      - agent/neura-adaptive-intent-phase4-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neura-adaptive-intent-v1.4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  INTEGRATION_BRANCH: agent/neura-adaptive-intent-phase4-integration

jobs:
  format-clean-integration:
    name: Format clean integration once
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/neura-adaptive-intent-phase4-integration' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATION_BRANCH }}
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore package language settings
        run: flutter pub get

      - name: Apply exact package-mode formatting
        run: |
          dart format \
            test/adaptive_intent/neura_adaptive_intent_preferences_test.dart

      - name: Commit formatted test source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Neura Companion"
          git config user.email \
            "156997939+Vantiger1@users.noreply.github.com"
          git add \
            test/adaptive_intent/neura_adaptive_intent_preferences_test.dart
          if git diff --cached --quiet; then
            echo "The wipe-race regression is already canonically formatted."
            exit 0
          fi
          git commit -m \
            "style(adaptive-intent): format wipe-race regression"
          git push origin HEAD:${INTEGRATION_BRANCH}

  validate:
    name: Analyze and test Adaptive Intent
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Require canonical formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/adaptive_intent \
            lib/cognitive \
            lib/constitution \
            lib/intent_compiler \
            lib/dashboard/widgets/proactive_banner_card.dart \
            lib/modules/navigation/enhanced_navigation.dart \
            lib/src/core/data_wipe_service.dart \
            test/adaptive_intent \
            test/cognitive \
            test/constitution \
            test/intent_compiler

      - name: Require zero analyzer findings
        run: flutter analyze --fatal-infos

      - name: Run focused Adaptive Intent tests
        run: |
          flutter test --no-pub --reporter expanded --timeout 60s \
            test/cognitive \
            test/constitution \
            test/intent_compiler \
            test/adaptive_intent

      - name: Run complete Flutter suite
        run: flutter test --no-pub --concurrency 4 --timeout 2m
