name: Neura approved artifact cleanup once
on:
  push:
    branches: ['ops/approved-artifact-cleanup-20260920']
    paths: ['.github/workflows/neura-approved-artifact-cleanup-once.yml']
permissions: {}
concurrency:
  group: neura-approved-artifact-cleanup-20260920-cloud
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'Vantiger-Construction/neura_os'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete only the nineteen explicitly approved old package artifacts
        shell: 'pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        env:
          NEURA_CLEANUP_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'Vantiger-Construction/neura_os') {
            throw 'Unexpected repository; refusing cleanup.'
          }
          $headers = @{
            Authorization = "Bearer $env:NEURA_CLEANUP_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $apiRoot = 'https://api.github.com/repos/Vantiger-Construction/neura_os/actions/artifacts'
          $approved = '[{"id":9506871981,"name":"NeuraCompanion-Android-APK","run":32688884626,"sha":"4bb7d6c0910823661a4716d72edbe04b7f3e9c27","bytes":155631757},{"id":9506912900,"name":"NeuraCompanion-Windows-x64","run":32688884626,"sha":"4bb7d6c0910823661a4716d72edbe04b7f3e9c27","bytes":80987553},{"id":9533181390,"name":"NeuraCompanion-Windows-x64","run":32688884626,"sha":"4bb7d6c0910823661a4716d72edbe04b7f3e9c27","bytes":80987288},{"id":9552595777,"name":"NeuraCompanion-Android-APK","run":32817548127,"sha":"02c3b24a8df57889cacb861121c3626cf4d3a42f","bytes":155631931},{"id":9552644808,"name":"NeuraCompanion-Windows-x64","run":32817548127,"sha":"02c3b24a8df57889cacb861121c3626cf4d3a42f","bytes":80987485},{"id":9552278623,"name":"NeuraCompanion-Android-APK","run":32817552344,"sha":"02c3b24a8df57889cacb861121c3626cf4d3a42f","bytes":155631928},{"id":9552324030,"name":"NeuraCompanion-Windows-x64","run":32817552344,"sha":"02c3b24a8df57889cacb861121c3626cf4d3a42f","bytes":80987657},{"id":9555770117,"name":"NeuraCompanion-Android-APK","run":32827066908,"sha":"4de9a0c5e14df756b914800d7673aa0670cae731","bytes":155631990},{"id":9555807806,"name":"NeuraCompanion-Windows-x64","run":32827066908,"sha":"4de9a0c5e14df756b914800d7673aa0670cae731","bytes":80987714},{"id":9559419329,"name":"NeuraCompanion-Android-APK","run":32836863509,"sha":"74c95bd2b80043717ae04e8bc2039be553432a47","bytes":155656053},{"id":9559488434,"name":"NeuraCompanion-Windows-x64","run":32836863509,"sha":"74c95bd2b80043717ae04e8bc2039be553432a47","bytes":80997198},{"id":9565938829,"name":"NeuraCompanion-Android-APK","run":32853665161,"sha":"5a9376c499c83d168ecc1e9027422307e74a2675","bytes":155656054},{"id":9565959431,"name":"NeuraCompanion-Windows-x64","run":32853665161,"sha":"5a9376c499c83d168ecc1e9027422307e74a2675","bytes":80997219},{"id":9565920143,"name":"NeuraCompanion-Android-APK","run":32853823804,"sha":"e43d34a0d49fbe6d5453461889f9288c3f334d48","bytes":155656066},{"id":9566168000,"name":"NeuraCompanion-Windows-x64","run":32853823804,"sha":"e43d34a0d49fbe6d5453461889f9288c3f334d48","bytes":80996856},{"id":9566603955,"name":"NeuraCompanion-Android-APK","run":32854210902,"sha":"4e2648b1f95a4ac5e6d8f483664e37c8b24842a8","bytes":155656461},{"id":9566645263,"name":"NeuraCompanion-Windows-x64","run":32854210902,"sha":"4e2648b1f95a4ac5e6d8f483664e37c8b24842a8","bytes":80997444},{"id":9566781454,"name":"NeuraCompanion-Android-APK","run":32854216850,"sha":"4e2648b1f95a4ac5e6d8f483664e37c8b24842a8","bytes":155656450},{"id":9567004330,"name":"NeuraCompanion-Windows-x64","run":32854216850,"sha":"4e2648b1f95a4ac5e6d8f483664e37c8b24842a8","bytes":80997619}]' | ConvertFrom-Json
          function Get-ArtifactOrNull([long]$ArtifactId) {
            try {
              return Invoke-RestMethod -Uri "$apiRoot/$ArtifactId" -Headers $headers -Method Get -TimeoutSec 60
            } catch {
              if ($null -ne $_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404) { return $null }
              throw
            }
          }
          # Validate the entire fixed allowlist before the first deletion.
          $pending = @()
          foreach ($item in $approved) {
            $artifact = Get-ArtifactOrNull $item.id
            if ($null -eq $artifact) {
              Write-Host "Already absent: $($item.id)"
              continue
            }
            if ($artifact.id -ne $item.id -or $artifact.name -cne $item.name -or
                $artifact.workflow_run.id -ne $item.run -or
                $artifact.workflow_run.head_sha -cne $item.sha -or
                $artifact.size_in_bytes -ne $item.bytes -or
                [DateTimeOffset]::Parse($artifact.created_at) -ge [DateTimeOffset]::Parse('2026-08-26T00:00:00Z')) {
              throw "Artifact $($item.id) does not match the user-approved cleanup manifest."
            }
            $pending += $item
          }
          [long]$deletedBytes = 0
          foreach ($item in $pending) {
            $response = Invoke-WebRequest -UseBasicParsing -Uri "$apiRoot/$($item.id)" -Headers $headers -Method Delete -TimeoutSec 60
            if ([int]$response.StatusCode -ne 204) { throw "Deletion did not return HTTP 204 for $($item.id)." }
            if ($null -ne (Get-ArtifactOrNull $item.id)) { throw "Artifact $($item.id) still exists after deletion." }
            $deletedBytes += $item.bytes
            $message = "Deleted $($item.id): $($item.name), run $($item.run), $($item.bytes) bytes"
            Write-Host $message
            $message | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          "Confirmed deleted bytes: $deletedBytes. GitHub storage accounting may update later." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "Cleanup complete. Confirmed deleted bytes: $deletedBytes"
          
