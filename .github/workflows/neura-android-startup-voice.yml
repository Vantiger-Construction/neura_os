name: Android startup voice safety

on:
  pull_request:
    # Stacked reviews of Android Dependabot PRs run without release delivery.
    branches: ['codex/pr221-isolated-kotlin-2-4-21']
    paths:
      - 'android/**'
      - 'lib/services/neura*speech*'
      - 'lib/services/neura*voice*'
      - 'lib/services/neura_tts_service.dart'
      - 'lib/modules/chat/**'
      - 'lib/modules/navigation/**'
      - 'lib/screens/neura_voice_settings_screen.dart'
      - 'lib/startup/**'
      - 'lib/src/core/data_wipe_service.dart'
      - 'test/startup/neura_startup_voice_test.dart'
      - 'test/services/neura_local_speech_input_test.dart'
      - 'test/services/neura_startup_voice_prefs_test.dart'
      - 'test/screens/neura_startup_voice_settings_test.dart'
      - 'test/startup/native_speech_safe_mode_test.dart'
      - 'test/startup/startup_platform_policy_test.dart'
      - 'test/services/local_journal_store_test.dart'
      - 'test/encrypted_memory/**'
      - 'test/data_wipe_memory_contracts_test.dart'
      - 'test/data_wipe_microphone_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tools/android_validation/**'
      - 'tools/release/check_android_update.py'
      - '.github/workflows/neura-android-startup-voice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neura-android-startup-voice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android startup voice tests and APK
    # Build PR code without secrets on an ephemeral runner. The separate
    # Windows package lane retains its existing disk and delivery safeguards.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record exact Android source
        run: |
          {
            printf 'Commit: %s\nTree: %s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
            printf 'Debug-signed test APK. Physical speech, microphone shutdown and installation acceptance remain required.\n'
          } | tee android-startup-voice-source.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: false
      - name: Apply the candidate patch to the disposable Flutter SDK
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          git -C "$FLUTTER_ROOT" apply --check "$GITHUB_WORKSPACE/tools/android_validation/flutter-3.47.9-kotlin-2.4.21.patch"
          git -C "$FLUTTER_ROOT" apply "$GITHUB_WORKSPACE/tools/android_validation/flutter-3.47.9-kotlin-2.4.21.patch"
          git -C "$FLUTTER_ROOT" diff -- packages/flutter_tools/gradle/build.gradle.kts >> android-startup-voice-source.txt
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Synthetic startup, permissions, cancellation and private-storage tests
        run: >-
          flutter test --no-pub --concurrency 2 --timeout 2m
          test/startup/neura_startup_voice_test.dart
          test/services/neura_local_speech_input_test.dart
          test/services/neura_startup_voice_prefs_test.dart
          test/screens/neura_startup_voice_settings_test.dart
          test/startup/native_speech_safe_mode_test.dart
          test/startup/startup_platform_policy_test.dart
          test/services/local_journal_store_test.dart
          test/encrypted_memory/encrypted_memory_release_contracts_test.dart
          test/encrypted_memory/encrypted_memory_durable_scoped_adapter_test.dart
          test/data_wipe_memory_contracts_test.dart
          test/data_wipe_microphone_test.dart
      - name: Install the existing Android build baseline
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          'platforms;android-36' 'platforms;android-37.0'
          'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Compile the real Android application and local recognizer
        run: |
          set -o pipefail
          flutter build apk --debug --no-pub 2>&1 | tee android-startup-voice-build.log
      - name: Verify the APK and record its checksum
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$apk" | grep -Fx 'android.permission.RECORD_AUDIO'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" \
            | tee android-startup-voice-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > android-startup-voice-badging.txt
          (cd android && ./gradlew --version) > android-startup-voice-toolchain.txt
          python3 tools/android_validation/check_apk.py --output android-startup-voice-identity.json \
            inspect --build-tools "$ANDROID_HOME/build-tools/36.0.0" --source "$GITHUB_WORKSPACE" "$apk"
          sha256sum "$apk" > android-startup-voice-sha256.txt
          git diff --exit-code -- lib test android pubspec.lock rust/Cargo.lock
      - name: Preserve Android build evidence and test APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: startup-voice-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android-startup-voice-*.log
            android-startup-voice-*.txt
            android-startup-voice-*.json
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
