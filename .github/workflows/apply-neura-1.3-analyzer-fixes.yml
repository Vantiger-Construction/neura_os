name: Apply Neura 1.3 analyzer fixes

on:
  push:
    branches:
      - ci/apply-neura-1.3-analyzer-fixes

permissions:
  contents: write

concurrency:
  group: apply-neura-1.3-analyzer-fixes
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.7"
  WORK_BRANCH: ci/apply-neura-1.3-analyzer-fixes

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out lint-fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Preview Dart analyzer fixes
        run: dart fix --dry-run

      - name: Apply analyzer quick-fixes
        run: dart fix --apply

      - name: Format touched Dart files
        run: |
          dart format \
            lib/avatar/renderers/lottie_avatar_view.dart \
            lib/avatar/viseme/neura_viseme_engine.dart \
            lib/modules/coach/coach_engine.dart \
            lib/modules/memory/memory_screen.dart \
            lib/modules/navigation/enhanced_navigation.dart \
            lib/modules/quests/quest_mode_screen.dart \
            lib/neura_link/conversation_controller.dart \
            lib/screens/dream_journal_calendar_screen.dart \
            lib/screens/dream_visualizer_screen.dart

      - name: Require exact style-only scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              'lib/avatar/renderers/lottie_avatar_view.dart',
              'lib/avatar/viseme/neura_viseme_engine.dart',
              'lib/modules/coach/coach_engine.dart',
              'lib/modules/memory/memory_screen.dart',
              'lib/modules/navigation/enhanced_navigation.dart',
              'lib/modules/quests/quest_mode_screen.dart',
              'lib/neura_link/conversation_controller.dart',
              'lib/screens/dream_journal_calendar_screen.dart',
              'lib/screens/dream_visualizer_screen.dart',
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines()
              if line.strip()
          }
          if changed != expected:
              raise SystemExit(
                  'Unexpected dart-fix scope. '
                  f'Missing={sorted(expected - changed)}; '
                  f'Unexpected={sorted(changed - expected)}'
              )
          print('Verified style-only scope:')
          for path in sorted(changed):
              print(f'  {path}')
          PY

      - name: Require analyzer with zero infos, warnings, or errors
        run: flutter analyze --fatal-infos

      - name: Commit verified style fixes to work branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-neura-1.3-analyzer-fixes.yml
          git config user.name "Neura Companion"
          git config user.email "156997939+Vantiger1@users.noreply.github.com"
          git add -A
          git commit -m "style: resolve analyzer flow-control lints"
          git push origin HEAD:${WORK_BRANCH}
