name: Neura agent environment

on:
  workflow_dispatch:
  push:
    branches: [Neura]
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
      - '.github/workflows/neura-coverage.yml'

permissions:
  contents: read

jobs:
  # GitHub requires this exact job ID for agent setup.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the task source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Read the branch's existing CI toolchain pins
        id: toolchain
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          source = Path('.github/workflows/neura-coverage.yml').read_text()
          # Accept only one exact stable version per key. Never evaluate YAML
          # expressions or shell text from a repository file.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('FLUTTER_VERSION', 'RUST_VERSION'):
                  values = re.findall(
                      rf'^  {key}: [\'\"]([0-9]+\.[0-9]+\.[0-9]+)[\'\"]\s*$',
                      source, re.MULTILINE,
                  )
                  if len(values) != 1:
                      raise SystemExit(f'Expected one exact {key} in coverage CI')
                  print(f'{key.lower()}={values[0]}', file=output)
          PY
      - name: Install the matching Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.toolchain.outputs.flutter_version }}
          channel: stable
          cache: true
      - name: Install the matching Rust toolchain
        shell: bash
        env:
          NEURA_RUST_VERSION: ${{ steps.toolchain.outputs.rust_version }}
        run: |
          rustup toolchain install "$NEURA_RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$NEURA_RUST_VERSION"
      - name: Restore locked development dependencies
        shell: bash
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          cargo fetch --manifest-path rust/Cargo.toml --locked
          git diff --exit-code -- pubspec.lock rust/Cargo.lock
      - name: Record prepared tools and source
        shell: bash
        run: |
          {
            echo '### Neura agent environment'
            echo "Source: $(git rev-parse HEAD)"
            flutter --version
            rustc --version
            cargo --version
            echo 'Development dependencies restored; application tests have not run.'
            echo 'Windows/Android native builds and physical acceptance use their separate validation lanes.'
          } >> "$GITHUB_STEP_SUMMARY"
