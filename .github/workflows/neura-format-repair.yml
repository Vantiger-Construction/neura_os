name: Temporary focused PR repair verification

on:
  pull_request:
    branches: [Neura]
    paths: ['.github/workflows/neura-format-repair.yml']

permissions:
  contents: read

jobs:
  focused:
    if: github.event.pull_request.number == 97
    name: Focused PR ${{ matrix.pr }} repair tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pr: [96, 97]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ matrix.pr == 97 && github.event.pull_request.head.sha || '12085ce9d0f1ba51e480cfe395bb617240606cd7' }}
      - name: Install pinned Flutter 3.44.7
        shell: bash
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/neura-flutter"
          mkdir -p "$sdk_dir"
          curl --fail --location --retry 2 --max-time 60 \
            https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
            --output "$sdk_dir/releases.json"
          python3 - "$sdk_dir/releases.json" "$sdk_dir" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          release = next(item for item in data["releases"]
                         if item["version"] == "3.44.7" and item["channel"] == "stable"
                         and item.get("dart_sdk_arch", "x64") == "x64")
          root = pathlib.Path(sys.argv[2])
          (root / "archive-url").write_text(data["base_url"] + "/" + release["archive"])
          (root / "archive.sha256").write_text(release["sha256"])
          PY
          archive="$sdk_dir/flutter.tar.xz"
          curl --fail --location --retry 2 --max-time 300 \
            "$(cat "$sdk_dir/archive-url")" --output "$archive"
          printf '%s  %s\n' "$(cat "$sdk_dir/archive.sha256")" "$archive" | sha256sum --check -
          tar -xf "$archive" -C "$sdk_dir"
          "$sdk_dir/flutter/bin/flutter" config --no-analytics
          "$sdk_dir/flutter/bin/flutter" --version
          printf '%s\n' "$sdk_dir/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore dependencies and verify formatting
        shell: bash
        run: |
          set -euo pipefail
          git log -1 --format=%H
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test tools/local_api_client/dart
      - name: Analyze and run focused regression tests
        shell: bash
        env:
          TARGET_PR: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-warnings --no-fatal-infos
          if [[ "$TARGET_PR" == "96" ]]; then
            flutter test --reporter expanded \
              test/guardrails/crisis_surfacing_test.dart \
              test/persona/neura_character_charter_test.dart \
              test/persona/neura_prompt_builder_test.dart \
              test/services/neura_chat_policy_test.dart \
              test/startup/native_speech_safe_mode_test.dart
          else
            flutter test --reporter expanded \
              test/services/neura_local_api_test.dart \
              test/services/neura_model_router_test.dart \
              test/services/neura_model_stream_test.dart \
              test/services/neura_llm_diagnostics_test.dart \
              test/services/neura_generation_cancel_test.dart \
              test/services/neura_chat_policy_test.dart \
              test/startup/native_speech_safe_mode_test.dart
          fi
