name: Neura Local Runner Check

on:
  pull_request:
    branches: [Neura]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'tools/Neura-FastCheck.ps1'
      - 'tools/Neura-ReclaimCiDisk.ps1'
      - '.github/workflows/neura-fast-check.yml'
  workflow_dispatch:

concurrency:
  group: neura-local-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reclaim-runner-space:
    name: Reclaim self-hosted runner disk
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 10

    steps:
      # This job intentionally uses no marketplace actions or repository
      # checkout. It must be able to recover a runner whose action cache
      # cannot grow because an earlier native build exhausted the disk.
      - name: Remove generated runner data
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Remove-GeneratedPath {
            param([Parameter(Mandatory)][string]$Path)
            if (-not (Test-Path -LiteralPath $Path)) {
              return
            }
            Write-Host "Removing generated runner data: $Path"
            try {
              Remove-Item -LiteralPath $Path -Recurse -Force -ErrorAction Stop
            } catch {
              Write-Warning "Could not completely remove ${Path}: $($_.Exception.Message)"
            }
          }

          function Remove-StaleChildren {
            param(
              [Parameter(Mandatory)][string]$Path,
              [Parameter(Mandatory)][datetime]$Cutoff
            )
            if (-not (Test-Path -LiteralPath $Path -PathType Container)) {
              return
            }
            Get-ChildItem -LiteralPath $Path -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTime -lt $Cutoff } |
              ForEach-Object {
                Remove-GeneratedPath -Path $_.FullName
              }
          }

          $runnerWork = Split-Path -Parent $env:RUNNER_TEMP
          $driveRoot = [System.IO.Path]::GetPathRoot($runnerWork)
          $driveName = $driveRoot.TrimEnd('\').TrimEnd(':')
          $before = (Get-PSDrive -Name $driveName -ErrorAction Stop).Free

          foreach ($repository in Get-ChildItem -LiteralPath $runnerWork -Directory -ErrorAction SilentlyContinue) {
            if ($repository.Name.StartsWith('_')) {
              continue
            }
            $checkout = Join-Path $repository.FullName $repository.Name
            Remove-GeneratedPath -Path (Join-Path $checkout 'build')
            Remove-GeneratedPath -Path (Join-Path $checkout 'rust\target')
          }

          foreach ($path in @(
            (Join-Path $env:USERPROFILE '.gradle\caches'),
            (Join-Path $env:USERPROFILE '.gradle\daemon'),
            (Join-Path $env:USERPROFILE '.gradle\native'),
            (Join-Path $env:USERPROFILE '.gradle\notifications')
          )) {
            Remove-GeneratedPath -Path $path
          }

          Remove-StaleChildren -Path $env:RUNNER_TEMP -Cutoff (Get-Date).AddMinutes(-15)

          $afterBasic = (Get-PSDrive -Name $driveName -ErrorAction Stop).Free
          if ($afterBasic -lt 8GB) {
            Write-Host 'Free space is still low; pruning reproducible caches.'

            # Marketplace actions are a cache. This recovery job uses none,
            # and the validation job will download only what it needs.
            Remove-GeneratedPath -Path (Join-Path $runnerWork '_actions')

            # Keep the pinned Flutter 3.44.7 toolchain and remove older cached
            # Flutter versions only.
            $flutterTools = Join-Path $env:RUNNER_TOOL_CACHE 'flutter'
            if (Test-Path -LiteralPath $flutterTools -PathType Container) {
              Get-ChildItem -LiteralPath $flutterTools -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notlike '*3.44.7*' } |
                ForEach-Object {
                  Remove-GeneratedPath -Path $_.FullName
                }
            }

            # Cargo registries and Git sources are reproducible caches. The
            # active Rust toolchain and cargo/rustc binaries are retained.
            Remove-GeneratedPath -Path (Join-Path $env:USERPROFILE '.cargo\registry')
            Remove-GeneratedPath -Path (Join-Path $env:USERPROFILE '.cargo\git')
            Remove-GeneratedPath -Path (Join-Path $env:USERPROFILE '.rustup\downloads')
            Remove-GeneratedPath -Path (Join-Path $env:USERPROFILE '.rustup\tmp')

            $rustupExe = Join-Path $env:USERPROFILE '.cargo\bin\rustup.exe'
            if (Test-Path -LiteralPath $rustupExe -PathType Leaf) {
              $toolchains = & $rustupExe toolchain list
              foreach ($line in $toolchains) {
                $toolchain = ($line -split '\s+')[0]
                if ($toolchain -and
                    $toolchain -notlike 'stable-*' -and
                    $toolchain -ne 'stable') {
                  Write-Host "Removing inactive Rust toolchain: $toolchain"
                  & $rustupExe toolchain uninstall $toolchain
                }
              }
            }

            # Dart/Flutter and NuGet caches are recreated by dependency
            # restore. No source or credential storage is touched.
            if (-not [string]::IsNullOrWhiteSpace($env:LOCALAPPDATA)) {
              Remove-GeneratedPath -Path (Join-Path $env:LOCALAPPDATA 'Pub\Cache\hosted')
              Remove-GeneratedPath -Path (Join-Path $env:LOCALAPPDATA 'Pub\Cache\git')
              Remove-GeneratedPath -Path (Join-Path $env:LOCALAPPDATA 'Pub\Cache\_temp')
              Remove-GeneratedPath -Path (Join-Path $env:LOCALAPPDATA 'NuGet\v3-cache')
              Remove-GeneratedPath -Path (Join-Path $env:LOCALAPPDATA 'NuGet\plugins-cache')
              Remove-GeneratedPath -Path (Join-Path $env:LOCALAPPDATA 'NuGet\scratch')
            }
            Remove-GeneratedPath -Path (Join-Path $env:USERPROFILE '.nuget\packages')

            if (-not [string]::IsNullOrWhiteSpace($env:TEMP)) {
              Remove-StaleChildren -Path $env:TEMP -Cutoff (Get-Date).AddHours(-1)
            }

            $runnerRoot = Split-Path -Parent $runnerWork
            Remove-StaleChildren `
              -Path (Join-Path $runnerRoot '_diag') `
              -Cutoff (Get-Date).AddDays(-1)
          }

          [GC]::Collect()
          [GC]::WaitForPendingFinalizers()

          $after = (Get-PSDrive -Name $driveName -ErrorAction Stop).Free
          Write-Host (
            "Emergency cleanup free space: {0:N2} GB (reclaimed {1:N2} GB)" -f
            ($after / 1GB),
            ([Math]::Max(0, $after - $before) / 1GB)
          )

          if ($after -lt 8GB) {
            $message = (
              "The runner still has only {0:N2} GB free after pruning " +
              "generated outputs and reproducible caches; 8 GB is required."
            ) -f ($after / 1GB)
            throw $message
          }

  validate:
    name: validate
    needs: reclaim-runner-space
    # Uses the owner's Windows computer instead of paid GitHub-hosted minutes.
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 55

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reclaim stale CI build space
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: ./tools/Neura-ReclaimCiDisk.ps1 -MinimumFreeGb 8

      - name: Install Flutter
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $flutterVersion = '3.44.7'
          $flutterRoot = Join-Path $env:RUNNER_TOOL_CACHE "flutter\$flutterVersion\x64"
          $flutterExe = Join-Path $flutterRoot 'bin\flutter.bat'

          if (-not (Test-Path -LiteralPath $flutterExe -PathType Leaf)) {
            $stagingRoot = Join-Path $env:RUNNER_TEMP "flutter-$flutterVersion-$env:GITHUB_RUN_ID"
            if (Test-Path -LiteralPath $stagingRoot) {
              Remove-Item -LiteralPath $stagingRoot -Recurse -Force
            }

            git clone --depth 1 --branch $flutterVersion https://github.com/flutter/flutter.git $stagingRoot
            if ($LASTEXITCODE -ne 0) {
              throw "Flutter $flutterVersion clone failed with exit code $LASTEXITCODE."
            }

            New-Item -ItemType Directory -Path (Split-Path -Parent $flutterRoot) -Force | Out-Null
            Move-Item -LiteralPath $stagingRoot -Destination $flutterRoot
          }

          $flutterBin = Join-Path $flutterRoot 'bin'
          $flutterBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $flutterExe config --no-analytics
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter configuration failed with exit code $LASTEXITCODE."
          }
          & $flutterExe --version
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter verification failed with exit code $LASTEXITCODE."
          }

      - name: Install Rust
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          $cargoExe = Join-Path $cargoBin 'cargo.exe'

          if (-not (Test-Path -LiteralPath $cargoExe -PathType Leaf)) {
            $rustupUrl = 'https://win.rustup.rs/x86_64'
            $rustupPath = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Write-Host "Downloading Rust installer from $rustupUrl"
            Invoke-WebRequest -Uri $rustupUrl -OutFile $rustupPath
            & $rustupPath -y --profile minimal
            if ($LASTEXITCODE -ne 0) {
              throw "Rust installation failed with exit code $LASTEXITCODE."
            }
          }

          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$cargoBin;$env:PATH"

          cargo --version
          if ($LASTEXITCODE -ne 0) {
            throw "cargo verification failed with exit code $LASTEXITCODE."
          }
          rustc --version
          if ($LASTEXITCODE -ne 0) {
            throw "rustc verification failed with exit code $LASTEXITCODE."
          }

      - name: Locate or install NuGet
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $nugetExe = Get-ChildItem -LiteralPath $env:RUNNER_TOOL_CACHE `
              -Filter 'nuget.exe' -File -Recurse -ErrorAction SilentlyContinue |
            Sort-Object -Property FullName -Descending |
            Select-Object -First 1

          if (-not $nugetExe) {
            $nugetRoot = Join-Path $env:RUNNER_TOOL_CACHE 'nuget\7.9.0\x64'
            New-Item -ItemType Directory -Path $nugetRoot -Force | Out-Null
            $nugetPath = Join-Path $nugetRoot 'nuget.exe'
            Invoke-WebRequest `
              -Uri 'https://dist.nuget.org/win-x86-commandline/v7.9.0/nuget.exe' `
              -OutFile $nugetPath
            $nugetExe = Get-Item -LiteralPath $nugetPath
          }

          $nugetExe.Directory.FullName |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$($nugetExe.Directory.FullName);$env:PATH"
          & $nugetExe.FullName help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet verification failed with exit code $LASTEXITCODE."
          }

      - name: Verify local tools
        # GitHub writes each run block to an unsigned temporary .ps1 file.
        # Bypass applies only to this CI process and does not change machine
        # or user execution-policy settings on the self-hosted runner.
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          flutter --version
          dart --version
          git --version
          cargo --version
          $nugetOutput = & nuget help 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "nuget help failed with exit code $LASTEXITCODE."
          }
          Write-Host ($nugetOutput | Select-Object -First 1)

      - name: Run optimized validation
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: ./tools/Neura-FastCheck.ps1 -Root . -BuildWindows

      - name: Release generated build space
        if: always()
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          foreach ($path in @(
            (Join-Path $env:GITHUB_WORKSPACE 'build'),
            (Join-Path $env:GITHUB_WORKSPACE 'rust\target')
          )) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
