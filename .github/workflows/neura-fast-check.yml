name: Neura Fast Check

on:
  pull_request:
    branches: [Neura]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'tools/Neura-FastCheck.ps1'
      - '.github/workflows/neura-fast-check.yml'
  workflow_dispatch:

concurrency:
  group: neura-fast-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Dart build metadata
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool
            ${{ env.LOCALAPPDATA }}\Pub\Cache
          key: neura-${{ runner.os }}-dart-${{ hashFiles('pubspec.lock', 'pubspec.yaml') }}
          restore-keys: |
            neura-${{ runner.os }}-dart-

      - name: Run optimized validation
        shell: pwsh
        run: ./tools/Neura-FastCheck.ps1 -Root .
