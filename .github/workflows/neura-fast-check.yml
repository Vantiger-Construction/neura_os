name: Neura Local Runner Check

on:
  pull_request:
    branches: [Neura]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'tools/Neura-FastCheck.ps1'
      - '.github/workflows/neura-fast-check.yml'
  workflow_dispatch:

concurrency:
  group: neura-local-runner-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.7'
  JQ_VERSION: '1.8.2'

jobs:
  validate:
    # Uses the owner's Windows computer instead of paid GitHub-hosted minutes.
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Expose Git Bash to actions
        # Git is already installed on the machine, but a Windows service may
        # inherit only Git's cmd directory. Composite setup actions call bash.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $gitExe = (Get-Command git -ErrorAction Stop).Source
          $gitRoot = Split-Path -Parent (Split-Path -Parent $gitExe)
          $bashDir = Join-Path $gitRoot 'bin'
          $bashExe = Join-Path $bashDir 'bash.exe'
          if (-not (Test-Path -LiteralPath $bashExe -PathType Leaf)) {
            throw "Git Bash was not found at $bashExe"
          }
          $bashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Added Git Bash to subsequent-step PATH: $bashDir"

      - name: Install jq
        # subosito/flutter-action uses jq during version resolution. Keep the
        # self-hosted runner reproducible and verify the official release hash.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $toolDir = Join-Path $env:RUNNER_TOOL_CACHE "jq\$env:JQ_VERSION\x64"
          $jqPath = Join-Path $toolDir 'jq.exe'
          $checksumPath = Join-Path $env:RUNNER_TEMP 'jq-sha256sum.txt'
          $releaseBase = "https://github.com/jqlang/jq/releases/download/jq-$env:JQ_VERSION"

          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null
          Invoke-WebRequest -Uri "$releaseBase/jq-windows-amd64.exe" -OutFile $jqPath -UseBasicParsing
          Invoke-WebRequest -Uri "$releaseBase/sha256sum.txt" -OutFile $checksumPath -UseBasicParsing

          $checksumLine = Get-Content -LiteralPath $checksumPath |
            Where-Object { $_ -match '\s+jq-windows-amd64\.exe$' } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($checksumLine)) {
            throw 'jq release checksum entry was not found.'
          }

          $expected = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $jqPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "jq checksum mismatch: expected $expected, got $actual"
          }

          $toolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $jqPath --version

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Verify local tools
        # The self-hosted machine enforces signed PowerShell scripts. GitHub
        # Actions writes each `run` block to an unsigned temporary .ps1 file,
        # so use a process-scoped bypass without changing machine policy.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          flutter --version
          dart --version
          git --version
          cargo --version
          jq --version
          nuget help | Select-Object -First 1

      - name: Run optimized validation
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: ./tools/Neura-FastCheck.ps1 -Root . -BuildWindows
