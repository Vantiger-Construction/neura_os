name: Neura Local Runner Check

on:
  pull_request:
    branches: [Neura]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'tools/Neura-FastCheck.ps1'
      - '.github/workflows/neura-fast-check.yml'
  workflow_dispatch:

concurrency:
  group: neura-local-runner-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.7'
  JQ_VERSION: '1.8.2'

jobs:
  validate:
    # Uses the owner's Windows computer instead of paid GitHub-hosted minutes.
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 90

    steps:
      - name: Prepare local runner storage
        id: storage
        # The previous attempt left a truncated Flutter SDK on C:. Remove only
        # that versioned partial install, then use the fixed drive with the
        # most free space for all large, reproducible build/toolchain data.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'

          $partialFlutter = Join-Path $env:RUNNER_TOOL_CACHE "flutter\stable-$env:FLUTTER_VERSION-x64"
          if (Test-Path -LiteralPath $partialFlutter) {
            Write-Host "Removing truncated Flutter SDK: $partialFlutter"
            Remove-Item -LiteralPath $partialFlutter -Recurse -Force
          }

          $drives = Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' |
            Sort-Object -Property FreeSpace -Descending
          $selected = $drives |
            Where-Object { $_.FreeSpace -ge 12GB } |
            Select-Object -First 1
          if (-not $selected) {
            $report = $drives | ForEach-Object {
              '{0} free={1:N2} GB' -f $_.DeviceID, ($_.FreeSpace / 1GB)
            }
            throw "No fixed drive has the required 12 GB free. $($report -join '; ')"
          }

          $root = Join-Path "$($selected.DeviceID)\" 'neura-actions'
          $flutterCache = Join-Path $root "flutter\stable-$env:FLUTTER_VERSION-x64"
          $pubCache = Join-Path $root 'pub-cache'
          $cargoHome = Join-Path $root 'cargo-home'
          $rustupHome = Join-Path $root 'rustup-home'
          $cargoTarget = Join-Path $root 'cargo-target'
          $tempRoot = Join-Path $root 'temp'
          $buildTarget = Join-Path $root "builds\$env:GITHUB_RUN_ID"

          foreach ($path in @(
            $root,
            $pubCache,
            $cargoHome,
            $rustupHome,
            $cargoTarget,
            $tempRoot,
            $buildTarget
          )) {
            New-Item -ItemType Directory -Path $path -Force | Out-Null
          }

          "flutter_cache=$flutterCache" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "pub_cache=$pubCache" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "NEURA_ACTIONS_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PUB_CACHE=$pubCache" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_HOME=$cargoHome" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTUP_HOME=$rustupHome" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$cargoTarget" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tempRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tempRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NEURA_BUILD_TARGET=$buildTarget" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ('Selected {0} with {1:N2} GB free.' -f $selected.DeviceID, ($selected.FreeSpace / 1GB))
          Write-Host "Flutter SDK: $flutterCache"
          Write-Host "Build output: $buildTarget"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Relocate Flutter build output
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $buildLink = Join-Path $env:GITHUB_WORKSPACE 'build'
          if (Test-Path -LiteralPath $buildLink) {
            Remove-Item -LiteralPath $buildLink -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:NEURA_BUILD_TARGET -Force | Out-Null
          New-Item -ItemType Junction -Path $buildLink -Target $env:NEURA_BUILD_TARGET | Out-Null
          Write-Host "Build junction: $buildLink -> $env:NEURA_BUILD_TARGET"

      - name: Expose Git Bash to actions
        # Git is already installed on the machine, but a Windows service may
        # inherit only Git's cmd directory. Composite setup actions call bash.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $gitExe = (Get-Command git -ErrorAction Stop).Source
          $gitRoot = Split-Path -Parent (Split-Path -Parent $gitExe)
          $bashDir = Join-Path $gitRoot 'bin'
          $bashExe = Join-Path $bashDir 'bash.exe'
          if (-not (Test-Path -LiteralPath $bashExe -PathType Leaf)) {
            throw "Git Bash was not found at $bashExe"
          }
          $bashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Added Git Bash to subsequent-step PATH: $bashDir"

      - name: Install jq
        # subosito/flutter-action uses jq during version resolution. Keep the
        # self-hosted runner reproducible and verify the official release hash.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $toolDir = Join-Path $env:NEURA_ACTIONS_ROOT "jq\$env:JQ_VERSION\x64"
          $jqPath = Join-Path $toolDir 'jq.exe'
          $checksumPath = Join-Path $env:TEMP 'jq-sha256sum.txt'
          $releaseBase = "https://github.com/jqlang/jq/releases/download/jq-$env:JQ_VERSION"

          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null
          Invoke-WebRequest -Uri "$releaseBase/jq-windows-amd64.exe" -OutFile $jqPath -UseBasicParsing
          Invoke-WebRequest -Uri "$releaseBase/sha256sum.txt" -OutFile $checksumPath -UseBasicParsing

          $checksumLine = Get-Content -LiteralPath $checksumPath |
            Where-Object { $_ -match '\s+jq-windows-amd64\.exe$' } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($checksumLine)) {
            throw 'jq release checksum entry was not found.'
          }

          $expected = ($checksumLine -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $jqPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "jq checksum mismatch: expected $expected, got $actual"
          }

          $toolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $jqPath --version

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
          cache: false
          cache-path: ${{ steps.storage.outputs.flutter_cache }}
          pub-cache: false
          pub-cache-path: ${{ steps.storage.outputs.pub_cache }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Verify local tools
        # The self-hosted machine enforces signed PowerShell scripts. GitHub
        # Actions writes each `run` block to an unsigned temporary .ps1 file,
        # so use a process-scoped bypass without changing machine policy.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          flutter --version
          dart --version
          git --version
          cargo --version
          jq --version
          nuget help | Select-Object -First 1

      - name: Run optimized validation
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: ./tools/Neura-FastCheck.ps1 -Root . -BuildWindows
