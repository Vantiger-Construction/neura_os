name: Neura Local Runner Check

on:
  pull_request:
    branches: [Neura]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'tools/Neura-FastCheck.ps1'
      - '.github/workflows/neura-fast-check.yml'
  workflow_dispatch:

concurrency:
  group: neura-local-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Uses the owner's Windows computer instead of paid GitHub-hosted minutes.
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify local tools
        shell: pwsh
        run: |
          if (Get-Command flutter -ErrorAction SilentlyContinue) { flutter --version } else { Write-Host "Flutter not found" }
          if (Get-Command dart -ErrorAction SilentlyContinue) { dart --version } else { Write-Host "Dart not found" }
          git --version
          if (Get-Command cargo -ErrorAction SilentlyContinue) { cargo --version } else { Write-Host "Cargo not found" }

      - name: Run optimized validation
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          ./tools/Neura-FastCheck.ps1 -Root . -BuildWindows
