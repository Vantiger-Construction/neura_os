name: Neura Local Runner Check

on:
  pull_request:
    branches: [Neura]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'tools/Neura-FastCheck.ps1'
      - '.github/workflows/neura-fast-check.yml'
  workflow_dispatch:

concurrency:
  group: neura-local-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Uses the owner's Windows computer instead of paid GitHub-hosted minutes.
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Verify local tools
        # GitHub writes each run block to an unsigned temporary .ps1 file.
        # Bypass applies only to this CI process and does not change machine
        # or user execution-policy settings on the self-hosted runner.
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          flutter --version
          dart --version
          git --version
          # neura_swarm (rust/) needs cargo on this machine's PATH.
          cargo --version
          # The authored Windows runner fetches C++/WinRT through NuGet.
          nuget help | Select-Object -First 1

      - name: Run optimized validation
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          ./tools/Neura-FastCheck.ps1 -Root . -BuildWindows
