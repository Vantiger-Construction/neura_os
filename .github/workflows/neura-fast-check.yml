name: Neura Local Runner Check

on:
  pull_request:
    branches: [Neura]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'tools/Neura-FastCheck.ps1'
      - '.github/workflows/neura-fast-check.yml'
  workflow_dispatch:

concurrency:
  group: neura-local-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Uses the owner's Windows computer instead of paid GitHub-hosted minutes.
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $flutterVersion = '3.44.7'
          $flutterRoot = Join-Path $env:RUNNER_TOOL_CACHE "flutter\$flutterVersion\x64"
          $flutterExe = Join-Path $flutterRoot 'bin\flutter.bat'

          if (-not (Test-Path -LiteralPath $flutterExe -PathType Leaf)) {
            $stagingRoot = Join-Path $env:RUNNER_TEMP "flutter-$flutterVersion-$env:GITHUB_RUN_ID"
            if (Test-Path -LiteralPath $stagingRoot) {
              Remove-Item -LiteralPath $stagingRoot -Recurse -Force
            }

            git clone --depth 1 --branch $flutterVersion https://github.com/flutter/flutter.git $stagingRoot
            if ($LASTEXITCODE -ne 0) {
              throw "Flutter $flutterVersion clone failed with exit code $LASTEXITCODE."
            }

            New-Item -ItemType Directory -Path (Split-Path -Parent $flutterRoot) -Force | Out-Null
            Move-Item -LiteralPath $stagingRoot -Destination $flutterRoot
          }

          $flutterBin = Join-Path $flutterRoot 'bin'
          $flutterBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $flutterExe config --no-analytics
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter configuration failed with exit code $LASTEXITCODE."
          }
          & $flutterExe --version
          if ($LASTEXITCODE -ne 0) {
            throw "Flutter verification failed with exit code $LASTEXITCODE."
          }

      - name: Install Rust
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          $cargoExe = Join-Path $cargoBin 'cargo.exe'

          if (-not (Test-Path -LiteralPath $cargoExe -PathType Leaf)) {
            $rustupUrl = 'https://win.rustup.rs/x86_64'
            $rustupPath = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Write-Host "Downloading Rust installer from $rustupUrl"
            Invoke-WebRequest -Uri $rustupUrl -OutFile $rustupPath
            & $rustupPath -y --profile minimal
            if ($LASTEXITCODE -ne 0) {
              throw "Rust installation failed with exit code $LASTEXITCODE."
            }
          }

          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$cargoBin;$env:PATH"

          cargo --version
          if ($LASTEXITCODE -ne 0) {
            throw "cargo verification failed with exit code $LASTEXITCODE."
          }
          rustc --version
          if ($LASTEXITCODE -ne 0) {
            throw "rustc verification failed with exit code $LASTEXITCODE."
          }

      - name: Install NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Verify local tools
        # GitHub writes each run block to an unsigned temporary .ps1 file.
        # Bypass applies only to this CI process and does not change machine
        # or user execution-policy settings on the self-hosted runner.
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          flutter --version
          dart --version
          git --version
          cargo --version
          nuget help | Select-Object -First 1

      - name: Run optimized validation
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: ./tools/Neura-FastCheck.ps1 -Root . -BuildWindows
