name: Neura Local Runner Check

on:
  pull_request:
    branches: [Neura]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'rust/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'tools/Neura-FastCheck.ps1'
      - '.github/workflows/neura-fast-check.yml'
  workflow_dispatch:

concurrency:
  group: neura-local-runner-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  validate:
    # Uses the owner's Windows computer instead of paid GitHub-hosted minutes.
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 90

    steps:
      - name: Prepare local runner storage
        id: storage
        # The laptop has multiple small fixed drives. Keep the source checkout
        # on C:, install reusable toolchains on the roomiest drive, and place
        # generated build/Rust output on the next-roomiest drive.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'

          $partialFlutter = Join-Path $env:RUNNER_TOOL_CACHE "flutter\stable-$env:FLUTTER_VERSION-x64"
          if (Test-Path -LiteralPath $partialFlutter) {
            Write-Host "Removing truncated Flutter SDK: $partialFlutter"
            Remove-Item -LiteralPath $partialFlutter -Recurse -Force
          }

          $drives = @(Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' |
            Sort-Object -Property FreeSpace -Descending)
          $toolDrive = $drives |
            Where-Object { $_.FreeSpace -ge 5GB } |
            Select-Object -First 1
          if (-not $toolDrive) {
            $report = $drives | ForEach-Object {
              '{0} free={1:N2} GB' -f $_.DeviceID, ($_.FreeSpace / 1GB)
            }
            throw "No fixed drive has 5 GB free for the Windows-only Flutter toolchain. $($report -join '; ')"
          }

          $buildDrive = $drives |
            Where-Object {
              $_.DeviceID -ne $toolDrive.DeviceID -and $_.FreeSpace -ge 3GB
            } |
            Select-Object -First 1
          if (-not $buildDrive) {
            if ($toolDrive.FreeSpace -lt 8GB) {
              $report = $drives | ForEach-Object {
                '{0} free={1:N2} GB' -f $_.DeviceID, ($_.FreeSpace / 1GB)
              }
              throw "No separate 3 GB build drive and no 8 GB combined drive are available. $($report -join '; ')"
            }
            $buildDrive = $toolDrive
          }

          $toolRoot = Join-Path "$($toolDrive.DeviceID)\" 'neura-actions\toolchains'
          $buildRoot = Join-Path "$($buildDrive.DeviceID)\" 'neura-actions'
          $flutterRoot = Join-Path $toolRoot "flutter-$env:FLUTTER_VERSION"
          $pubCache = Join-Path $toolRoot 'pub-cache'
          $cargoHome = Join-Path $toolRoot 'cargo-home'
          $rustupHome = Join-Path $toolRoot 'rustup-home'
          $cargoTarget = Join-Path $buildRoot 'cargo-target'
          $tempRoot = Join-Path $buildRoot 'temp'
          $buildTarget = Join-Path $buildRoot "builds\$env:GITHUB_RUN_ID"

          foreach ($path in @(
            $toolRoot,
            $buildRoot,
            $pubCache,
            $cargoHome,
            $rustupHome,
            $cargoTarget,
            $tempRoot,
            $buildTarget
          )) {
            New-Item -ItemType Directory -Path $path -Force | Out-Null
          }

          "NEURA_FLUTTER_ROOT=$flutterRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PUB_CACHE=$pubCache" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_HOME=$cargoHome" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTUP_HOME=$rustupHome" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$cargoTarget" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tempRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tempRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NEURA_BUILD_TARGET=$buildTarget" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ('Toolchain drive {0}: {1:N2} GB free.' -f $toolDrive.DeviceID, ($toolDrive.FreeSpace / 1GB))
          Write-Host ('Build drive {0}: {1:N2} GB free.' -f $buildDrive.DeviceID, ($buildDrive.FreeSpace / 1GB))
          Write-Host "Flutter root: $flutterRoot"
          Write-Host "Build output: $buildTarget"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Relocate Flutter build output
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $buildLink = Join-Path $env:GITHUB_WORKSPACE 'build'
          if (Test-Path -LiteralPath $buildLink) {
            Remove-Item -LiteralPath $buildLink -Recurse -Force
          }
          New-Item -ItemType Directory -Path $env:NEURA_BUILD_TARGET -Force | Out-Null
          New-Item -ItemType Junction -Path $buildLink -Target $env:NEURA_BUILD_TARGET | Out-Null
          Write-Host "Build junction: $buildLink -> $env:NEURA_BUILD_TARGET"

      - name: Expose Git Bash to setup actions
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $gitExe = (Get-Command git -ErrorAction Stop).Source
          $gitRoot = Split-Path -Parent (Split-Path -Parent $gitExe)
          $bashDir = Join-Path $gitRoot 'bin'
          $bashExe = Join-Path $bashDir 'bash.exe'
          if (-not (Test-Path -LiteralPath $bashExe -PathType Leaf)) {
            throw "Git Bash was not found at $bashExe"
          }
          $bashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Added Git Bash to subsequent-step PATH: $bashDir"

      - name: Install pinned Windows Flutter SDK
        # A shallow pinned clone followed by Windows-only precache is much
        # smaller than the 1.77 GB all-platform Windows release archive.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $flutterBat = Join-Path $env:NEURA_FLUTTER_ROOT 'bin\flutter.bat'

          if (-not (Test-Path -LiteralPath $flutterBat -PathType Leaf)) {
            if (Test-Path -LiteralPath $env:NEURA_FLUTTER_ROOT) {
              Remove-Item -LiteralPath $env:NEURA_FLUTTER_ROOT -Recurse -Force
            }
            git -c core.longpaths=true clone --depth 1 --branch $env:FLUTTER_VERSION --single-branch https://github.com/flutter/flutter.git $env:NEURA_FLUTTER_ROOT
            if ($LASTEXITCODE -ne 0) {
              throw "Flutter $env:FLUTTER_VERSION clone failed with exit code $LASTEXITCODE."
            }
          }

          $flutterBin = Join-Path $env:NEURA_FLUTTER_ROOT 'bin'
          $flutterBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$flutterBin;$env:PATH"

          & $flutterBat config --no-analytics --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) {
            throw "flutter config failed with exit code $LASTEXITCODE."
          }
          & $flutterBat precache --windows
          if ($LASTEXITCODE -ne 0) {
            throw "flutter precache --windows failed with exit code $LASTEXITCODE."
          }
          & $flutterBat --version
          if ($LASTEXITCODE -ne 0) {
            throw "flutter --version failed with exit code $LASTEXITCODE."
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Verify local tools
        # The self-hosted machine enforces signed PowerShell scripts. GitHub
        # Actions writes each `run` block to an unsigned temporary .ps1 file,
        # so use a process-scoped bypass without changing machine policy.
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          flutter --version
          dart --version
          git --version
          cargo --version
          $nugetOutput = & nuget help 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "nuget help failed with exit code $LASTEXITCODE."
          }
          Write-Host ($nugetOutput | Select-Object -First 1)

      - name: Run optimized validation
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: ./tools/Neura-FastCheck.ps1 -Root . -BuildWindows
