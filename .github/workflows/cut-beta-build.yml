name: Cut Neura beta build

# Manual, on-demand build of a beta release package on a fresh GitHub-hosted
# Windows runner. Exists because the maintainer's own machine can run out of
# local disk space for the Rust + Flutter build; this gives a clean box with
# plenty of headroom. Runs the same BUILD_ALL_NEURA_UPGRADES.ps1 script used
# for local beta cuts, so the output matches what a local build produces.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows beta package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (neura_swarm crate)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Run beta build script
        shell: pwsh
        run: |
          & .\BUILD_ALL_NEURA_UPGRADES.ps1 -Root "${{ github.workspace }}" -SkipTests:$false

      - name: Upload beta package
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neura-beta-dist
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
