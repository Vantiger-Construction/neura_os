name: Apply Neura local runner correction

on:
  push:
    branches:
      - agent/neura-intelligence-fabric-v1.3

permissions:
  contents: write

concurrency:
  group: apply-neura-local-runner-correction
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the Neura 1.3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/neura-intelligence-fabric-v1.3
          fetch-depth: 0

      - name: Install corrected permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          source=.ci/neura-fast-check.corrected-v2.yml
          target=.github/workflows/neura-fast-check.yml
          test -s "$source"
          grep -Fq 'ExecutionPolicy Bypass' "$source"
          grep -Fq 'git @cloneArgs' "$source"
          grep -Fq 'flutter precache --windows' "$source"
          cp "$source" "$target"
          rm -f \
            .ci/neura-fast-check.corrected.yml \
            .ci/neura-fast-check.corrected-v2.yml \
            .github/workflows/apply-neura-local-runner-correction.yml

      - name: Commit and push the correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Neura Companion"
          git config user.email \
            "156997939+Vantiger1@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The permanent workflow is already corrected."
            exit 0
          fi
          git commit -m \
            "ci(local-runner): use lean Windows-only Flutter bootstrap"
          git push origin HEAD:agent/neura-intelligence-fabric-v1.3
