name: Neura 1.3 State Matrix

on:
  push:
    branches:
      - agent/neura-intelligence-fabric-v1.3
  pull_request:
    branches:
      - Neura
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neura-1.3-state-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  state-matrix:
    name: Startup, platform, recovery, and Safe Mode states
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 45

    steps:
      - name: Prepare bounded State Matrix workspace
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $workspaceRoot = [System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)
          if (-not $workspaceRoot -or -not (Test-Path -LiteralPath $workspaceRoot)) {
            throw "GITHUB_WORKSPACE points to an unavailable volume: $env:GITHUB_WORKSPACE"
          }

          $stateRoot = Join-Path $workspaceRoot 'neura-ci\state-matrix'
          if (Test-Path -LiteralPath $stateRoot) {
            Get-ChildItem -LiteralPath $stateRoot -Directory -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTimeUtc -lt [DateTime]::UtcNow.AddHours(-2) } |
              ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force }
          }

          $workspaceDrive = [System.IO.DriveInfo]::new($workspaceRoot)
          if (-not $workspaceDrive.IsReady -or $workspaceDrive.AvailableFreeSpace -lt 2.5GB) {
            $freeGb = [Math]::Round($workspaceDrive.AvailableFreeSpace / 1GB, 2)
            throw "State Matrix requires at least 2.5 GB free on the existing GitHub workspace volume; $freeGb GB is available on $workspaceRoot."
          }

          $runRoot = Join-Path $stateRoot "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $runRoot) {
            Remove-Item -LiteralPath $runRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path (Join-Path $runRoot 'pub-cache') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $runRoot 'temp') -Force | Out-Null

          @(
            "NEURA_SOURCE_ROOT=$env:GITHUB_WORKSPACE",
            "PUB_CACHE=$(Join-Path $runRoot 'pub-cache')",
            "TEMP=$(Join-Path $runRoot 'temp')",
            "TMP=$(Join-Path $runRoot 'temp')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out source
        uses: actions/checkout@v5

      - name: Enable pinned Flutter
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $flutterRoot = Join-Path $env:RUNNER_TOOL_CACHE "flutter\$env:FLUTTER_VERSION\x64"
          $flutterExe = Join-Path $flutterRoot 'bin\flutter.bat'
          if (-not (Test-Path -LiteralPath $flutterExe -PathType Leaf)) {
            throw "Pinned Flutter $env:FLUTTER_VERSION is missing from the runner tool cache."
          }
          (Join-Path $flutterRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $flutterExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore dependencies
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify committed formatting
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          dart format --output=none --set-exit-if-changed lib test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Analyze startup state code
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter analyze --no-fatal-warnings --no-fatal-infos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test startup, platform, and Safe Mode states
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter test --reporter expanded --timeout 60s `
            test/startup/startup_platform_policy_test.dart `
            test/startup/native_speech_safe_mode_test.dart `
            test/startup/neura_error_pipeline_test.dart *>&1 |
            Tee-Object -FilePath state-matrix.log |
            Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test recovery boundary in isolation
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter test --reporter expanded --timeout 30s `
            test/startup/neura_error_boundary_test.dart *>&1 |
            Tee-Object -FilePath state-matrix-recovery.log |
            Out-Host
          if (Test-Path -LiteralPath state-matrix-recovery.log) {
            Get-Content -LiteralPath state-matrix-recovery.log | Add-Content -LiteralPath state-matrix.log
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload state matrix evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Neura-1.3-state-matrix
          path: ${{ github.workspace }}\source\state-matrix.log
          if-no-files-found: warn
          retention-days: 14
