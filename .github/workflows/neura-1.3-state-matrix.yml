name: Neura 1.3 State Matrix

on:
  push:
    branches:
      - agent/neura-intelligence-fabric-v1.3
  pull_request:
    branches:
      - Neura
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neura-1.3-state-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  FLUTTER_SHA256: "0ccd71931f49c2fbe394b1eeb6d79af3d624058a043ea0d03d34160581624fb8"

jobs:
  state-matrix:
    name: Startup, platform, recovery, and Safe Mode states
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 90

    steps:
      - name: Route checkout and temporary data off the system volume
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $runnerWork = Split-Path -Parent $env:RUNNER_TEMP
          $systemRoot = [System.IO.Path]::GetPathRoot($runnerWork)
          if (-not $systemRoot -or -not (Test-Path -LiteralPath $systemRoot)) {
            $systemRoot = [System.IO.Path]::GetPathRoot([System.IO.Path]::GetTempPath())
            Write-Warning "RUNNER_TEMP points to an unavailable volume; using $systemRoot as the system-volume root."
          }
          $systemDriveName = $systemRoot.TrimEnd('\').TrimEnd(':')
          $systemDrive = Get-PSDrive -Name $systemDriveName -ErrorAction SilentlyContinue
          if (-not $systemDrive) {
            throw "Unable to inspect the system volume $systemRoot."
          }
          $systemFree = $systemDrive.Free
          $drive = [System.IO.DriveInfo]::GetDrives() |
            Where-Object {
              $_.IsReady -and
              ($_.Name -ne $systemRoot -or $systemFree -ge 4.5GB) -and
              ($_.DriveType -eq [System.IO.DriveType]::Fixed -or
               $_.DriveType -eq [System.IO.DriveType]::Removable) -and
              $_.AvailableFreeSpace -ge 2.5GB
            } |
            Sort-Object -Property AvailableFreeSpace -Descending |
            Select-Object -First 1
          if (-not $drive) {
            throw 'State Matrix requires one writable volume with at least 2.5 GB free; the system volume requires at least 4.5 GB free.'
          }

          $root = Join-Path $drive.RootDirectory.FullName 'neura-ci\state-matrix'
          $workspace = Join-Path $root 'workspace'
          $sourceLink = Join-Path $env:GITHUB_WORKSPACE 'source'
          foreach ($path in @($sourceLink, $root)) {
            if (Test-Path -LiteralPath $path) {
              $item = Get-Item -LiteralPath $path -Force
              if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$path"
              } else {
                Remove-Item -LiteralPath $path -Recurse -Force
              }
            }
          }
          $pubCache = Join-Path $env:RUNNER_TOOL_CACHE 'neura-dependencies\pub-cache-flutter-3.47.5'
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          New-Item -ItemType Directory -Path $pubCache -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root 'temp') -Force | Out-Null
          New-Item -ItemType Junction -Path $sourceLink -Target $workspace | Out-Null
          @(
            "NEURA_SOURCE_ROOT=$sourceLink",
            "PUB_CACHE=$pubCache",
            "TEMP=$(Join-Path $root 'temp')",
            "TMP=$(Join-Path $root 'temp')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out source
        uses: actions/checkout@v5
        with:
          path: source

      - name: Test Flutter provisioning health probe
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          & "$env:NEURA_SOURCE_ROOT\tools\Enable-NeuraFlutter.Tests.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enable pinned Flutter
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          & "$env:NEURA_SOURCE_ROOT\tools\Enable-NeuraFlutter.ps1" `
            -Version $env:FLUTTER_VERSION `
            -ExpectedSha256 $env:FLUTTER_SHA256

      - name: Restore dependencies
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify committed formatting
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          dart format --output=none --set-exit-if-changed lib test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Analyze startup state code
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter analyze --no-fatal-warnings --no-fatal-infos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test startup, platform, and Safe Mode states
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter test --reporter expanded --timeout 60s `
            test/startup/startup_platform_policy_test.dart `
            test/startup/native_speech_safe_mode_test.dart `
            test/startup/neura_error_pipeline_test.dart *>&1 |
            Tee-Object -FilePath state-matrix.log |
            Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test recovery boundary in isolation
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter test --reporter expanded --timeout 30s `
            test/startup/neura_error_boundary_test.dart *>&1 |
            Tee-Object -FilePath state-matrix-recovery.log |
            Out-Host
          if (Test-Path -LiteralPath state-matrix-recovery.log) {
            Get-Content -LiteralPath state-matrix-recovery.log | Add-Content -LiteralPath state-matrix.log
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload state matrix evidence
        if: always()
        uses: actions/upload-artifact@v6
        # Evidence upload is diagnostic; exhausted artifact quota must not
        # override the state/recovery validation result.
        continue-on-error: true
        with:
          name: Neura-1.3-state-matrix
          path: ${{ github.workspace }}\source\state-matrix.log
          if-no-files-found: warn
          retention-days: 3
