name: Neura 1.3 State Matrix

on:
  push:
    branches:
      - agent/neura-intelligence-fabric-v1.3
  pull_request:
    branches:
      - Neura
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neura-1.3-state-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  state-matrix:
    name: Startup, platform, recovery, and Safe Mode states
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Verify committed formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze startup state code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test all startup and recovery states
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s flutter test --reporter expanded \
            test/startup/startup_platform_policy_test.dart \
            test/startup/neura_error_pipeline_test.dart \
            test/startup/neura_error_boundary_test.dart 2>&1 | tee state-matrix.log

      - name: Upload state matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Neura-1.3-state-matrix
          path: state-matrix.log
          if-no-files-found: warn
          retention-days: 14
