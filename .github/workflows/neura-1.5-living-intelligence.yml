name: Neura 1.5 Living Intelligence

on:
  push:
    branches:
      - agent/neura-living-intelligence-v1.5
  pull_request:
    branches:
      - Neura
    paths:
      - 'lib/living_intelligence/**'
      - 'test/living_intelligence/**'
      - 'docs/LIVING_INTELLIGENCE_V1_5.md'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tools/Repair-NeuraCiStorage.ps1'
      - 'tools/Repair-NeuraCiStorage.Tests.ps1'
      - '.github/workflows/neura-1.5-living-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neura-living-intelligence-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  validate:
    name: Validate Living Intelligence safety and integration
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 75

    steps:
      - name: Route checkout and temporary data off the system volume
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $runnerWork = Split-Path -Parent $env:RUNNER_TEMP
          $systemRoot = [System.IO.Path]::GetPathRoot($runnerWork)
          if (-not $systemRoot -or -not (Test-Path -LiteralPath $systemRoot)) {
            $systemRoot = [System.IO.Path]::GetPathRoot([System.IO.Path]::GetTempPath())
            Write-Warning "RUNNER_TEMP points to an unavailable volume; using $systemRoot as the system-volume root."
          }
          $systemDriveName = $systemRoot.TrimEnd('\').TrimEnd(':')
          $systemDrive = Get-PSDrive -Name $systemDriveName -ErrorAction SilentlyContinue
          if (-not $systemDrive) {
            throw "Unable to inspect the system volume $systemRoot."
          }
          $systemFree = $systemDrive.Free
          $drive = [System.IO.DriveInfo]::GetDrives() |
            Where-Object {
              $_.IsReady -and
              ($_.Name -ne $systemRoot -or $systemFree -ge 6.0GB) -and
              ($_.DriveType -eq [System.IO.DriveType]::Fixed -or
               $_.DriveType -eq [System.IO.DriveType]::Removable) -and
              $_.AvailableFreeSpace -ge 2.5GB
            } |
            Sort-Object -Property AvailableFreeSpace -Descending |
            Select-Object -First 1
          if (-not $drive) {
            throw 'Living Intelligence validation requires one writable volume with at least 2.5 GB free; the system volume requires at least 6.0 GB free.'
          }

          $runKey = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $root = Join-Path $drive.RootDirectory.FullName "neura-ci\$runKey\living-intelligence"
          $workspace = Join-Path $root 'workspace'
          $sourceLink = Join-Path $env:GITHUB_WORKSPACE 'source'
          foreach ($path in @($sourceLink, $root)) {
            if (Test-Path -LiteralPath $path) {
              $item = Get-Item -LiteralPath $path -Force
              if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$path"
              } else {
                Remove-Item -LiteralPath $path -Recurse -Force
              }
            }
          }
          $pubCache = Join-Path $env:RUNNER_TOOL_CACHE "neura-dependencies\pub-cache-flutter-$env:FLUTTER_VERSION"
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          New-Item -ItemType Directory -Path $pubCache -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root 'temp') -Force | Out-Null
          New-Item -ItemType Junction -Path $sourceLink -Target $workspace | Out-Null
          @(
            "NEURA_SOURCE_ROOT=$sourceLink",
            "NEURA_VALIDATION_RUN_ROOT=$root",
            "PUB_CACHE=$pubCache",
            "TEMP=$(Join-Path $root 'temp')",
            "TMP=$(Join-Path $root 'temp')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out source
        uses: actions/checkout@v5
        with:
          path: source

      - name: Reject unresolved merge markers
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          $matches = Get-ChildItem -Path 'lib\living_intelligence','test\living_intelligence' -File -Recurse |
            Select-String -Pattern '^(<<<<<<<|=======|>>>>>>>)'
          if ($matches) {
            $matches | ForEach-Object { Write-Host "::error::$($_.Path):$($_.LineNumber):$($_.Line)" }
            throw 'Unresolved merge markers are committed.'
          }

      - name: Enable pinned Flutter
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $flutterRoot = Join-Path $env:RUNNER_TOOL_CACHE "flutter\$env:FLUTTER_VERSION\x64"
          $flutterExe = Join-Path $flutterRoot 'bin\flutter.bat'
          if (-not (Test-Path -LiteralPath $flutterExe -PathType Leaf)) {
            throw "Pinned Flutter $env:FLUTTER_VERSION is missing from the runner tool cache."
          }
          (Join-Path $flutterRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $flutterExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore dependencies
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Living Intelligence formatting
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          dart format --output=none --set-exit-if-changed `
            lib/living_intelligence `
            test/living_intelligence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require zero analyzer findings
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter analyze --fatal-infos *>&1 |
            Tee-Object -FilePath analyze.log |
            Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused Living Intelligence tests
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter test --no-pub --reporter expanded test/living_intelligence *>&1 |
            Tee-Object -FilePath living-intelligence-tests.log |
            Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete Flutter suite
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter test --no-pub --reporter expanded *>&1 |
            Tee-Object -FilePath complete-tests.log |
            Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record diagnostic evidence in run summary
        if: always()
        continue-on-error: true
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        env:
          NEURA_REPORT_TITLE: Neura-1.5-living-intelligence-evidence
          NEURA_REPORT_PATHS: |
            ${{ github.workspace }}\source\analyze.log
            ${{ github.workspace }}\source\living-intelligence-tests.log
            ${{ github.workspace }}\source\complete-tests.log
            ${{ github.workspace }}\source\pubspec.lock
        run: |
          $ErrorActionPreference = 'Stop'
          $summary = @(
            "### $env:NEURA_REPORT_TITLE",
            '',
            "Tested commit: $env:GITHUB_SHA",
            '',
            'Diagnostic excerpts are below. Full command output remains in the job logs; use Download log archive on this run to save it.',
            ''
          )
          $remaining = 200000
          foreach ($path in ($env:NEURA_REPORT_PATHS -split '\r?\n')) {
            if ([string]::IsNullOrWhiteSpace($path)) { continue }
            $summary += "#### $(Split-Path -Leaf $path)"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              $summary += 'Not produced; check the preceding validation steps.'
              continue
            }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $summary += "SHA-256: $hash"
            $excerpt = (Get-Content -LiteralPath $path -Tail 200) -join [Environment]::NewLine
            $excerpt = $excerpt -replace '\x1b\[[0-?]*[ -/]*[@-~]', ''
            $excerpt = [Net.WebUtility]::HtmlEncode($excerpt)
            $limit = [Math]::Min(40000, $remaining)
            if ($excerpt.Length -gt $limit) { $excerpt = $excerpt.Substring($excerpt.Length - $limit) }
            $remaining -= $excerpt.Length
            $summary += @('<pre>', $excerpt, '</pre>', '')
          }
          $summary | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host 'Diagnostic evidence recorded in the run summary.'

      - name: Release completed validation output
        if: always()
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          # Post-checkout still needs the source tree, but temporary test output
          # must not remain until a later job's two-hour stale-data cleanup.
          if (-not [string]::IsNullOrWhiteSpace($env:RUNNER_TEMP) -and
              (Test-Path -LiteralPath $env:RUNNER_TEMP -PathType Container)) {
            Set-Location -LiteralPath $env:RUNNER_TEMP
            $env:TEMP = $env:RUNNER_TEMP
            $env:TMP = $env:RUNNER_TEMP
            @("TEMP=$env:RUNNER_TEMP", "TMP=$env:RUNNER_TEMP") |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          if ([string]::IsNullOrWhiteSpace($env:NEURA_VALIDATION_RUN_ROOT) -or
              [string]::IsNullOrWhiteSpace($env:NEURA_SOURCE_ROOT)) {
            Write-Host 'No validation workspace was selected; nothing to release.'
            exit 0
          }
          $helper = Join-Path $env:NEURA_SOURCE_ROOT 'tools\Repair-NeuraCiStorage.ps1'
          if (Test-Path -LiteralPath $helper -PathType Leaf) {
            & $helper -ClearValidationOutput -ValidationRunRoot $env:NEURA_VALIDATION_RUN_ROOT
          } else {
            Write-Host 'Checkout did not provide the cleanup helper; leaving early-failure recovery to the next storage preflight.'
          }
