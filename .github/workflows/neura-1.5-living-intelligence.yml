name: Neura 1.5 Living Intelligence

on:
  push:
    branches:
      - agent/neura-living-intelligence-v1.5
  pull_request:
    branches:
      - Neura
    paths:
      - 'lib/living_intelligence/**'
      - 'test/living_intelligence/**'
      - 'docs/LIVING_INTELLIGENCE_V1_5.md'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/neura-1.5-living-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neura-living-intelligence-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  validate:
    name: Validate Living Intelligence safety and integration
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            lib/living_intelligence \
            test/living_intelligence; then
            echo "::error::Unresolved merge markers are committed."
            exit 1
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Verify Living Intelligence formatting
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed \
            lib/living_intelligence \
            test/living_intelligence

      - name: Require zero analyzer findings
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee analyze.log

      - name: Run focused Living Intelligence tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded \
            test/living_intelligence 2>&1 | tee living-intelligence-tests.log

      - name: Run complete Flutter suite
        shell: bash
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded \
            2>&1 | tee complete-tests.log

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Neura-1.5-living-intelligence-evidence
          path: |
            analyze.log
            living-intelligence-tests.log
            complete-tests.log
            pubspec.lock
          if-no-files-found: warn
          retention-days: 14
