name: Neura 1.5.1 Self-Hosted Check

on:
  push:
    branches:
      - agent/neura-consent-turn-safety-v1.5.1
  pull_request:
    branches:
      - agent/neura-living-intelligence-v1.5
      - Neura
    paths:
      - 'lib/living_intelligence/**'
      - 'lib/intelligence/action_loom.dart'
      - 'lib/intelligence/fresh_approval_lease.dart'
      - 'lib/intelligence/intelligence.dart'
      - 'lib/persona/models/neura_audience.dart'
      - 'test/living_intelligence/**'
      - 'test/intelligence/action_loom_fresh_approval_test.dart'
      - 'test/intelligence/fresh_approval_lease_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/neura-1.5.1-self-hosted-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neura-1.5.1-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate consent and Action Loom safety on retained Flutter
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 120

    steps:
      - name: Select one bounded workspace volume
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Remove-LinkOrDirectory {
            param([Parameter(Mandatory)][string]$Path)
            if (-not (Test-Path -LiteralPath $Path)) { return }
            try {
              $item = Get-Item -LiteralPath $Path -Force
              if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$Path"
                if ($LASTEXITCODE -ne 0) {
                  throw "rmdir exited with code $LASTEXITCODE"
                }
              } else {
                Remove-Item -LiteralPath $Path -Recurse -Force
              }
            } catch {
              Write-Warning "Could not remove ${Path}: $($_.Exception.Message)"
            }
          }

          function Test-NeuraVolume {
            param([Parameter(Mandatory)][System.IO.DriveInfo]$Drive)
            if (-not $Drive.IsReady -or
                ($Drive.DriveType -ne [System.IO.DriveType]::Fixed -and
                 $Drive.DriveType -ne [System.IO.DriveType]::Removable) -or
                $Drive.AvailableFreeSpace -lt 3GB) {
              return $false
            }
            $probe = Join-Path $Drive.RootDirectory.FullName "neura-ci\probe-$env:GITHUB_RUN_ID"
            try {
              New-Item -ItemType Directory -Path $probe -Force | Out-Null
              Set-Content -LiteralPath (Join-Path $probe 'probe.txt') -Value 'ok' -NoNewline
              Remove-Item -LiteralPath $probe -Recurse -Force
              return $true
            } catch {
              Write-Warning "Volume $($Drive.Name) is not writable: $($_.Exception.Message)"
              return $false
            }
          }

          $runnerTemp = $env:RUNNER_TEMP
          $runnerWork = Split-Path -Parent $runnerTemp
          $systemRoot = [System.IO.Path]::GetPathRoot($runnerWork)
          if (-not $systemRoot -or -not (Test-Path -LiteralPath $systemRoot)) {
            $runnerTemp = [System.IO.Path]::GetTempPath().TrimEnd('\')
            $runnerWork = Split-Path -Parent $runnerTemp
            $systemRoot = [System.IO.Path]::GetPathRoot($runnerWork)
            Write-Warning "RUNNER_TEMP points to an unavailable volume; using $runnerTemp for runner-owned cleanup."
          }
          $systemDriveName = $systemRoot.TrimEnd('\').TrimEnd(':')
          $systemDrive = Get-PSDrive -Name $systemDriveName -ErrorAction SilentlyContinue
          if (-not $systemDrive) {
            throw "Unable to inspect the system volume $systemRoot."
          }
          foreach ($repository in Get-ChildItem -LiteralPath $runnerWork -Directory -ErrorAction SilentlyContinue) {
            if ($repository.Name.StartsWith('_')) { continue }
            $checkout = Join-Path $repository.FullName $repository.Name
            Remove-LinkOrDirectory -Path (Join-Path $checkout 'build')
            Remove-LinkOrDirectory -Path (Join-Path $checkout 'rust\target')
          }

          $cutoff = (Get-Date).AddHours(-2)
          foreach ($drive in [System.IO.DriveInfo]::GetDrives()) {
            if (-not $drive.IsReady) { continue }
            $ownedRoot = Join-Path $drive.RootDirectory.FullName 'neura-ci'
            if (Test-Path -LiteralPath $ownedRoot -PathType Container) {
              Get-ChildItem -LiteralPath $ownedRoot -Directory -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.LastWriteTime -lt $cutoff } |
                Sort-Object -Property LastWriteTime |
                Select-Object -First 12 |
                ForEach-Object { Remove-LinkOrDirectory -Path $_.FullName }
            }
          }

          $volume = [System.IO.DriveInfo]::GetDrives() |
            Where-Object { $_.IsReady -and $_.Name -ne $systemRoot } |
            Where-Object { Test-NeuraVolume -Drive $_ } |
            Sort-Object -Property AvailableFreeSpace -Descending |
            Select-Object -First 1
          if (-not $volume) {
            $systemFallbackMinimum = 8.0GB
            $systemVolume = [System.IO.DriveInfo]::new($systemRoot)
            if (-not $systemVolume.IsReady -or
                $systemVolume.AvailableFreeSpace -lt $systemFallbackMinimum -or
                -not (Test-NeuraVolume -Drive $systemVolume)) {
              throw ('Validation requires a writable non-system volume with at least 3 GB free, ' +
                'or an explicit system-volume fallback with at least 8 GB free.')
            }
            $volume = $systemVolume
            $layout = 'system fallback'
          } else {
            $layout = 'non-system'
          }

          $systemFree = ([System.IO.DriveInfo]::new($systemRoot)).AvailableFreeSpace
          if ($systemFree -lt 1.0GB) {
            throw "The runner needs at least 1.0 GB on $systemRoot for metadata."
          }

          $runKey = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $runRoot = Join-Path $volume.RootDirectory.FullName "neura-ci\$runKey\living-intelligence"
          $workspaceTarget = Join-Path $runRoot 'workspace'
          $sourceLink = Join-Path $env:GITHUB_WORKSPACE 'source'
          # Reuse immutable package downloads across runs; pub still resolves
          # against the committed lockfile on every validation.
          $pubCache = Join-Path $env:RUNNER_TOOL_CACHE 'neura-dependencies\pub-cache-flutter-3.44.7'
          $tempRoot = Join-Path $runRoot 'temp'

          Set-Location -LiteralPath $runnerTemp
          Remove-LinkOrDirectory -Path $sourceLink
          Remove-LinkOrDirectory -Path $runRoot
          foreach ($path in @($workspaceTarget, $pubCache, $tempRoot)) {
            New-Item -ItemType Directory -Path $path -Force | Out-Null
          }
          New-Item -ItemType Junction -Path $sourceLink -Target $workspaceTarget | Out-Null

          @(
            "NEURA_SOURCE_ROOT=$sourceLink",
            "NEURA_RUN_ROOT=$runRoot",
            "PUB_CACHE=$pubCache",
            "TEMP=$tempRoot",
            "TMP=$tempRoot"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Validation workspace: $sourceLink -> $workspaceTarget"
          Write-Host "Selected volume ($layout): $($volume.Name) ($([Math]::Round($volume.AvailableFreeSpace / 1GB, 2)) GB free)"

      - name: Check out source
        uses: actions/checkout@v5
        with:
          path: source

      - name: Enable pinned Flutter 3.44.7
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $flutterRoot = Join-Path $env:RUNNER_TOOL_CACHE 'flutter\3.44.7\x64'
          $flutterExe = Join-Path $flutterRoot 'bin\flutter.bat'
          if (-not (Test-Path -LiteralPath $flutterExe -PathType Leaf)) {
            throw 'Pinned Flutter 3.44.7 is missing from the retained runner tool cache.'
          }
          (Join-Path $flutterRoot 'bin') |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $flutterExe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore dependencies
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Confirm validation headroom
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $runVolume = [IO.Path]::GetPathRoot([IO.Path]::GetFullPath($env:NEURA_RUN_ROOT))
          $systemVolume = [IO.Path]::GetPathRoot([IO.Path]::GetFullPath($env:RUNNER_TEMP))
          $runDrive = [IO.DriveInfo]::new($runVolume)
          $systemDrive = [IO.DriveInfo]::new($systemVolume)
          $runMinimum = if ($runVolume -eq $systemVolume) { 4.0GB } else { 2.0GB }
          Write-Host ("Validation volume {0}: {1:N2} GB free; required {2:N2} GB" -f
            $runVolume, ($runDrive.AvailableFreeSpace / 1GB), ($runMinimum / 1GB))
          if ($runDrive.AvailableFreeSpace -lt $runMinimum) {
            throw 'Validation volume headroom fell below the safe post-restore threshold.'
          }
          if ($systemDrive.AvailableFreeSpace -lt 1.0GB) {
            throw 'The system volume must retain at least 1.0 GB for runner metadata.'
          }

      - name: Prepare canonical source evidence
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          $formatPaths = @(
            'lib\living_intelligence',
            'lib\intelligence\action_loom.dart',
            'lib\intelligence\fresh_approval_lease.dart',
            'lib\intelligence\intelligence.dart',
            'test\living_intelligence',
            'test\intelligence\action_loom_fresh_approval_test.dart',
            'test\intelligence\fresh_approval_lease_test.dart'
          )
          & dart format @formatPaths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & git diff --no-ext-diff -- pubspec.lock @formatPaths |
            Out-File -LiteralPath canonical-source.patch -Encoding utf8
          & git diff --name-only -- pubspec.lock @formatPaths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record diagnostic evidence in run summary
        continue-on-error: true
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        env:
          NEURA_REPORT_TITLE: Neura-1.5.1-canonical-source
          NEURA_REPORT_PATHS: |
            ${{ env.NEURA_SOURCE_ROOT }}\pubspec.lock
            ${{ env.NEURA_SOURCE_ROOT }}\canonical-source.patch
            ${{ env.NEURA_SOURCE_ROOT }}\lib\living_intelligence\cloud_inference_consent.dart
            ${{ env.NEURA_SOURCE_ROOT }}\lib\living_intelligence\compassionate_response_policy.dart
            ${{ env.NEURA_SOURCE_ROOT }}\lib\intelligence\action_loom.dart
            ${{ env.NEURA_SOURCE_ROOT }}\test\living_intelligence\neura_consent_turn_safety_test.dart
        run: |
          $ErrorActionPreference = 'Stop'
          $summary = @(
            "### $env:NEURA_REPORT_TITLE",
            '',
            "Tested commit: $env:GITHUB_SHA",
            '',
            'Diagnostic excerpts are below. Full command output remains in the job logs; use Download log archive on this run to save it.',
            ''
          )
          $remaining = 200000
          foreach ($path in ($env:NEURA_REPORT_PATHS -split '\r?\n')) {
            if ([string]::IsNullOrWhiteSpace($path)) { continue }
            $summary += "#### $(Split-Path -Leaf $path)"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              $summary += 'Not produced; check the preceding validation steps.'
              continue
            }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $summary += "SHA-256: $hash"
            $excerpt = (Get-Content -LiteralPath $path -Tail 200) -join [Environment]::NewLine
            $excerpt = $excerpt -replace '\x1b\[[0-?]*[ -/]*[@-~]', ''
            $excerpt = [Net.WebUtility]::HtmlEncode($excerpt)
            $limit = [Math]::Min(40000, $remaining)
            if ($excerpt.Length -gt $limit) { $excerpt = $excerpt.Substring($excerpt.Length - $limit) }
            $remaining -= $excerpt.Length
            $summary += @('<pre>', $excerpt, '</pre>', '')
          }
          $summary | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host 'Diagnostic evidence recorded in the run summary.'

      - name: Verify canonical generated files are committed
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          $checkedPaths = @(
            'pubspec.lock',
            'lib\living_intelligence',
            'lib\intelligence\action_loom.dart',
            'lib\intelligence\fresh_approval_lease.dart',
            'lib\intelligence\intelligence.dart',
            'test\living_intelligence',
            'test\intelligence\action_loom_fresh_approval_test.dart',
            'test\intelligence\fresh_approval_lease_test.dart'
          )
          & git diff --exit-code -- @checkedPaths
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'The canonical source artifact contains the exact files to commit.'
            exit 1
          }

      - name: Require zero analyzer findings
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter analyze --fatal-infos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused safety tests
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-Location -LiteralPath $env:NEURA_SOURCE_ROOT
          flutter test --no-pub --reporter expanded `
            test\living_intelligence `
            test\intelligence\action_loom_fresh_approval_test.dart `
            test\intelligence\fresh_approval_lease_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release generated validation space
        if: always()
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $cleanupTemp = [System.Environment]::GetEnvironmentVariable('RUNNER_TEMP')
          if ([string]::IsNullOrWhiteSpace($cleanupTemp) -or
              -not (Test-Path -LiteralPath $cleanupTemp)) {
            $cleanupTemp = [System.IO.Path]::GetTempPath().TrimEnd('\')
          }
          Set-Location -LiteralPath $cleanupTemp
          $sourceLink = Join-Path $env:GITHUB_WORKSPACE 'source'
          if (Test-Path -LiteralPath $sourceLink) {
            & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$sourceLink"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:NEURA_RUN_ROOT) -and
              (Test-Path -LiteralPath $env:NEURA_RUN_ROOT)) {
            Remove-Item -LiteralPath $env:NEURA_RUN_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          }
