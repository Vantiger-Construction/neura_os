name: Format Neura Adaptive Intent Phase 4 Now

on:
  push:
    branches:
      - agent/neura-adaptive-intent-os-v1.4

permissions:
  contents: write

concurrency:
  group: format-neura-adaptive-intent-phase4-now
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  WORK_BRANCH: agent/neura-adaptive-intent-os-v1.4

jobs:
  format-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore package language settings
        run: flutter pub get

      - name: Apply canonical package-mode formatting
        run: |
          dart format \
            lib/adaptive_intent \
            lib/cognitive \
            lib/constitution \
            lib/intent_compiler \
            lib/dashboard/widgets/proactive_banner_card.dart \
            test/adaptive_intent \
            test/cognitive \
            test/constitution \
            test/intent_compiler

      - name: Commit formatted Phase 4 sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/format-neura-adaptive-intent-phase4-now.yml
          git config user.name "Neura Companion"
          git config user.email "156997939+Vantiger1@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git commit -m "style(adaptive-intent): apply canonical Phase 4 formatting"
          git push origin HEAD:${WORK_BRANCH}
