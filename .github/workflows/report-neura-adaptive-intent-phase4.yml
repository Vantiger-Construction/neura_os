name: Report verified Neura Adaptive Intent Phase 4

on:
  push:
    branches:
      - agent/neura-adaptive-intent-os-v1.4

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  report:
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out verified branch
        uses: actions/checkout@v4
        with:
          ref: agent/neura-adaptive-intent-os-v1.4
          fetch-depth: 0

      - name: Require success-only validation evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f ADAPTIVE_INTENT_PHASE4_VALIDATION.md
          grep -q 'flutter analyze --fatal-infos: PASS' \
            ADAPTIVE_INTENT_PHASE4_VALIDATION.md
          grep -q 'complete Neura Flutter suite: PASS' \
            ADAPTIVE_INTENT_PHASE4_VALIDATION.md
          grep -q 'Package: 1.4.0+7' \
            ADAPTIVE_INTENT_PHASE4_VALIDATION.md

      - name: Post validation evidence to PR 42
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Neura Adaptive Intent Phase 4 verified'
            echo
            cat ADAPTIVE_INTENT_PHASE4_VALIDATION.md
          } > /tmp/phase4-comment.md
          gh pr comment 42 --body-file /tmp/phase4-comment.md

      - name: Remove one-time reporter
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/report-neura-adaptive-intent-phase4.yml
          git config user.name "Neura Companion"
          git config user.email \
            "156997939+Vantiger1@users.noreply.github.com"
          git add -A
          git commit -m \
            "ci(adaptive-intent): record verified Phase 4 evidence"
          git push origin HEAD:agent/neura-adaptive-intent-os-v1.4
