name: Finalize Neura Adaptive Intent Phase 4 v2

on:
  push:
    branches:
      - agent/neura-adaptive-intent-os-v1.4

permissions:
  contents: write

concurrency:
  group: apply-neura-adaptive-intent-phase4
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  WORK_BRANCH: agent/neura-adaptive-intent-os-v1.4

jobs:
  finalize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Apply and harden Phase 4
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .ci/apply_neura_adaptive_intent_phase4.py ]]; then
            python3 .ci/apply_neura_adaptive_intent_phase4.py
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/adaptive_intent/neura_live_signal_adapter.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'final quests = await QuestStore.instance.getQuests();',
              'final List<Quest> quests = '
              'await QuestStore.instance.getQuests();',
          )
          text = text.replace(
              'final done = await QuestStore.instance.getDone();',
              'final List<QuestDone> done = '
              'await QuestStore.instance.getDone();',
          )
          path.write_text(text, encoding='utf-8')
          PY
          required=(
            lib/adaptive_intent/neura_adaptive_intent_preferences.dart
            lib/adaptive_intent/neura_live_signal_adapter.dart
            lib/adaptive_intent/neura_outcome_store.dart
            lib/adaptive_intent/neura_local_quest_bridge.dart
            lib/adaptive_intent/neura_adaptive_intent_onboarding.dart
            lib/adaptive_intent/neura_adaptive_intent_entry_screen.dart
            test/adaptive_intent/neura_adaptive_intent_preferences_test.dart
            test/adaptive_intent/neura_live_signal_adapter_test.dart
            test/adaptive_intent/neura_outcome_store_test.dart
            test/adaptive_intent/neura_local_quest_bridge_test.dart
            test/adaptive_intent/neura_adaptive_intent_phase4_test.dart
          )
          for path in "${required[@]}"; do
            test -f "$path" || {
              echo "Missing Phase 4 file: $path" >&2
              exit 1
            }
          done
          grep -q 'version: 1.4.0+7' pubspec.yaml
          grep -q 'adaptive intent shutdown' \
            lib/src/core/data_wipe_service.dart
          grep -q 'NeuraAdaptiveIntentEntryScreen' \
            lib/modules/navigation/enhanced_navigation.dart

      - name: Restore package language settings
        run: flutter pub get

      - name: Apply safe analyzer fixes
        run: dart fix --apply

      - name: Apply canonical package-mode formatting
        run: |
          dart format \
            lib/adaptive_intent \
            lib/cognitive \
            lib/constitution \
            lib/intent_compiler \
            lib/dashboard/widgets/proactive_banner_card.dart \
            lib/modules/navigation/enhanced_navigation.dart \
            lib/src/core/data_wipe_service.dart \
            test/adaptive_intent \
            test/cognitive \
            test/constitution \
            test/intent_compiler

      - name: Require zero analyzer findings
        run: flutter analyze --fatal-infos

      - name: Run Adaptive Intent Phase 4 tests
        run: |
          flutter test --reporter expanded --timeout 90s \
            test/cognitive \
            test/constitution \
            test/intent_compiler \
            test/adaptive_intent

      - name: Run complete Neura Flutter suite
        run: flutter test --concurrency 4 --timeout 2m

      - name: Record validation and commit verified Phase 4
        shell: bash
        run: |
          set -euo pipefail
          cat > ADAPTIVE_INTENT_PHASE4_VALIDATION.md <<EOF
          # Neura Adaptive Intent OS Phase 4 validation

          - Source SHA: ${GITHUB_SHA}
          - GitHub Actions run: ${GITHUB_RUN_ID}
          - Flutter: ${FLUTTER_VERSION}
          - Package: 1.4.0+7
          - Package-mode Dart formatting: PASS
          - flutter analyze --fatal-infos: PASS
          - focused Cognitive/Constitution/Intent/Adaptive Intent tests: PASS
          - complete Neura Flutter suite: PASS
          - live signal sources: opt-in, normalized, local values only
          - outcome history: bounded and AES-GCM encrypted at rest
          - executable capability: reversible local quest after fresh approval
          - external, cloud, calendar, purchase, message, and money executors: absent
          EOF
          rm -rf .ci/neura-adaptive-intent-phase4
          rm -f .ci/apply_neura_adaptive_intent_phase4.py
          rm -f \
            .github/workflows/apply-neura-adaptive-intent-phase4.yml \
            .github/workflows/finalize-neura-adaptive-intent-phase4.yml \
            .github/workflows/finalize-neura-adaptive-intent-phase4-v2.yml
          git config user.name "Neura Companion"
          git config user.email \
            "156997939+Vantiger1@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Phase 4 is already fully integrated and verified."
            exit 0
          fi
          git commit -m \
            "feat(adaptive-intent): build real-beta Phase 4"
          git push origin HEAD:${WORK_BRANCH}
