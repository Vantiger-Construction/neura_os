name: Fix Neura Phase 4 packaging once

on:
  push:
    branches:
      - agent/neura-adaptive-intent-phase4-integration
    paths:
      - .github/workflows/fix-neura-phase4-packaging-once.yml

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: fix-neura-phase4-packaging-once
  cancel-in-progress: false

env:
  WORK_BRANCH: agent/neura-adaptive-intent-phase4-integration

jobs:
  patch-and-dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}
          fetch-depth: 0

      - name: Patch Windows runtime discovery and Android shrinking
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow_path = Path('.github/workflows/neura-recovery-downloads.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old_runtime_path = (
              'Microsoft Visual Studio\\2022\\*\\VC\\Redist\\MSVC\\*'
          )
          new_runtime_path = (
              'Microsoft Visual Studio\\*\\*\\VC\\Redist\\MSVC\\*'
          )
          if old_runtime_path not in workflow:
              if new_runtime_path not in workflow:
                  raise SystemExit(
                      'Windows Visual C++ runtime search anchor was not found.'
                  )
          else:
              workflow = workflow.replace(
                  old_runtime_path,
                  new_runtime_path,
              )
          workflow_path.write_text(workflow, encoding='utf-8')

          gradle_path = Path('android/app/build.gradle.kts')
          gradle = gradle_path.read_text(encoding='utf-8')
          gradle, kotlin_count = re.subn(
              r'(?m)^(\s*)isShrinkResources\s*=\s*true\s*$',
              r'\1isShrinkResources = false',
              gradle,
          )
          gradle, legacy_count = re.subn(
              r'(?m)^(\s*)shrinkResources\s*=\s*true\s*$',
              r'\1isShrinkResources = false',
              gradle,
          )
          if kotlin_count + legacy_count == 0:
              if re.search(
                  r'(?m)^\s*isShrinkResources\s*=\s*false\s*$',
                  gradle,
              ) is None:
                  raise SystemExit(
                      'Android shrink-resources setting was not found.'
                  )
          if re.search(
              r'(?m)^\s*(?:isShrinkResources|shrinkResources)\s*=\s*true\s*$',
              gradle,
          ) is not None:
              raise SystemExit(
                  'Android resource shrinking remains enabled without minification.'
              )
          gradle_path.write_text(gradle, encoding='utf-8')
          PY

      - name: Verify exact packaging changes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Microsoft Visual Studio\*\*\VC\Redist\MSVC\*' \
            .github/workflows/neura-recovery-downloads.yml
          if grep -Eq '^\s*(isShrinkResources|shrinkResources)\s*=\s*true\s*$' \
            android/app/build.gradle.kts; then
            echo '::error::Android resource shrinking is still enabled.'
            exit 1
          fi
          grep -Eq '^\s*isShrinkResources\s*=\s*false\s*$' \
            android/app/build.gradle.kts
          git diff --check

      - name: Commit fixes and remove one-time patcher
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-neura-phase4-packaging-once.yml
          git config user.name 'Neura Companion'
          git config user.email \
            '156997939+Vantiger1@users.noreply.github.com'
          git add \
            .github/workflows/neura-recovery-downloads.yml \
            android/app/build.gradle.kts \
            .github/workflows/fix-neura-phase4-packaging-once.yml
          if git diff --cached --quiet; then
            echo 'Packaging fixes were already present.'
          else
            git commit -m 'fix: unblock Windows and Android package builds'
            git push origin HEAD:${WORK_BRANCH}
          fi

      - name: Dispatch permanent package validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run neura-recovery-downloads.yml \
            --ref ${WORK_BRANCH}
          gh pr comment 43 --body \
            "Applied the Windows runtime-discovery and Android shrink-resource fixes, then dispatched the permanent package validation from $(git rev-parse HEAD)."
