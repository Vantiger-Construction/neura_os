name: Neura Runner Emergency Cleanup

on:
  pull_request:
    branches:
      - Neura
    paths:
      - '.github/workflows/neura-runner-emergency-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neura-runner-emergency-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Reclaim stale runner-owned generated data
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 15

    steps:
      # This workflow intentionally uses no checkout or marketplace actions.
      # It must be able to start when the runner cannot download actions.
      - name: Remove stale runner-owned data only
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Continue'

          function Remove-GeneratedPath {
            param([Parameter(Mandatory)][string]$Path)
            if (-not (Test-Path -LiteralPath $Path)) { return }
            try {
              $item = Get-Item -LiteralPath $Path -Force -ErrorAction Stop
              if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                & "$env:SystemRoot\System32\cmd.exe" /d /c rmdir "$Path"
              } else {
                Remove-Item -LiteralPath $Path -Recurse -Force -ErrorAction Stop
              }
              Write-Host "Removed runner-owned generated path: $Path"
            } catch {
              Write-Warning "Could not remove ${Path}: $($_.Exception.Message)"
            }
          }

          function Remove-StaleChildren {
            param(
              [Parameter(Mandatory)][string]$Root,
              [Parameter(Mandatory)][DateTime]$Before
            )
            if (-not (Test-Path -LiteralPath $Root -PathType Container)) { return }
            Get-ChildItem -LiteralPath $Root -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTime -lt $Before } |
              ForEach-Object { Remove-GeneratedPath -Path $_.FullName }
          }

          $runnerTemp = $env:RUNNER_TEMP
          $runnerWork = Split-Path -Parent $runnerTemp
          $systemRoot = [System.IO.Path]::GetPathRoot($runnerWork)
          if (-not $systemRoot -or -not (Test-Path -LiteralPath $systemRoot)) {
            $runnerTemp = [System.IO.Path]::GetTempPath().TrimEnd('\')
            $runnerWork = Split-Path -Parent $runnerTemp
            $systemRoot = [System.IO.Path]::GetPathRoot($runnerWork)
            Write-Warning "RUNNER_TEMP points to an unavailable volume; using $runnerTemp for runner-owned cleanup."
          }
          $cutoff = (Get-Date).AddHours(-2)

          # GitHub action downloads are disposable runner cache content.
          Remove-StaleChildren -Root (Join-Path $runnerWork '_actions') -Before $cutoff

          # Remove only generated directories beneath Neura checkout folders.
          foreach ($repository in Get-ChildItem -LiteralPath $runnerWork -Directory -ErrorAction SilentlyContinue) {
            if ($repository.Name.StartsWith('_')) { continue }
            $checkout = Join-Path $repository.FullName $repository.Name
            foreach ($relative in @('build', 'rust\target', '.dart_tool', 'android\.gradle')) {
              $generated = Join-Path $checkout $relative
              if (Test-Path -LiteralPath $generated) {
                $item = Get-Item -LiteralPath $generated -Force -ErrorAction SilentlyContinue
                if ($item -and $item.LastWriteTime -lt $cutoff) {
                  Remove-GeneratedPath -Path $generated
                }
              }
            }
          }

          # RUNNER_TEMP is runner-owned. Keep recent work for active jobs.
          Remove-StaleChildren -Root $runnerTemp -Before $cutoff

          # These are disposable Gradle caches; the pinned tool cache is kept.
          $gradleRoot = Join-Path $env:USERPROFILE '.gradle'
          foreach ($relative in @('caches', 'daemon', 'native', 'notifications')) {
            Remove-StaleChildren -Root (Join-Path $gradleRoot $relative) -Before $cutoff
          }

          # Retain recent runner diagnostics but remove old runner-owned logs.
          $runnerRoot = Split-Path -Parent $runnerWork
          Remove-StaleChildren -Root (Join-Path $runnerRoot '_diag') -Before (Get-Date).AddDays(-7)

          $systemDriveName = $systemRoot.TrimEnd('\\').TrimEnd(':')
          $systemDrive = Get-PSDrive -Name $systemDriveName -ErrorAction SilentlyContinue
          if (-not $systemDrive) {
            throw "Unable to inspect the system volume $systemRoot."
          }
          $free = $systemDrive.Free
          Write-Host ("System volume {0} free after cleanup: {1:N2} GB" -f $systemRoot, ($free / 1GB))
          if ($free -lt 0.25GB) {
            throw ("Runner still has less than 0.25 GB free on {0}. Manual cleanup is required before validation can run." -f $systemRoot)
          }