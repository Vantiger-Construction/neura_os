name: Neura Runner Disk Inventory

on:
  push:
    branches:
      - agent/neura-living-intelligence-v1.5
    paths:
      - '.github/workflows/neura-runner-disk-inventory.yml'
  pull_request:
    branches:
      - Neura
    paths:
      - '.github/workflows/neura-runner-disk-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Read-only runner volume inventory
    runs-on: [self-hosted, Windows, X64, neura]
    timeout-minutes: 10

    steps:
      # No checkout or marketplace action is used. This diagnostic must run
      # even when the runner cannot allocate space for an action download.
      - name: Report available filesystem volumes
        shell: 'powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Write-Host '=== Runner paths ==='
          Write-Host ("RUNNER_TEMP: {0}" -f $env:RUNNER_TEMP)
          Write-Host ("RUNNER_TOOL_CACHE: {0}" -f $env:RUNNER_TOOL_CACHE)
          Write-Host ("USERPROFILE: {0}" -f $env:USERPROFILE)

          Write-Host '=== Ready filesystem volumes ==='
          $readyDrives = [System.IO.DriveInfo]::GetDrives() |
            Where-Object { $_.IsReady } |
            Sort-Object -Property Name

          foreach ($drive in $readyDrives) {
            Write-Host (
              "{0} type={1} label='{2}' free={3:N2} GB used={4:N2} GB total={5:N2} GB" -f
              $drive.Name,
              $drive.DriveType,
              $drive.VolumeLabel,
              ($drive.AvailableFreeSpace / 1GB),
              (($drive.TotalSize - $drive.AvailableFreeSpace) / 1GB),
              ($drive.TotalSize / 1GB)
            )
          }

          Write-Host '=== Candidate CI output volumes ==='
          $candidates = $readyDrives |
            Where-Object {
              ($_.DriveType -eq [System.IO.DriveType]::Fixed -or
               $_.DriveType -eq [System.IO.DriveType]::Removable) -and
              $_.AvailableFreeSpace -ge 12GB
            }

          if ($candidates) {
            foreach ($drive in $candidates) {
              Write-Host (
                "Candidate: {0} ({1:N2} GB free)" -f
                $drive.Name,
                ($drive.AvailableFreeSpace / 1GB)
              )
            }
          } else {
            Write-Host 'No ready fixed or removable volume has at least 12 GB free.'
          }

          Write-Host '=== Inventory boundary ==='
          Write-Host 'No files, services, partitions, or volume settings were modified.'
