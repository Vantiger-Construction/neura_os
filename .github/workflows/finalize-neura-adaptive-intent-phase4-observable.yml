name: Finalize Neura Adaptive Intent Phase 4

on:
  push:
    branches:
      - agent/neura-adaptive-intent-os-v1.4

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: finalize-neura-adaptive-intent-phase4
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  WORK_BRANCH: agent/neura-adaptive-intent-os-v1.4

jobs:
  integrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}
          fetch-depth: 0

      - name: Announce observable run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 42 --body \
            "Phase 4 finalizer started: run ${GITHUB_RUN_ID} on ${GITHUB_SHA}."

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Apply staged Phase 4 integration
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/apply_neura_adaptive_intent_phase4.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/adaptive_intent/neura_live_signal_adapter.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'final quests = await QuestStore.instance.getQuests();',
              'final List<Quest> quests = '
              'await QuestStore.instance.getQuests();',
          )
          text = text.replace(
              'final done = await QuestStore.instance.getDone();',
              'final List<QuestDone> done = '
              'await QuestStore.instance.getDone();',
          )
          path.write_text(text, encoding='utf-8')
          PY
          test ! -e .ci/apply_neura_adaptive_intent_phase4.py
          test ! -e .ci/neura-adaptive-intent-phase4
          grep -q 'version: 1.4.0+7' pubspec.yaml
          grep -q 'NeuraAdaptiveIntentEntryScreen' \
            lib/modules/navigation/enhanced_navigation.dart
          grep -q 'adaptive intent shutdown' \
            lib/src/core/data_wipe_service.dart

      - name: Restore package language settings
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee phase4-pub-get.log

      - name: Apply safe analyzer fixes
        run: dart fix --apply

      - name: Apply canonical package-mode formatting
        run: |
          dart format \
            lib/adaptive_intent \
            lib/cognitive \
            lib/constitution \
            lib/intent_compiler \
            lib/dashboard/widgets/proactive_banner_card.dart \
            lib/modules/navigation/enhanced_navigation.dart \
            lib/src/core/data_wipe_service.dart \
            test/adaptive_intent \
            test/cognitive \
            test/constitution \
            test/intent_compiler

      - name: Require zero analyzer findings
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee phase4-analyze.log

      - name: Run focused Phase 4 tests
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded --timeout 90s \
            test/cognitive \
            test/constitution \
            test/intent_compiler \
            test/adaptive_intent \
            2>&1 | tee phase4-focused-tests.log

      - name: Run complete Neura Flutter suite
        shell: bash
        run: |
          set -o pipefail
          flutter test --concurrency 4 --timeout 2m \
            2>&1 | tee phase4-full-tests.log

      - name: Commit verified Phase 4
        shell: bash
        run: |
          set -euo pipefail
          cat > ADAPTIVE_INTENT_PHASE4_VALIDATION.md <<EOF
          # Neura Adaptive Intent OS Phase 4 validation

          - Source SHA: ${GITHUB_SHA}
          - GitHub Actions run: ${GITHUB_RUN_ID}
          - Flutter: ${FLUTTER_VERSION}
          - Package: 1.4.0+7
          - flutter pub get: PASS
          - package-mode Dart formatting: PASS
          - flutter analyze --fatal-infos: PASS
          - focused Phase 4 tests: PASS
          - complete Neura Flutter suite: PASS
          - live signals: opt-in, normalized, local-only values
          - outcome history: bounded and AES-GCM encrypted at rest
          - executable capability: reversible local quest after fresh approval
          - external, cloud, calendar, purchase, message, and money executors: absent
          EOF
          rm -f \
            .github/workflows/finalize-neura-adaptive-intent-phase4-observable.yml \
            phase4-pub-get.log \
            phase4-analyze.log \
            phase4-focused-tests.log \
            phase4-full-tests.log
          git config user.name "Neura Companion"
          git config user.email \
            "156997939+Vantiger1@users.noreply.github.com"
          git add -A
          git commit -m \
            "feat(adaptive-intent): build real-beta Phase 4"
          git push origin HEAD:${WORK_BRANCH}

      - name: Report failed Phase 4 run
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "## Phase 4 finalizer failed"
            echo
            echo "Run: ${GITHUB_RUN_ID}"
            echo "Source: ${GITHUB_SHA}"
            echo
            for log in \
              phase4-pub-get.log \
              phase4-analyze.log \
              phase4-focused-tests.log \
              phase4-full-tests.log; do
              if [[ -f "$log" ]]; then
                echo "### $log"
                echo '```text'
                tail -n 80 "$log"
                echo '```'
              fi
            done
          } > /tmp/phase4-failure.md
          gh pr comment 42 --body-file /tmp/phase4-failure.md
