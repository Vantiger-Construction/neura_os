name: neuro_companion
description: A lightweight mental wellness assistant.
version: 1.5.1+2
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.47.9'
dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  speech_to_text: ^7.5.0
  cryptography: ^2.9.0
  file_picker: ^13.3.1
  archive: ^4.6.0
  pdf: ^3.13.1
  cross_file: ^0.3.5+5
  lottie: ^3.8.1
  connectivity_plus: ^7.3.2
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  in_app_purchase: ^3.3.1
  supabase_flutter: 2.18.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # v10 must migrate existing v9 stores before a later v11 rollout.
  flutter_secure_storage: 10.3.4
  flutter_tts: ^4.2.5
  flutter_riverpod: ^3.4.3
  record: ^7.1.2
  uuid: ^4.6.0
  fl_chart: ^1.3.0
  printing: ^5.15.1
  window_manager_plus: ^1.0.5
  screen_retriever: ^0.2.2
  http: ^1.6.0
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path: ^1.9.1
  build_runner: ^2.17.1
  freezed: ^4.0.3
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  shared_preferences_platform_interface: 2.4.2
flutter:
  uses-material-design: true
  assets:
    - assets/audio/neura/
    - assets/audio/neura/envelopes/
    - assets/audio/neura/visemes/
    - assets/images/
    - assets/sounds/
    - assets/lottie/
    - assets/rive/
