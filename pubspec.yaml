name: neuro_companion
description: A lightweight mental wellness assistant.
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.0
  path_provider: ^2.1.2
  share_plus: ^7.0.0
  speech_to_text: ^6.3.0
  cryptography: ^2.7.0
  file_picker: ^10.3.3
  archive: ^4.0.7
  pdf: ^3.11.3
  cross_file: ^0.3.4
  lottie: ^3.1.2
  connectivity_plus: ^6.0.5
  image_picker: ^1.1.2
  local_auth: ^2.2.0
  in_app_purchase: ^3.2.0
  supabase_flutter: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.2
  flutter_tts: ^4.0.0
  flutter_riverpod: ^2.0.0
  record: ^6.0.0
  uuid: ^4.5.3
  fl_chart: ^0.69.0
  printing: ^5.13.4
  window_manager_plus: ^1.0.5
  screen_retriever: ^0.2.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  path_provider_platform_interface: ^2.0.0
  plugin_platform_interface: ^2.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/neura/
    - assets/audio/neura/envelopes/
    - assets/audio/neura/visemes/
    - assets/images/
    - assets/sounds/
    - assets/lottie/
    - assets/rive/
