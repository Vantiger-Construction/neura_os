name: neuro_companion
description: A lightweight mental wellness assistant.
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  flutter_sound: ^9.2.13
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.0
  path_provider: ^2.1.2
  share_plus: ^7.0.0
  speech_to_text: ^6.3.0
  cryptography: ^2.7.0
  file_picker: ^10.3.3
  archive: ^4.0.7
  pdf: ^3.11.3
  cross_file: ^0.3.4
  lottie: ^3.1.2
  rive: ^0.13.20
  connectivity_plus: ^6.0.5
  image_picker: ^1.1.2
  local_auth: ^2.2.0
  in_app_purchase: ^3.2.0
  firebase_auth: ^5.0.0
  firebase_storage: ^12.0.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  firebase_core: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.2
  flutter_tts: ^4.0.0
  flutter_riverpod: ^2.0.0
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/neura/
    - assets/audio/neura/envelopes/
    - assets/audio/neura/visemes/
    - assets/images/
    - assets/sounds/
    - assets/lottie/
    - assets/rive/
