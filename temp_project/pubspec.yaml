name: neura_companion
description: A lightweight mental wellness assistant.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # audioplayers: ^6.0.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.2.0
  path_provider: ^2.1.2
  share_plus: ^12.0.1
  cryptography: ^2.7.0
  file_picker: ^10.3.8
  archive: ^4.0.7
  pdf: ^3.11.3
  cross_file: ^0.3.4
  cloud_firestore: ^5.0.0
  fl_chart: ^0.70.0
  firebase_auth: ^5.0.0
