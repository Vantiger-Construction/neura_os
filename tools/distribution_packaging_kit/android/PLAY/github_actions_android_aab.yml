name: Android AAB (Release)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build AAB (release)
        run: flutter build appbundle --release

      - name: Upload artifact (AAB)
        uses: actions/upload-artifact@v6
        with:
          name: appbundle
          path: build/app/outputs/bundle/release/*.aab

  # Optional: auto-upload to Play using fastlane (requires PLAY_SERVICE_ACCOUNT_JSON)
  upload-play:
    needs: build-aab
    runs-on: ubuntu-latest
    if: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download AAB artifact
        uses: actions/download-artifact@v7
        with:
          name: appbundle
          path: ./artifact

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Decode service account
        run: |
          echo "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" | base64 -d > play-sa.json

      - name: Upload to Internal track
        env:
          PACKAGE_NAME: ${{ secrets.PLAY_PACKAGE_NAME }}
        run: |
          fastlane supply             --package_name "$PACKAGE_NAME"             --aab "./artifact/$(ls ./artifact | head -n 1)"             --json_key "./play-sa.json"             --track "internal"             --skip_upload_metadata true             --skip_upload_images true             --skip_upload_screenshots true
